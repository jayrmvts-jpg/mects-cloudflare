                                                    )}

                                                    <td className="px-2 py-2 text-center align-middle">
                                                        <button disabled={isCapaMode} onClick={() => deleteRow(row.id)} className={`p-1.5 rounded-lg transition-colors ${isCapaMode ? 'text-gray-300 cursor-not-allowed' : 'text-red-500 hover:text-red-700 hover:bg-red-50 focus:ring-2 focus:ring-red-500/30'}`} title={isCapaMode ? "Disable CAPA Phase to delete rows." : "Permanently Delete Node"}>
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>

                    {/* ---------------- FULL-SCREEN DMAIC MODAL OVERLAY ---------------- */}
                    {showDmaicView && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-md p-4 sm:p-6 overflow-y-auto modal-animate">
                            <div className="bg-white rounded-2xl shadow-2xl border-2 border-slate-300 w-full max-w-5xl overflow-hidden flex flex-col max-h-full">
                                <div className="px-6 py-5 border-b-2 border-gray-200 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-lg sm:text-xl font-black text-gray-900 uppercase tracking-widest flex items-center">
                                        <svg className="w-6 h-6 mr-3 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                        DMAIC Executive Summary
                                    </h2>
                                    <button onClick={() => setShowDmaicView(false)} className="text-gray-500 hover:text-red-600 transition-colors p-1" title="Close Dashboard">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                
                                <div className="overflow-y-auto bg-white flex-1">
                                    <DmaicTracker isCapaMode={isCapaMode} reduction={dynamicMetrics.reductionVal} />
                                    <DmaicDataPanel fmeaData={fmeaData} originalData={originalData} isCapaMode={isCapaMode} reduction={dynamicMetrics.reductionVal} metricsList={dynamicMetrics.metrics} />
                                </div>

                                <div className="px-6 py-5 bg-gray-50 border-t-2 border-gray-200 flex justify-center sm:justify-end">
                                    <button onClick={() => setShowDmaicView(false)} className="w-full sm:w-auto px-10 py-3 bg-slate-900 text-white text-sm font-black uppercase tracking-widest rounded-lg hover:bg-blue-700 transition-all shadow-lg border-2 border-slate-950 hover:border-blue-900">
                                        Close & Return to Grid
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
