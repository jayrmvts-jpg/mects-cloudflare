<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECTS - Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white p-6 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase leading-none">MECTS</h1>
                <p class="text-[10px] text-cyan-400 font-bold tracking-[0.3em] uppercase mt-1">Executive Dashboard</p>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black py-2 px-6 rounded-full transition-all active:scale-95 uppercase tracking-widest">
                Logout
            </button>
        </div>
    </nav>

    <main class="flex-grow p-6 md:p-12 max-w-7xl mx-auto w-full">
        <header class="mb-12">
            <h2 class="text-4xl font-black text-slate-900 tracking-tight italic">Operational Excellence Suite</h2>
            <p class="text-slate-500 font-semibold mt-2">Select an executive asset to begin deployment.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <button onclick="window.location.href='anova.html'" 
                    class="group bg-white border-b-8 border-blue-900 p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all active:scale-95 text-left">
                <div class="text-4xl mb-4 text-blue-900">📊</div>
                <h3 class="text-2xl font-black text-slate-900 uppercase">ANOVA Analysis</h3>
                <p class="text-slate-500 text-sm mt-2 font-medium leading-relaxed">Statistical variance diagnostics and engine performance analytics.</p>
                <div class="mt-6 text-blue-900 font-black text-xs uppercase tracking-widest group-hover:translate-x-2 transition-transform">Launch Asset →</div>
            </button>

            <button onclick="window.location.href='assessments.html'" 
                    class="group bg-white border-b-8 border-blue-900 p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all active:scale-95 text-left">
                <div class="text-4xl mb-4 text-blue-900">📝</div>
                <h3 class="text-2xl font-black text-slate-900 uppercase">Assessment Hub</h3>
                <p class="text-slate-500 text-sm mt-2 font-medium leading-relaxed">Proficiency evaluations and technical skill-gap assessments.</p>
                <div class="mt-6 text-blue-900 font-black text-xs uppercase tracking-widest group-hover:translate-x-2 transition-transform">Launch Asset →</div>
            </button>

            <button onclick="window.location.href='vsm.html'" 
                    class="group bg-white border-b-8 border-blue-900 p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all active:scale-95 text-left">
                <div class="text-4xl mb-4 text-blue-900">🛠️</div>
                <h3 class="text-2xl font-black text-slate-900 uppercase">VSM Activities</h3>
                <p class="text-slate-500 text-sm mt-2 font-medium leading-relaxed">Value Stream Mapping and lean process optimization tools.</p>
                <div class="mt-6 text-blue-900 font-black text-xs uppercase tracking-widest group-hover:translate-x-2 transition-transform">Launch Asset →</div>
            </button>

        </div>
    </main>

    <footer class="p-8 text-center bg-slate-50 border-t border-slate-200">
        <p class="text-slate-400 font-black tracking-[0.4em] uppercase text-[10px]">MECTS • SET • GO • LEAN</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmm9CtegBIxFIuovOKk76ifmLueACHQWs",
            authDomain: "mects-login-lss-msme.firebaseapp.com",
            projectId: "mects-login-lss-msme",
            appId: "1:338870341775:web:f5a5e783ae59a538b725c8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("index.html");
            }
        });

        // Logout
        window.logout = () => {
            signOut(auth).then(() => {
                window.location.replace("index.html");
            });
        };
    </script>
</body>
</html>
