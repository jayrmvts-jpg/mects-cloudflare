<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECTS - Pareto Analysis & DMAIC Engine</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Prop-Types -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- HTML2PDF for Direct PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800;1,900&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(250, 204, 21, 0.4); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(250, 204, 21, 0.8); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .text-glow-yellow { text-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .text-glow-white { text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .text-glow-red { text-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
        .text-glow-green { text-shadow: 0 0 15px rgba(34, 197, 94, 0.6); }

        .recharts-bar-rectangle { transition: all 0.3s ease; }
        .recharts-bar-rectangle:hover { opacity: 0.8; }

        /* Aggressive PDF Printing Utilities to Prevent Data Bleed */
        .avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; display: block; }
        .page-break-before { page-break-before: always !important; }
        
        @media print { 
            .no-print { display: none !important; } 
            body { background-color: white !important; color: black !important; } 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ComposedChart, ReferenceLine, Cell } = Recharts;

        // --- 1. DATA DICTIONARIES ---
        const INDUSTRY_THEMES = {
            'Manufacturing': ['Piston Gap > 0.5mm', 'Paint Scratch', 'Weld Porosity', 'Missing Bolt', 'Wrong Color', 'Bent Frame', 'Oil Leak', 'Torque Failure', 'Label Misalignment', 'Burr/Sharp Edge', 'Coolant Contamination', 'Packaging Seal Fail', 'Micro-crack Surface', 'Hydraulic Drift'],
            'Call Center': ['Hold Time > 3m', 'Call Dropped', 'Wrong Script Used', 'Transfer Failure', 'Agent Tone', 'No Resolution', 'IVR Routing Loop', 'Audio Jitter', 'Verification Fail', 'Escalation Miss', 'Knowledge Base Gap', 'Language Barrier', 'Wait Time Spike', 'Background Noise'],
            'IT Service': ['Password Reset', 'VPN Disconnect', 'Laptop Freeze', 'Printer Offline', 'Software Crash', 'Email Sync Delay', 'Wifi Signal Weak', 'Access Denied', 'Blue Screen (BSOD)', 'API Latency', 'Database Lock', 'Patch Update Fail'],
            'Sales/Finance': ['Wrong Pricing Quote', 'Contract Draft Error', 'Missed Lead Follow-up', 'Unauthorized Discount', 'Proposal Late', 'Invoicing Delay', 'Billing Discrepancy', 'Lead Source Lost', 'CRM Sync Conflict'],
            'Data Dept': ['Typo/Spelling', 'Missing Mandatory Field', 'Duplicate Customer ID', 'Wrong Date Format', 'Entry Lag Time', 'Validation Error', 'Phone Format Conflict', 'Address Logic Fail'],
            'Healthcare': ['Medication Error', 'Patient Wait Time', 'Wrong Diagnosis Code', 'Equipment Failure', 'Lab Delay', 'Missing Chart', 'Billing Code Error', 'Bed Turnover Delay', 'Sanitation Miss', 'Discharge Delay', 'Staff Shortage', 'Vitals Entry Error'],
            'Logistics': ['Late Delivery', 'Damaged Goods', 'Wrong Destination', 'Inventory Discrepancy', 'Route Deviation', 'Customs Delay', 'Missing Paperwork', 'Pallet Collapse', 'Vehicle Breakdown', 'Fuel Inefficiency', 'Overweight Cargo', 'Scanning Error'],
            'E-Commerce': ['Cart Abandonment', 'Payment Gateway Fail', 'Out of Stock', 'Shipping Delay', 'Wrong Item Shipped', 'Return Processing Lag', 'Promo Code Error', 'UI Glitch', 'Load Time > 3s', 'Search Failure', 'Missing Image', 'Review Moderation Delay'],
            'Construction': ['Material Shortage', 'Safety Violation', 'Blueprint Rework', 'Concrete Cure Failure', 'Permit Delay', 'Weather Delay', 'Equipment Breakdown', 'Dimension Mismatch', 'Subcontractor No-Show', 'Budget Overrun', 'Inspection Fail', 'Weld Defect'],
            'Food & Beverage': ['Temperature Excursion', 'Spoiled Ingredient', 'Packaging Leak', 'Recipe Deviation', 'Underweight Yield', 'Cross-Contamination', 'Mislabeling', 'Equipment Jam', 'pH Level Out of Spec', 'Foreign Object', 'Texture Failure', 'Visual Defect'],
            'Automotive': ['Paint Blemish', 'Panel Gap', 'Torque Fail', 'Missing Fastener', 'Electronic Glitch', 'Upholstery Tear', 'Glass Scratch', 'Engine Misfire', 'Transmission Fluid Leak', 'Sensor Malfunction', 'Alignment Issue', 'Battery Fault'],
            'Aviation': ['Rivet Missing', 'Composite Delamination', 'Avionics Glitch', 'Hydraulics Leak', 'Engine Blade Wear', 'Cabin Pressure Drop', 'Landing Gear Fault', 'Fuel Line Blockage', 'Software Redundancy Fail', 'APU Restart Fail', 'Documentation Missing', 'Inspection Lapse'],
            'Banking': ['Transaction Reversal', 'Loan Approval Delay', 'KYC Rejection', 'Fraud False Positive', 'ATM Downtime', 'Network Timeout', 'Data Breach Alert', 'Account Sync Error', 'Interest Calc Error', 'Card Issuance Delay', 'SWIFT Fail', 'Overdraft Anomaly'],
            'Software Dev': ['Build Failure', 'Regression Bug', 'Syntax Error', 'Merge Conflict', 'Memory Leak', 'UI/UX Inconsistency', 'Dependency Missing', 'High Latency', 'Security Vulnerability', 'Unhandled Exception', 'Deployment Rollback', 'QA Test Fail'],
            'Hospitality': ['Overbooking', 'Room Not Cleaned', 'Check-in Delay', 'Keycard Fail', 'Room Service Error', 'HVAC Malfunction', 'Noise Complaint', 'Wi-Fi Disconnect', 'Billing Dispute', 'Reservation Sync Lag', 'Concierge Miss', 'Maintenance Delay'],
            'Telecomm': ['Dropped Connection', 'High Ping/Latency', 'SIM Activation Delay', 'Billing Glitch', 'Port-In Fail', 'Hardware Fault', 'Fiber Cut', 'Signal Interference', 'Router Reboot Loop', 'Bandwidth Throttling', 'Authentication Fail', 'Voicemail Error'],
            'Energy': ['Pipeline Pressure Drop', 'Valve Leak', 'Pump Cavitation', 'Sensor Drift', 'Turbine Vibration', 'Grid Voltage Sag', 'Transformer Trip', 'Filter Clog', 'Flare Stack Anomaly', 'Material Fatigue', 'Seal Rupture', 'Emission Spike'],
            'Education': ['Enrollment Glitch', 'Roster Mismatch', 'Grade Entry Error', 'LMS Server Crash', 'Course Material Missing', 'Assessment Auto-grade Fail', 'Credential Sync Delay', 'Payment Processing Fail', 'Video Stream Buffer', 'Attendance Log Missing', 'System Access Denied', 'Feedback Delay']
        };

        const KEYWORDS = {
            time: ['wait', 'hold', 'delay', 'late', 'lag', 'spike', 'time', 'slow', 'downtime', 'buffer', 'turnover'],
            physical: ['weld', 'gap', 'bent', 'scratch', 'leak', 'bolt', 'seal', 'crack', 'noise', 'jitter', 'warp', 'void', 'piston', 'pallet', 'concrete', 'temperature', 'rivet', 'blemish', 'valve', 'turbine', 'vibration', 'hardware', 'equipment', 'material'],
            commercial: ['quote', 'price', 'pricing', 'discount', 'billing', 'invoice', 'contract', 'rebate', 'terms', 'loan', 'payment', 'overdraft', 'budget'],
            digital: ['error', 'fail', 'crash', 'system', 'vpn', 'api', 'bug', 'db', 'login', 'sync', 'latency', 'timeout', 'glitch', 'software', 'network', 'router', 'gateway', 'server', 'code'],
            human: ['tone', 'conduct', 'script', 'resolution', 'verification', 'typo', 'missing', 'language', 'violation', 'dispute', 'complaint', 'roster', 'patient', 'staff', 'subcontractor'],
            locational: ['address', 'location', 'site', 'coordinate', 'territory', 'routing', 'dept', 'transfer', 'destination', 'route']
        };

        const UNIT_LABELS = {
            'Manufacturing': { unit: 'Units Produced', opp: 'Opportunities per Unit' },
            'Call Center': { unit: 'Calls Handled', opp: 'Opportunities per Call' },
            'IT Service': { unit: 'Tickets Resolved', opp: 'Opportunities per Ticket' },
            'Sales/Finance': { unit: 'Transactions/Quotes', opp: 'Opportunities per Transaction' },
            'Data Dept': { unit: 'Records Processed', opp: 'Opportunities per Record' },
            'Healthcare': { unit: 'Patient Encounters', opp: 'Opportunities per Encounter' },
            'Logistics': { unit: 'Shipments Delivered', opp: 'Opportunities per Shipment' },
            'E-Commerce': { unit: 'Orders Processed', opp: 'Opportunities per Order' },
            'Construction': { unit: 'Tasks Completed', opp: 'Opportunities per Task' },
            'Food & Beverage': { unit: 'Batches Produced', opp: 'Opportunities per Batch' },
            'Automotive': { unit: 'Vehicles Assembled', opp: 'Opportunities per Vehicle' },
            'Aviation': { unit: 'Flights/Inspections', opp: 'Opportunities per Inspection' },
            'Banking': { unit: 'Transactions Processed', opp: 'Opportunities per Transaction' },
            'Software Dev': { unit: 'Code Commits/Sprints', opp: 'Opportunities per Commit' },
            'Hospitality': { unit: 'Room Nights Booked', opp: 'Opportunities per Room Night' },
            'Telecomm': { unit: 'Network Sessions', opp: 'Opportunities per Session' },
            'Energy': { unit: 'Megawatt Hours Generated', opp: 'Opportunities per MWh' },
            'Education': { unit: 'Student Enrollments', opp: 'Opportunities per Enrollment' }
        };

        // --- 2. GLOBAL HELPERS ---
        const safeRender = (val) => {
            if (val === null || val === undefined) return '-';
            if (typeof val === 'number') return isNaN(val) ? 'Err' : (Number.isInteger(val) ? val.toString() : val.toFixed(2));
            return String(val);
        };

        const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 }).format(val);

        const CustomizedAxisTickLight = (props) => {
            const { x, y, payload, index } = props;
            const verticalOffset = index % 2 === 0 ? 18 : 36; 
            return (
                <g transform={`translate(${x},${y})`}>
                    <text x={0} y={0} dy={verticalOffset} textAnchor="middle" fill="#4b5563" fontSize={10} fontWeight={600} className="uppercase">
                        {payload ? safeRender(payload.value) : ''}
                    </text>
                </g>
            );
        };

        const CustomizedAxisTickDark = (props) => {
            const { x, y, payload, index } = props;
            const verticalOffset = index % 2 === 0 ? 18 : 36; 
            return (
                <g transform={`translate(${x},${y})`}>
                    <text x={0} y={0} dy={verticalOffset} textAnchor="middle" fill="#9CA3AF" fontSize={10} fontWeight={600} className="uppercase">
                        {payload ? safeRender(payload.value) : ''}
                    </text>
                </g>
            );
        };

        // --- 3. HYPER-LOGIC DYNAMIC ENGINES ---
        const getHyperRCA = (label) => {
            const l = typeof label === 'string' ? label.toLowerCase() : "unspecified issue";
            if (KEYWORDS.locational.some(k => l.includes(k))) return [`The system accepted an incorrect '${label}' entry.`, "The data was typed manually without checking if it exists.", "There is no tool connected to verify the location in real-time.", "Validation steps are skipped because they take too long to do manually.", `Root Cause: The process relies on human memory instead of a verified digital database for '${label}'.` ];
            if (KEYWORDS.time.some(k => l.includes(k))) return [`People are waiting too long because of '${label}'.`, "The volume of work is higher than the number of people available.", "The staff schedule doesn't match the times when work spikes happen.", "We didn't have a plan to handle this specific busy period.", `Root Cause: The staffing model is fixed and cannot adjust to real-time spikes in '${label}'.` ];
            if (KEYWORDS.physical.some(k => l.includes(k))) return [`The part failed the quality check for '${label}'.`, "The machine or tool moved out of place during work.", "A part became loose because of heat or vibration.", "The sensors didn't stop the machine when the problem started.", `Root Cause: Maintenance checks happen on a fixed schedule instead of checking for actual wear on '${label}'.` ];
            if (KEYWORDS.commercial.some(k => l.includes(k))) return [`The client found a mistake in the '${label}'.`, "The staff member used an old price list or template.", "The new rules weren't updated on everyone's computer at the same time.", "There is no single place where all the correct prices are stored.", `Root Cause: We lack a shared digital 'Source of Truth' for accurate '${label}' data.` ];
            if (KEYWORDS.digital.some(k => l.includes(k))) return [`The technology reported a critical '${label}'.`, "The infrastructure was overloaded by simultaneous requests.", "Redundancy protocols failed to failover smoothly.", "Testing phases missed this specific high-load edge case.", `Root Cause: The CI/CD or deployment pipeline for '${label}' lacks load-stress regression gates.` ];
            return [`The work result for '${label}' was outside our quality limits.`, "The instructions for this step are not clear enough for everyone.", "Errors are not being caught until the very end of the process.", "We depend on people being 'careful' instead of building checks into the system.", `Root Cause: The '${label}' process lacks a simple, foolproof check (Poka-Yoke) to block mistakes.` ];
        };

        const getHyperSolutions = (label) => {
            const l = typeof label === 'string' ? label.toLowerCase() : "";
            if (KEYWORDS.locational.some(k => l.includes(k))) return [`Auto-Lookup: Link the entry form to a verified address database.`, `Smart Fields: Use dropdown menus instead of letting people type '${label}'.`, `Validation Gate: Block the 'Submit' button if the '${label}' is not verified.`, `Fuzzy Matching: Use software to suggest the correct '${label}' as they type.`, `Map Verification: Show a visual map to the user to confirm '${label}' accuracy.` ];
            if (KEYWORDS.time.some(k => l.includes(k))) return [`Demand Matching: Change staff shifts to match when '${label}' spikes happen.`, `RPA Bot: Use a software bot to handle simple '${label}' tasks instantly.`, `Cross-Training: Teach other teams how to help when '${label}' gets busy.`, `Real-time Tracker: Install a simple dashboard showing the current '${label}' wait time.`, `Backlog Trigger: Create a 'Code Red' plan to pull in extra help for '${label}'.` ];
            if (KEYWORDS.physical.some(k => l.includes(k))) return [`Auto-Stop: Install a sensor that stops the tool if '${label}' is detected.`, `Daily Micro-Check: Make a 2-minute check part of every operator's morning.`, `Fixed Jigs: Use a mechanical guide so '${label}' can only go in one way.`, `Visual Alarms: Use a red light to show when '${label}' is moving out of spec.`, `Condition Alerts: Send an alert to maintenance based on machine hours for '${label}'.` ];
            if (KEYWORDS.commercial.some(k => l.includes(k))) return [`Central Cloud: Move all pricing to one shared folder that updates for everyone.`, `Two-Set of Eyes: Require a manager's sign-off for any big '${label}' changes.`, `Locked Templates: Password-protect the templates so old math isn't used for '${label}'.`, `Error Audit: Review the last 10 '${label}' errors to see exactly where we failed.`, `Form Masking: Only allow numbers in the '${label}' field to stop typing errors.` ];
            if (KEYWORDS.digital.some(k => l.includes(k))) return [`Auto-Scaling: Set cloud servers to automatically add power during '${label}' spikes.`, `Fail-over Protocols: Build a backup system that kicks in instantly when '${label}' occurs.`, `Unit Testing: Force developers to write automated tests preventing '${label}'.`, `Monitoring Dashboards: Install Datadog/NewRelic alerts specifically for '${label}'.`, `Rate Limiting: Slow down incoming traffic automatically to prevent a full '${label}'.` ];
            return [`Visual Aids: Put a picture of a 'good' vs 'bad' result at the '${label}' station.`, `Step-by-Step: Update the SOP to be a simple checklist for '${label}'.`, `System Block: Add a digital step that prevents moving on if '${label}' is wrong.`, `Training Camp: Hold a short 'huddle' to train everyone on the new '${label}' rule.`, `Audit Cycle: Check 5 random samples of '${label}' every single day.` ];
        };

        // --- 4. ICON & TOOLTIP HELPER ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                target: "M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z",
                arrowLeft: "M19 12H5M12 19l-7-7 7-7",
                printer: "M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z",
                gitMerge: "M7 15a3 3 0 100-6 3 3 0 000 6z M17 9a3 3 0 100-6 3 3 0 000 6z M7 9V5a3 3 0 013-3h4M7 15v4a3 3 0 003 3h4",
                checkCircle: "M22 11.08V12a10 10 0 11-5.93-9.14 M22 4L12 14.01l-3-3",
                lightbulb: "M9 21h6M12 2v3M5 9h1M18 9h1M6.3 4.3l.7.7M17 17l.7.7",
                trash: "M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2",
                refresh: "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15",
                fileText: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6",
                chart: "M18 20V10M12 20V4M6 20v-6",
                settings: "M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z M12 15a3 3 0 100-6 3 3 0 000 6z",
                table: "M3 3h18v18H3z M3 9h18 M3 15h18 M9 3v18 M15 3v18",
                activity: "M22 12h-4l-3 9L9 3l-3 9H2",
                globe: "M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z M2 12H22 M12 2C14.5013 4.73835 15.9228 8.29203 16 12C15.9228 15.708 14.5013 19.2616 12 22C9.49872 19.2616 8.07725 15.708 8 12C8.07725 8.29203 9.49872 4.73835 12 2Z",
                upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12",
                dollar: "M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
                sigma: "M18 4H6l6 8-6 8h12",
                download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3",
                info: "M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z M12 16V12 M12 8H12.01"
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d={icons[name] || ""} />
                </svg>
            );
        };

        const InfoTooltip = ({ text }) => (
            <div className="relative flex items-center group ml-1 inline-block no-print z-[100]">
                <Icon name="info" size={12} className="text-gray-500 hover:text-yellow-400 cursor-help transition-colors" />
                <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block w-56 p-2.5 bg-gray-800 border border-gray-700 text-white text-[10px] rounded-lg shadow-2xl normal-case tracking-normal z-[100] font-medium leading-relaxed">
                    {text}
                    <div className="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-gray-800"></div>
                </div>
            </div>
        );

        const PremiumHeader = () => (
            <div className="w-full bg-[#0a0a0a] border-b border-yellow-500/30 shadow-[0_4px_30px_rgba(250,204,21,0.1)] py-8 px-10 flex flex-col md:flex-row justify-between items-center relative overflow-hidden no-print">
                <div className="absolute top-0 left-1/4 w-96 h-96 bg-yellow-500/5 rounded-full blur-[100px] pointer-events-none"></div>

                <div className="flex flex-col items-start gap-1 z-10 w-full md:w-auto">
                    <h1 className="flex items-baseline italic uppercase font-black text-yellow-400 tracking-tighter transform -skew-x-12 text-glow-yellow">
                        <span className="text-5xl md:text-6xl mr-3">MECTS</span>
                        <span className="text-4xl md:text-5xl mr-3 text-yellow-50">SET</span>
                        <span className="text-3xl md:text-4xl mr-3 tracking-widest text-yellow-500/60">....</span>
                        <span className="text-4xl md:text-5xl text-white text-glow-white">GO</span>
                        <span className="text-2xl tracking-widest text-yellow-500/60 ml-1">....</span>
                    </h1>
                    <h2 className="text-[11px] md:text-[13px] font-bold text-white uppercase tracking-[0.25em] mt-3 opacity-90 border-l-2 border-yellow-500 pl-3">
                        Managing Effective Corporate Training Solutions
                    </h2>
                </div>
                
                <div className="flex flex-col items-end gap-2 mt-6 md:mt-0 z-10">
                    <div className="bg-[#111] border border-yellow-500/20 px-6 py-3 rounded-lg shadow-lg flex flex-col items-end">
                        <span className="text-yellow-400 font-black tracking-[0.3em] uppercase text-sm mb-1">Pareto Analysis Engine</span>
                        <a href="https://www.mects.in" target="_blank" rel="noopener noreferrer" className="text-white font-bold tracking-widest hover:text-yellow-400 transition-colors text-[11px] uppercase flex items-center gap-2">
                            <Icon name="globe" size={12} /> WWW.MECTS.IN
                        </a>
                    </div>
                </div>
            </div>
        );

        // --- ISOLATED REPORT SUB-COMPONENTS (PREVENTS RECHARTS CRASH) ---
        const CustomTooltip = ({ active, payload, label, costPerDefect, targetReduction }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-gray-900 border border-gray-700 p-4 rounded-lg shadow-2xl backdrop-blur-md bg-opacity-95 z-50">
                        <p className="text-white font-bold text-xs uppercase mb-2 border-b border-gray-700 pb-2">{label}</p>
                        <p className="text-gray-300 text-xs mb-1">Current Freq: <span className="text-white font-bold">{payload[0].value}</span></p>
                        {payload[1] && <p className="text-green-400 text-xs mb-1">Target Freq: <span className="font-bold">{payload[1].value.toFixed(0)}</span></p>}
                        <p className="text-yellow-400 text-xs font-bold">Cumulative: {payload[2] ? payload[2].value.toFixed(1) : (payload[1] && payload[1].dataKey === 'cumulativePercentage' ? payload[1].value.toFixed(1) : 0)}%</p>
                        <p className="text-red-400 text-xs font-bold mt-2 pt-2 border-t border-gray-700">COPQ Loss: {formatCurrency(payload[0].value * costPerDefect)}</p>
                    </div>
                );
            }
            return null;
        };

        const ReportHeaderBlock = ({ title, selectedTheme }) => (
            <div className="border-b-4 border-black pb-4 mb-6 bg-white no-print">
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h1 className="text-3xl font-black uppercase tracking-tighter text-gray-900">{title}</h1>

                        <img 
                            src="mects shield logo.jpeg" 
                            alt="MECTS" 
                            className="h-12 w-auto object-contain" 
                            onError={(e) => { 
                                e.target.onerror = null; 
                                e.target.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='; 
                                e.target.style.display = 'none';
