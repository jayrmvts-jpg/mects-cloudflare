        const MacroVSMTimeline = ({ steps, metrics, activeUnit, supplierName, customerName, theme, mapMode, printMode = false }) => {

            steps.forEach((step, index) => {

                elements.push(

                        <polygon points="-20,-20 20,-20 0,20" fill="white" stroke="#000" strokeWidth="2"/>
                        <text x="0" y="-8" style={{fontSize: '14px', fontWeight: '900', fill: '#000'}} textAnchor="middle">I</text>

                elements.push(

                elements.push(

                        <text x="6" y="15" style={{fontSize: '10px', fontWeight: '700', fill: '#000'}}>C/T: {metrics.convertValue(step.totalCT)}{unitSuffix}</text>
                        <text x="6" y="36" style={{fontSize: '10px', fontWeight: '700', fill: '#000'}}>C/O: {metrics.convertValue(step.changeoverSec)}{unitSuffix}</text>
                        <text x="6" y="57" style={{fontSize: '10px', fontWeight: '700', fill: '#000'}}>Uptime: {step.uptimePct}%</text>
                        <text x="6" y="78" style={{fontSize: '10px', fontWeight: '700', fill: '#000'}}>Defect: {step.defectPct}%</text>

                );

                if (index < steps.length - 1) {
                    if (theme.isFsm) {
                        elements.push(<g key={`pull-${index}`} transform={`translate(${currentX + 135}, ${processY + 15})`}><polygon points="0,5 35,5 35,-3 50,10 35,23 35,15 0,15" fill="#fef08a" stroke="#000" strokeWidth="2" strokeDasharray="2,2"/><text x="25" y="-10" style={{fontSize: '9px', fontWeight: '900', fill: '#854d0e'}} textAnchor="middle">PULL</text></g>);
                    } else {
                        elements.push(<g key={`push-${index}`} transform={`translate(${currentX + 135}, ${processY + 15})`}><polygon points="0,0 35,0 35,-8 50,10 35,28 35,20 0,20" fill="white" stroke="#000" strokeWidth="2" /></g>);
                    }
                } else {
                    elements.push(<g key={`push-end`} transform={`translate(${currentX + 135}, ${processY + 25}) rotate(-35)`}><polygon points="0,0 55,0 55,-8 70,10 55,28 55,20 0,20" fill="white" stroke="#000" strokeWidth="2" /></g>);
                }

                ladderPath += ` L ${currentX} ${ladderY - 30}`;
                elements.push(<text key={`tw-${index}`} x={currentX - 50} y={ladderY - 40} style={{fontSize: '11px', fontWeight: '900', fill: theme.hex}} textAnchor="middle">{parseFloat(Number(step.calculatedWaitDays).toFixed(2))}d</text>);
                ladderPath += ` L ${currentX} ${ladderY} L ${currentX + 120} ${ladderY}`;
                elements.push(<text key={`tc-${index}`} x={currentX + 60} y={ladderY + 20} style={{fontSize: '11px', fontWeight: '900', fill: '#000'}} textAnchor="middle">{metrics.convertValue(step.totalCT)}{unitSuffix}</text>);
                ladderPath += ` L ${currentX + 120} ${ladderY - 30}`;
                currentX = nextX;
            });
            ladderPath += ` L ${currentX - 50} ${ladderY - 30}`;

            return (
                <div className={`${printMode ? '' : 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-6'} overflow-hidden relative`}>
                    {!printMode && <h3 className="text-sm text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2"><Icon name="fast-forward" className={theme.textDark} size={18} /> {theme.prefix} Architecture Map</h3>}
                    <div className={`relative w-full ${printMode ? '' : 'overflow-x-auto shadow-inner bg-slate-50/50 rounded-xl p-4'}`}>
                        <svg viewBox={`0 0 ${totalWidth} ${height}`} className="block mx-auto" style={{width: '100%', height: printMode ? 'auto' : 'auto', minWidth: printMode ? '0' : `${Math.max(900, totalWidth)}px`}}>
                            <defs><marker id={`arrowhead-${mapMode}`} markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill={theme.hex} /></marker></defs>
                            <path d={ladderPath} fill="none" stroke="#000" strokeWidth="3" strokeLinejoin="round" />
                            {elements}
                            <g transform={`translate(${totalWidth - 140}, ${ladderY - 30})`}>
                                <rect x="0" y="-25" width="120" height="50" rx="4" fill="white" stroke="#000" strokeWidth="2" />
                                <text x="60" y="-8" style={{fontSize: '10px', fontWeight: '900', fill: theme.hex}} textAnchor="middle">{theme.prefix.toUpperCase()} PLT: {metrics.totalWaitDays}d</text>
                                <text x="60" y="12" style={{fontSize: '10px', fontWeight: '900', fill: '#000'}} textAnchor="middle">{theme.prefix.toUpperCase()} VAT: {metrics.displayVA}{unitSuffix}</text>
                            </g>
                        </svg>
                    </div>

                    {/* VSM ARCHITECTURE MAP LEGEND */}
                    {!printMode && (
                    <div className="mt-5 pt-4 border-t border-slate-200 flex flex-wrap gap-4 md:gap-6 text-[8px] font-black uppercase tracking-widest text-slate-500 justify-center">
                        <div className="flex items-center gap-1.5"><Icon name="building" size={12}/> External Entity</div>
                        <div className="flex items-center gap-1.5"><div className={`w-3 h-3 ${theme.bg} border border-black`}></div> {theme.isFsm ? 'Heijunka Control' : 'MRP / Push Control'}</div>
                        <div className="flex items-center gap-1.5">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="currentColor" strokeWidth="2" style={{transform: 'rotate(180deg)'}}><polygon points="12 2 22 20 2 20 12 2"/></svg> WIP Queue
                        </div>
                        <div className="flex items-center gap-1.5"><div className={`w-4 border-t-2 ${theme.border} border-dashed`}></div> Info Flow</div>
                        <div className="flex items-center gap-1.5">
                             <div className={`w-4 h-2 border border-black ${theme.isFsm ? 'bg-yellow-200' : 'bg-white'}`}></div> {theme.isFsm ? 'Pull Loop' : 'Push Arrow'}
                        </div>
                        <div className="flex items-center gap-1.5"><span className={theme.textDark}>#.#d</span> Wait Time (Peak)</div>
                        <div className="flex items-center gap-1.5"><span className="text-black">#.#s</span> Cycle Time (Trough)</div>
                    </div>
                    )}
                </div>
            );
        };

        const YamazumiChart = ({ steps, metrics, activeUnit, theme, printMode = false }) => {
            const unitSuffix = activeUnit === 'sec' ? 's' : (activeUnit === 'min' ? 'm' : 'd');
            const maxCT = steps.length > 0 ? Math.max(...steps.map(s => s.totalCT)) : 0;
            const yMax = Math.max(metrics.taktTimeSec, maxCT) * 1.25 || 100; 

            return (
                <div className={`${printMode ? '' : 'bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200 mt-6'} overflow-hidden relative`}>
                    {!printMode && (
                        <div className="flex justify-between items-end mb-6">
                            <h3 className="text-sm text-slate-800 font-black uppercase tracking-widest flex items-center gap-2"><Icon name="bar-chart-2" className={theme.textDark} size={18} /> {theme.prefix} Yamazumi (CT)</h3>
                            <div className="flex gap-4 text-[9px] uppercase font-black text-slate-500 tracking-widest">
                                <span className="flex items-center gap-1"><div className="w-2 h-2 bg-black rounded-sm"></div> Manual CT</span>
                                <span className="flex items-center gap-1"><div className={`w-2 h-2 ${theme.bg} rounded-sm`}></div> Machine CT</span>
                            </div>
                        </div>
                    )}
                    {printMode && (
                        <div className="flex justify-between items-end mb-2 border-b border-slate-300 pb-1">
                            <h3 className="text-[10px] font-black uppercase text-slate-500">{theme.prefix} Yamazumi Balance</h3>
                            <div className="flex gap-2 text-[8px] uppercase font-black text-slate-500">
                                <span className="flex items-center gap-1"><div className="w-2 h-2 bg-black rounded-sm"></div> Manual CT</span>
                                <span className="flex items-center gap-1"><div className={`w-2 h-2 ${theme.bg} rounded-sm`}></div> Machine CT</span>
                            </div>
                        </div>
                    )}

                    <div className={`w-full flex items-end justify-around relative border-b-2 border-l-2 border-slate-200 pb-0 pl-2 pr-6 ${printMode ? 'h-56 pt-10' : 'h-64 pt-6'}`}>
                        <div className="absolute left-1 top-0 bottom-0 w-8 flex flex-col justify-between text-[8px] font-mono font-black text-slate-400 -ml-10 items-end py-2"><span>{metrics.convertValue(yMax)}</span><span>{metrics.convertValue(yMax * 0.5)}</span><span>0</span></div>
                        <div className="absolute left-0 right-0 border-t-2 border-dashed border-red-500 z-10 transition-all duration-500 flex items-center" style={{bottom: `${(metrics.taktTimeSec / yMax) * 100}%`}}>
                            <div className="absolute right-0 translate-x-full ml-2 text-red-600 text-[10px] font-black uppercase tracking-widest whitespace-nowrap bg-red-50 px-2 py-0.5 rounded border border-red-200 shadow-sm">{theme.prefix.toUpperCase()} TAKT: {metrics.displayTakt}{unitSuffix}</div>
                        </div>
                        {steps.map((step, idx) => {
                            const manualPct = (step.manualCT / yMax) * 100; const machinePct = (step.machineCT / yMax) * 100; const isOverTakt = step.totalCT > metrics.taktTimeSec && metrics.taktTimeSec > 0;
                            return (
                                <div key={`yamazumi-bar-${idx}`} className="flex flex-col items-center w-16 md:w-24 group relative h-full justify-end z-20">
                                    {!printMode && (
                                        <div className={`absolute bottom-full mb-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black text-white text-[9px] p-2 rounded shadow-lg pointer-events-none whitespace-nowrap z-30 text-center font-mono font-black border ${theme.border}`}>
                                            Total: {metrics.convertValue(step.totalCT)}{unitSuffix}<br/>
                                            <span className={theme.isFsm ? 'text-white' : 'text-blue-400'}>Man: {metrics.convertValue(step.manualCT)}</span> | <span className={theme.isFsm ? 'text-yellow-400' : 'text-emerald-400'}>Mach: {metrics.convertValue(step.machineCT)}</span>
                                        </div>
                                    )}
                                    {printMode && (
                                        <div className="absolute bottom-full mb-1 text-center w-full z-30 pointer-events-none whitespace-nowrap">
                                            <div className="text-[10px] font-black text-black leading-none">{metrics.convertValue(step.totalCT)}{unitSuffix}</div>
                                        </div>
                                    )}
                                    <div className={`w-full ${theme.isFsm ? 'bg-yellow-400 border border-yellow-500' : 'bg-emerald-400 border border-emerald-500'} transition-all duration-500`} style={{height: `${machinePct}%`}}></div>
                                    <div className={`w-full ${theme.isFsm ? 'bg-black' : 'bg-blue-600'} transition-all duration-500 rounded-t-none rounded-sm`} style={{height: `${manualPct}%`}}></div>
                                    {isOverTakt && !printMode && <div className="absolute -top-6 text-red-500 animate-bounce"><Icon name="alert-triangle" size={16} /></div>}
                                    <div className="absolute top-full mt-2 text-[8px] font-black uppercase tracking-widest text-slate-500 text-center truncate w-full px-1">{step.name}</div>
                                </div>
                            );
                        })}
                    </div>
                    {!printMode && <div className="mt-8 text-[9px] font-black text-slate-400 text-center w-full uppercase tracking-widest">Target Line Balance Efficiency (LBE): {metrics.lbe}%</div>}
                </div>
            );
        };

        function App() {
            // UNIFIED STATE MANAGEMENT
            const [mapMode, setMapMode] = useState('csm'); 
            const [activeTab, setActiveTab] = useState('map');
            const [selectedIndustry, setSelectedIndustry] = useState('user_defined');
            const [activeUnit, setActiveUnit] = useState('sec');
            const unitSuffix = activeUnit === 'sec' ? 's' : (activeUnit === 'min' ? 'm' : 'd');

            const [customerDemand, setCustomerDemand] = useState("");
            const [workingHours, setWorkingHours] = useState("");
            const [plannedDowntimeMin, setPlannedDowntimeMin] = useState("");
            const [supplierName, setSupplierName] = useState("");
            const [customerName, setCustomerName] = useState("");
            const [capaRecords, setCapaRecords] = useState([]);
            const [isExportingExcel, setIsExportingExcel] = useState(false);
            const [isExportingPDF, setIsExportingPDF] = useState(false);
            
            // SYSTEM ALERT STATE (Threshold Pop-Ups & Errors)
            const [systemAlert, setSystemAlert] = useState(null);
            
            const [activeParamKey, setActiveParamKey] = useState('takt');
            const reportRef = useRef(null);

            // UNIFIED THEME CONFIGURATION
            const theme = useMemo(() => ({
                isFsm: mapMode === 'fsm',
                prefix: mapMode === 'fsm' ? 'Target' : 'Current',
                bg: mapMode === 'fsm' ? 'bg-yellow-500' : 'bg-emerald-500',
                textMain: mapMode === 'fsm' ? 'text-yellow-400' : 'text-emerald-400',
                textDark: mapMode === 'fsm' ? 'text-yellow-600' : 'text-emerald-600',
                border: mapMode === 'fsm' ? 'border-yellow-500' : 'border-emerald-500',
                hex: mapMode === 'fsm' ? '#eab308' : '#10b981',
                btnClass: mapMode === 'fsm' ? 'bg-yellow-500 text-black hover:bg-yellow-400' : 'bg-emerald-500 text-white hover:bg-emerald-400',
                headerBg: mapMode === 'fsm' ? 'bg-black text-white' : 'bg-slate-900 text-white',
                waitWarn: mapMode === 'fsm' ? 0.5 : 1.5,
                waitCrit: mapMode === 'fsm' ? 1.5 : 3.0,
                coWarn: mapMode === 'fsm' ? 300 : 900,
                coCrit: mapMode === 'fsm' ? 600 : 1800,
                lbeOpt: mapMode === 'fsm' ? 90 : 85,
                oeeOpt: mapMode === 'fsm' ? 95 : 90
            }), [mapMode]);

            const triggerAlert = (type, msg) => { 
                setSystemAlert({type, msg}); 
                setTimeout(() => setSystemAlert(null), 5000); 
            };

            const upgradeSteps = (data, demand) => data.map(s => {
                const mCt = Number(s.manualCT) || 0, aCt = Number(s.machineCT) || 0;
                const coSec = s.changeoverSec !== undefined ? Number(s.changeoverSec) : (Number(s.changeoverMin) || 0) * 60;
                const avail = Number(s.uptimePct !== undefined ? s.uptimePct : 100) / 100;
                const qual = (100 - Number(s.defectPct !== undefined ? s.defectPct : 0)) / 100;
                return { ...s, manualCT: mCt, machineCT: aCt, totalCT: mCt + aCt, changeoverSec: coSec, calculatedWaitDays: demand > 0 ? (Number(s.inventoryPieces) / demand) : 0, operators: Number(s.operators) || 1, stepOEE: parseFloat((avail * qual * 100).toFixed(1)).toString() };
            });

            const [steps, setSteps] = useState(() => upgradeSteps(INDUSTRY_TEMPLATES['user_defined'].steps, 0));

            // Initialize explicitly to blank state
            useEffect(() => {
                setWorkingHours("8");
                setPlannedDowntimeMin("0");
                setCustomerDemand("0");
                setSteps(upgradeSteps(INDUSTRY_TEMPLATES['user_defined'].steps, 0));
            }, []);

            // CORE DYNAMIC CALCULATION ENGINE
            const metrics = useMemo(() => {
                const numD = Number(customerDemand) || 0, numH = Number(workingHours) || 0, numDown = Number(plannedDowntimeMin) || 0;
                const nat = Math.max(1, (numH * 3600) - (numDown * 60));
                const takt = numD > 0 ? nat / numD : 0;
                let totalInv = 0, totalMan = 0, totalOee = 0, totalVA = 0, totalCT = 0;

                const auditedSteps = steps.map(s => {
                    const stepCT = (Number(s.manualCT) || 0) + (Number(s.machineCT) || 0);
                    const wait = numD > 0 ? (Number(s.inventoryPieces) || 0) / numD : 0;
                    totalInv += Number(s.inventoryPieces || 0);
                    totalMan += (Number(s.manualCT) || 0) * (Number(s.operators) || 1);
                    totalCT += stepCT;
                    totalVA += Math.min(Number(s.vatSec || 0), stepCT);
                    const avail = Number(s.uptimePct || 100) / 100, qual = (100 - Number(s.defectPct || 0)) / 100;
                    totalOee += (avail * qual);
                    return { ...s, totalCT: stepCT, calculatedWaitDays: wait, stepOEE: parseFloat((avail * qual * 100).toFixed(1)).toString() };
                });

                const leadTimeSec = (numD > 0 ? (totalInv / numD) * nat : 0) + totalCT;
                const convert = (sec) => {
                    if (sec === undefined || sec === null || Number.isNaN(Number(sec))) return "0";
                    let val = Number(sec);
                    if (activeUnit === 'min') val /= 60;
                    if (activeUnit === 'day') val /= nat;
                    return parseFloat(val.toFixed(activeUnit === 'day' ? 4 : 2)).toString();
                };
                const getEditValue = (sec) => {
                    if (sec === "" || sec === undefined || sec === null || Number.isNaN(Number(sec))) return "";
                    let val = Number(sec);
                    if (activeUnit === 'min') val /= 60;
                    if (activeUnit === 'day') val /= nat;
                    return parseFloat(val.toFixed(4)).toString(); 
                };

                const rty = auditedSteps.reduce((acc, step) => acc * ((100 - Number(step.defectPct || 0)) / 100), 1) * 100;
                const maxCT = Math.max(0, ...auditedSteps.map(s => s.totalCT));
                const lbe = (maxCT > 0 && auditedSteps.length > 0) ? (totalCT / (maxCT * auditedSteps.length)) * 100 : 0;

                return {
                    takt, displayTakt: convert(takt), displayLead: convert(leadTimeSec), displayVA: convert(totalVA), displayManual: convert(totalMan),
                    streamOEE: auditedSteps.length > 0 ? parseFloat(((totalOee / auditedSteps.length) * 100).toFixed(1)).toString() : "0",
                    avgUptime: auditedSteps.length > 0 ? parseFloat((auditedSteps.reduce((a,c)=>a+Number(c.uptimePct),0)/auditedSteps.length).toFixed(1)).toString() : "0",
                    avgQuality: auditedSteps.length > 0 ? parseFloat((auditedSteps.reduce((a,c)=>a+(100-Number(c.defectPct)),0)/auditedSteps.length).toFixed(1)).toString() : "0",
                    varPercentage: leadTimeSec > 0 ? parseFloat(((totalVA / leadTimeSec) * 100).toFixed(2)).toString() : "0",
                    rty: parseFloat(rty.toFixed(1)).toString(), lbe: parseFloat(lbe.toFixed(1)).toString(),
                    totalInv, auditedSteps, convertValue: convert, getEditValue, nat,

                                     <div className="flex bg-black/50 p-1 rounded-lg border border-white/10 mr-2">
                                        {['sec', 'min', 'day'].map(u => <button key={u} onClick={() => setActiveUnitAndClearRaw(u)} className={`px-3 py-1 rounded text-[8px] font-black tracking-widest uppercase ${activeUnit === u ? theme.bg + (theme.isFsm ? ' text-black' : ' text-white') : 'text-slate-400'}`}>{u}</button>)}
                                     </div>
                                     <button onClick={exportToPDF} disabled={isExportingPDF} className="bg-red-600 hover:bg-red-500 text-white font-black text-[9px] px-4 py-2 rounded-md flex items-center gap-2 active:bg-red-700 transition-all">
                                        <Icon name={isExportingPDF ? "loader-2" : "file-text"} size={12} className={isExportingPDF ? "animate-spin" : ""} /> PDF
                                     </button>
                                     <button onClick={exportToExcel} disabled={isExportingExcel} className={`${theme.btnClass} font-black text-[9px] px-4 py-2 rounded-md flex items-center gap-2 transition-all`}>
                                        <Icon name={isExportingExcel ? "loader-2" : "download"} size={12} className={isExportingExcel ? "animate-spin" : ""} /> EXCEL
                                     </button>
                                     <select value="" onChange={(e) => handleSimulation(e.target.value)} className={`bg-slate-900 ${theme.textMain} font-black border ${theme.border} rounded-md px-4 py-2 text-[9px] uppercase outline-none cursor-pointer shadow-inner`} title="Simulate different system states">
                                        <option value="" disabled className="bg-slate-900 text-white">Simulation Mode...</option>
                                        <option value="baseline" className="bg-slate-900 text-white">Baseline Reset</option>
                                        <option value="perfect" className="bg-slate-900 text-white">Perfect Math (Robust)</option>
                                        <option value="breakeven" className="bg-slate-900 text-white">Break Even Point (At Takt)</option>
                                        <option value="pathetic" className="bg-slate-900 text-white">Pathetic (Chaos)</option>
                                     </select>
                                 </div>
                            </div>
                        </header>

                        <main className="max-w-[1400px] mx-auto p-4 space-y-6">
                            {activeTab === 'map' && (
                                <div className="space-y-6 animate-in fade-in duration-300">
                                    <div className={`${theme.headerBg} p-4 rounded-2xl border ${theme.border} flex flex-col md:flex-row items-center justify-between gap-4 transition-colors`}>
                                        <div className="flex items-center gap-4"><Icon name="layout-template" className={`${theme.textMain} animate-pulse`} size={24} /><div><div className={`text-sm font-black uppercase tracking-tight ${theme.textMain}`}>{theme.prefix} Architecture</div><div className="text-[8px] font-black tracking-[0.2em] uppercase opacity-70">Unified Mode</div></div></div>
                                        <select className="bg-slate-900 border border-slate-700 text-white rounded-xl px-6 py-2 text-sm font-black outline-none w-full md:w-72 shadow-inner cursor-pointer" value={selectedIndustry} onChange={handleIndustryChange}>
                                            {Object.entries(INDUSTRY_TEMPLATES).map(([k, v]) => <option key={k} value={k} className="bg-slate-900 text-white">{v.label}</option>)}
                                        </select>
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-5 gap-4">
                                        <div className="col-span-1 md:col-span-2"><label className="text-[9px] text-slate-400 font-black uppercase tracking-widest block mb-2" title="Define the starting and ending points of this value stream">{theme.prefix} Boundary Control</label><div className="flex items-center gap-2"><input value={supplierName} onChange={e=>setSupplierName(e.target.value)} placeholder="Supplier Name" className={`w-full bg-slate-50 p-2 text-xs border font-black rounded-lg outline-none focus:${theme.border} placeholder:text-slate-300`} title="Raw Material Origin" /><Icon name="arrow-right" size={14} className="text-slate-300 shrink-0" /><input value={customerName} onChange={e=>setCustomerName(e.target.value)} placeholder="Customer Name" className={`w-full bg-slate-50 p-2 text-xs font-black border rounded-lg outline-none focus:${theme.border} placeholder:text-slate-300`} title="Final Delivery Point" /></div></div>
                                        <div className="text-center md:text-left"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center justify-center md:justify-start">{theme.prefix} Demand <FormulaHover formula="Customer Requirement per Shift" /></label><input type="number" value={customerDemand} onChange={e=>handleGlobalChange('Demand', e.target.value)} onFocus={e => e.target.select()} className={`w-full font-black text-lg p-1.5 bg-slate-50 border-slate-200 border-2 rounded-xl text-slate-800 text-center outline-none focus:${theme.border}`} title="Total units required by the customer" /></div>
                                        <div className="text-center md:text-left"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center justify-center md:justify-start">Shift Hours <FormulaHover formula="Gross Shift Time" /></label><input type="number" value={workingHours} onChange={e=>handleGlobalChange('Shift Hours', e.target.value)} onFocus={e => e.target.select()} className={`w-full font-black text-lg p-1.5 bg-slate-50 border rounded-xl text-center outline-none focus:${theme.border}`} title="Gross operating hours" /></div>
                                        <div className="text-center md:text-left"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center justify-center md:justify-start">Downtime (min) <FormulaHover formula="Planned Breaks + Meetings" /></label><input type="number" value={plannedDowntimeMin} onChange={e=>handleGlobalChange('Downtime', e.target.value)} onFocus={e => e.target.select()} className={`w-full font-black text-lg p-1.5 bg-slate-50 border rounded-xl text-center outline-none focus:${theme.border}`} title="Planned non-production minutes" /></div>
                                    </div>
                                    
                                    <div className="bg-slate-900 rounded-xl p-3 flex justify-between items-center text-white shadow-inner border border-slate-800" title={`Calculated as: (${workingHours || 0} hours * 60) - ${plannedDowntimeMin || 0} mins`}>
                                        <div className="flex items-center gap-3">
                                           <Icon name="clock" size={16} className={theme.textMain} />
                                           <span className="text-xs uppercase tracking-widest font-black text-slate-300">{theme.prefix} Net Available Time (NAT)</span>
                                        </div>
                                        <div className={`text-xl font-mono font-black tracking-tighter ${theme.textMain}`}>
                                            {metrics.convertValue(metrics.nat)}{unitSuffix}
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-4">
                                        <KpiBox label={`${theme.prefix} Takt`} value={`${metrics.displayTakt}${unitSuffix}`} sub="Required Pace" iconName="target" formula="NAT ÷ Demand" />
                                        <KpiBox label={`${theme.prefix} Lead`} value={`${metrics.displayLead}${unitSuffix}`} sub="End-to-End" iconName="fast-forward" health={pltHealth} formula="Σ Wait Time + Σ Cycle Time" />
                                        <KpiBox label={`${theme.prefix} Load`} value={`${metrics.displayManual}${unitSuffix}`} sub="Staffing Load" iconName="user" formula="Σ (Manual CT × Headcount)" />
                                        <KpiBox label="Stream OEE" value={`${metrics.streamOEE}%`} sub="Equip Health" iconName="cpu" health={oeeHealth} formula="Availability × Quality" />
                                        <KpiBox label="VA Ratio" value={`${metrics.varPercentage}%`} sub="Utilization" iconName="trending-up" health={vaHealth} formula="(VAT ÷ Lead Time) × 100" />
                                        <KpiBox label="RTY %" value={`${metrics.rty}%`} sub="Rolled Yield" iconName="check-circle" health={rtyHealth} formula="Π (1 - Defect Rate)" />
                                        <KpiBox label="LBE %" value={`${metrics.lbe}%`} sub="Line Balance" iconName="boxes" health={lbeHealth} formula="Σ CT ÷ (Max CT × Steps)" />
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative">
                                        <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                                            <h2 className="text-lg font-black uppercase tracking-tight">{theme.prefix} Engineering Matrix</h2>
                                            <div className="flex items-center gap-4">
                                                <div className="hidden md:flex gap-3 text-[8px] uppercase font-black text-slate-500 tracking-widest mr-2">
                                                    <span className="flex items-center gap-1"><div className="w-2 h-2 rounded border border-slate-200 bg-slate-50"></div> Optimal</span>
                                                    <span className="flex items-center gap-1"><div className="w-2 h-2 rounded border border-amber-400 bg-amber-50"></div> Warning</span>
                                                    <span className="flex items-center gap-1"><div className="w-2 h-2 rounded border border-red-500 bg-red-50"></div> Critical Risk</span>
                                                </div>
                                                <button onClick={addStep} className={`${theme.headerBg} border ${theme.border} px-4 py-2 rounded-lg flex items-center gap-2 text-[10px] font-black shadow-md transition-colors`}><Icon name="plus" size={12} /> ADD PROCESS</button>
                                            </div>
                                        </div>
                                        <div className="max-h-[600px] overflow-y-auto overflow-x-auto w-full">
                                            <table className="w-full border-separate border-spacing-y-3">
                                                <thead className="sticky top-0 bg-white z-[40] shadow-sm"><tr className="text-[9px] font-black text-slate-400 uppercase tracking-widest text-left whitespace-nowrap">
                                                    <th className="px-3 py-2 text-center" title="Process Sequence Number">SEQ</th>
                                                    <th className="px-3 py-2 min-w-[200px]" title="Name of the manufacturing or transactional process">{theme.prefix} PROCESS</th>
                                                    <th className="px-3 py-2 text-center"><div className="flex items-center justify-center gap-1" title="Units waiting before this process">INV QTY</div></th>
                                                    <th className="px-3 py-2 text-center"><div className="flex items-center justify-center gap-1" title="Inventory / Demand">WAIT (D)</div></th>
                                                    <th className="px-3 py-2 text-center"><div className="flex items-center justify-center gap-1" title="Human interaction cycle time">MANUAL CT</div></th>
                                                    <th className="px-3 py-2 text-center"><div className="flex items-center justify-center gap-1" title="Automated cycle time">MACHINE CT</div></th>
                                                    <th className="px-3 py-2 text-center"><div className="flex items-center justify-center gap-1" title="Value Adding Time (must be <= Cycle Time)">VAT ({unitSuffix})</div></th>
                                                    <th className="px-3 py-2 text-center" title="Equipment Availability %">UPTIME %</th>
                                                    <th className="px-3 py-2 text-center" title="Scrap or Rework %">DEFECT %</th>
                                                    <th className="px-3 py-2 text-center" title="Overall Equipment Effectiveness">OEE %</th>
                                                    <th className="px-3 py-2 text-center" title="Setup or Changeover Time"><div className="flex items-center justify-center gap-1">C/O ({unitSuffix})</div></th>
                                                    <th className="px-3 py-2 text-center" title="Operators Required">HC</th>
                                                    <th></th>
                                                </tr></thead>
                                                <tbody>{metrics.auditedSteps.map((s, i) => {
                                                    const isOverTakt = s.totalCT > metrics.taktTimeSec && metrics.taktTimeSec > 0 && (Number(customerDemand)||0) > 0;
                                                    const isWarningTakt = s.totalCT > (metrics.taktTimeSec * 0.8) && !isOverTakt && (Number(customerDemand)||0) > 0;
                                                    const ctClass = isOverTakt ? 'border-red-500 text-red-600 bg-red-50' : (isWarningTakt ? 'border-amber-400 text-amber-600 bg-amber-50' : 'border-slate-200');
                                                    const waitVal = Number(s.calculatedWaitDays);
                                                    const waitHealth = waitVal > theme.waitCrit ? 'text-red-600 bg-red-50' : (waitVal > theme.waitWarn ? 'text-amber-600 bg-amber-50' : 'text-slate-900');
                                                    const upVal = Number(s.uptimePct);
                                                    const upHealth = upVal < 85 ? 'text-red-600 bg-red-50 border-red-500' : (upVal < 95 ? 'text-amber-600 bg-amber-50 border-amber-400' : 'text-slate-900 border-slate-200');
                                                    const defVal = Number(s.defectPct);
                                                    const defHealth = defVal > 10 ? 'text-red-600 bg-red-50 border-red-500' : (defVal > 5 ? 'text-amber-600 bg-amber-50 border-amber-400' : 'text-slate-900 border-slate-200');
                                                    const oeeVal = Number(s.stepOEE);
                                                    const oeeHealth = oeeVal < 75 ? 'text-red-600' : (oeeVal < 85 ? 'text-amber-600' : 'text-slate-900');
                                                    const coVal = Number(s.changeoverSec);
                                                    const coHealth = coVal > theme.coCrit ? 'text-red-600 bg-red-50 border-red-500' : (coVal > theme.coWarn ? 'text-amber-600 bg-amber-50 border-amber-400' : 'text-slate-900 border-slate-200');

                                                    return (
                                                    <tr key={s.id} className="bg-slate-50 hover:bg-white transition-all shadow-sm rounded-xl group border border-slate-100 whitespace-nowrap">
                                                        <td className="p-3 text-slate-400 text-center text-sm font-black">{i+1}</td>
                                                        <td className="p-3"><input value={s.name} onChange={e=>handleStepChange(s.id, 'name', e.target.value)} onFocus={e => e.target.select()} className={`w-full bg-white p-2 border font-black border-slate-200 rounded-md text-xs outline-none focus:${theme.border}`} title={`Process ${i+1} Name`} /></td>
                                                        <td className="p-3 text-center"><input type="number" value={s.inventoryPieces_raw !== undefined ? s.inventoryPieces_raw : s.inventoryPieces} onChange={e=>handleStepChange(s.id, 'inventoryPieces', e.target.value)} onFocus={e => e.target.select()} className={`w-20 bg-white border border-slate-200 rounded-md p-2 text-center text-xs outline-none focus:${theme.border} font-black`} title="Inventory Units" /></td>
                                                        <td className={`p-3 text-center text-xs rounded-lg font-black ${waitHealth}`} title={`${parseFloat(waitVal.toFixed(2))} Days Wait`}>{parseFloat(waitVal.toFixed(2))}</td>
                                                        <td className="p-3 text-center"><input type="number" step="0.01" value={s.manualCT_raw !== undefined ? s.manualCT_raw : metrics.getEditValue(s.manualCT)} onChange={e=>handleStepChange(s.id, 'manualCT', e.target.value)} onFocus={e => e.target.select()} className={`w-20 font-black bg-white border rounded-md p-2 text-center text-xs outline-none focus:${theme.border} ${ctClass}`} title={`Manual Cycle Time`} /></td>
                                                        <td className="p-3 text-center"><input type="number" step="0.01" value={s.machineCT_raw !== undefined ? s.machineCT_raw : metrics.getEditValue(s.machineCT)} onChange={e=>handleStepChange(s.id, 'machineCT', e.target.value)} onFocus={e => e.target.select()} className={`w-20 font-black bg-slate-100 border rounded-md p-2 text-center text-xs outline-none focus:${theme.border} ${ctClass}`} title={`Machine Cycle Time`} /></td>
                                                        <td className="p-3 text-center"><input type="number" step="0.01" value={s.vatSec_raw !== undefined ? s.vatSec_raw : metrics.getEditValue(s.vatSec)} onChange={e=>handleStepChange(s.id, 'vatSec', e.target.value)} onFocus={e => e.target.select()} className={`w-20 bg-slate-100 border border-slate-300 rounded-md p-2 text-center text-xs outline-none focus:${theme.border} font-black text-slate-800`} title="Value Added Time" /></td>
                                                        <td className="p-3 text-center"><input type="number" step="0.1" value={s.uptimePct_raw !== undefined ? s.uptimePct_raw : s.uptimePct} onChange={e=>handleStepChange(s.id, 'uptimePct', e.target.value)} onFocus={e => e.target.select()} className={`w-16 font-black border rounded-md p-2 text-center text-xs outline-none focus:${theme.border} ${upHealth}`} title="Availability %" /></td>
                                                        <td className="p-3 text-center"><input type="number" step="0.1" value={s.defectPct_raw !== undefined ? s.defectPct_raw : s.defectPct} onChange={e=>handleStepChange(s.id, 'defectPct', e.target.value)} onFocus={e => e.target.select()} className={`w-16 font-black border rounded-md p-2 text-center text-xs outline-none focus:${theme.border} ${defHealth}`} title="Defect Rate %" /></td>
                                                        <td className={`p-3 text-center text-xs font-black ${oeeHealth}`} title="Overall Equipment Effectiveness">{s.stepOEE}%</td>
                                                        <td className="p-3 text-center"><input type="number" step="0.01" value={s.changeoverSec_raw !== undefined ? s.changeoverSec_raw : metrics.getEditValue(s.changeoverSec)} onChange={e=>handleStepChange(s.id, 'changeoverSec', e.target.value)} onFocus={e => e.target.select()} className={`w-20 font-black bg-white border rounded-md p-2 text-center text-xs outline-none focus:${theme.border} ${coHealth}`} title="Setup / Changeover Time" /></td>
                                                        <td className="p-3 text-center"><input type="number" value={s.operators_raw !== undefined ? s.operators_raw : s.operators} onChange={e=>handleStepChange(s.id, 'operators', e.target.value)} onFocus={e => e.target.select()} className={`w-16 font-black bg-white border border-slate-200 rounded-md p-2 text-center text-xs outline-none focus:${theme.border} text-slate-900`} title="Headcount" /></td>
                                                        <td className="p-3 text-center"><button onClick={()=>removeStep(s.id)} className="text-slate-300 hover:text-red-600 transition-all"><Icon name="trash-2" size={16}/></button></td>
                                                    </tr>
                                                )})}</tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <MacroVSMTimeline steps={metrics.auditedSteps} metrics={metrics} activeUnit={activeUnit} supplierName={supplierName} customerName={customerName} theme={theme} mapMode={mapMode} />
                                    <YamazumiChart steps={metrics.auditedSteps} metrics={metrics} activeUnit={activeUnit} theme={theme} />
                                </div>
                            )}

                            {activeTab === 'insights' && (
                                <div className="space-y-6 animate-in slide-in-from-bottom duration-300">
                                    <div className={`${theme.headerBg} p-8 rounded-2xl border-b-8 ${theme.border} shadow-sm relative overflow-hidden flex items-center justify-between`}>
                                        <div className="z-10">
                                            <h2 className={`text-2xl font-black ${theme.textMain} uppercase leading-none`}>{theme.prefix} Waste Diagnostics</h2>
                                            <div className="text-slate-300 mt-2 text-xs font-bold">Identifying systemic operational losses.</div>
                                        </div>
                                        <Icon name="zap" size={100} className="absolute -right-4 -bottom-4 text-white/5" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <SummaryTile label={`${theme.prefix} MUDA (Waste)`} count={wasteSummary.muda} color="red" iconName="layers" desc="Flow stagnation risks" />
                                        <SummaryTile label={`${theme.prefix} MURA (Unevenness)`} count={wasteSummary.mura} color="yellow" iconName="activity" desc="Changeover limits" />
                                        <SummaryTile label={`${theme.prefix} MURI (Overburden)`} count={wasteSummary.muri} color="black" iconName="alert-triangle" desc="Constraint failure" />
                                    </div>
                                    <div className="space-y-3">
                                        {wastes.length === 0 ? <div className={`bg-white border border-dashed ${theme.border} p-8 text-center rounded-xl shadow-sm`}><Icon name="check-circle" size={32} className={`${theme.textDark} mx-auto mb-3`} /><h3 className={`text-lg font-black uppercase ${theme.textDark}`}>Operations Optimal</h3></div> : 
                                          wastes.map((w, idx) => <WasteCard key={idx} waste={w} />)
                                        }
                                    </div>
                                </div>
                            )}

                            {activeTab === 'capa' && (
                                <div className="space-y-6 animate-in slide-in-from-bottom duration-300">
                                    <div className={`${theme.headerBg} p-8 rounded-2xl border-b-8 ${theme.border} shadow-sm relative overflow-hidden flex items-center justify-between`}>
                                        <div className="relative z-10">
                                            <h2 className={`text-2xl font-black ${theme.textMain} uppercase`}>Kaizen Implementation Engine</h2>
                                            <div className="text-slate-300 mt-1 text-[10px] font-black uppercase tracking-widest">{theme.prefix} Transition Planning</div>
                                        </div>
                                        <Icon name="rocket" size={80} className="text-white/5 absolute -right-2 -bottom-2" />
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                        <h3 className="text-xs font-black text-slate-900 uppercase tracking-widest flex items-center gap-2"><Icon name="globe-2" size={16} className={theme.textDark} /> System Resiliency Triggers</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                            {Object.keys(EXTERNAL_LOGIC).map(factor => (
                                                <button key={factor} onClick={() => triggerExt(factor)} className={`p-3 ${theme.headerBg} rounded-lg text-[9px] font-black uppercase tracking-wider ${theme.isFsm ? 'hover:bg-yellow-500 hover:text-black' : 'hover:bg-emerald-500 hover:text-white'} transition-all shadow-sm`}>
                                                    {factor}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-1 space-y-4">
                                            <h3 className="text-xs font-black uppercase tracking-widest flex items-center gap-2 border-l-4 border-red-500 pl-3">Design Interventions</h3>
                                            {capaSuggestions.length === 0 ? <div className="p-6 bg-slate-50 border border-dashed border-slate-200 rounded-xl text-center text-slate-500 font-black text-[10px] uppercase">Zero Gaps Detected</div> : 
                                                capaSuggestions.map(s => (
                                                <div key={s.id} className="p-4 bg-white rounded-xl border-l-4 border-red-500 shadow-sm flex flex-col gap-2 transition-all">
                                                    <div className="text-[9px] font-black text-red-600 bg-red-50 px-2 py-0.5 rounded-full uppercase self-start">{s.type}</div>
                                                    <div className="text-sm font-black text-slate-900">{s.step}</div>
                                                    <div className="text-[10px] font-bold text-slate-600 leading-snug">{s.issue}</div>
                                                    <button onClick={() => createCapa(s)} className={`mt-2 w-full ${theme.btnClass} text-[9px] font-black py-2 rounded-md transition-all shadow-sm`}>ADD TO KAIZEN PLAN</button>
                                                </div>
                                                ))
                                            }
                                        </div>
                                        <div className="lg:col-span-2 space-y-4">
                                            <h3 className={`text-xs font-black uppercase tracking-widest flex items-center gap-2 border-l-4 ${theme.border} pl-3`}>Active Log</h3>
                                            {capaRecords.length === 0 ? <div className="p-20 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl text-center flex flex-col items-center gap-4 text-slate-400"><Icon name="search" size={48} /><div className="uppercase font-black tracking-[0.2em] text-xs">No Active Initiatives</div></div> : 
                                                capaRecords.map(c => (
                                                <div key={c.id} className={`bg-white p-6 rounded-2xl shadow-sm border-t-4 ${theme.border} space-y-4 animate-in slide-in-from-right duration-300`}>
                                                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                                        <div className="flex items-center gap-3"><div className={`p-2 ${theme.bg}/20 ${theme.textDark} rounded-lg shadow-sm`}><Icon name="target" size={16} /></div><h4 className="text-sm font-black text-slate-900 uppercase tracking-tight">{c.step} - KAIZEN</h4></div>
                                                        <button onClick={() => setCapaRecords(capaRecords.filter(r=>r.id!==c.id))} className="text-slate-300 hover:text-red-600 transition-all"><Icon name="trash-2" size={16}/></button>
                                                    </div>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                        <div className="space-y-2"><label className="text-[9px] font-black uppercase tracking-widest border-b border-slate-100 pb-1 flex items-center gap-1.5"><Icon name="book-open" size={12} /> Lean Principle Applied</label><textarea className={`w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-900 outline-none focus:${theme.border} min-h-[80px]`} value={c.rootCause} onChange={e=>setCapaRecords(capaRecords.map(r=>r.id===c.id?{...r, rootCause:e.target.value}:r))} /></div>
                                                        <div className="space-y-2"><label className="text-[9px] font-black uppercase tracking-widest border-b border-slate-100 pb-1 flex items-center gap-1.5"><Icon name="hammer" size={12} /> Implementation Action</label><textarea className={`w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-900 outline-none focus:${theme.border} min-h-[80px]`} value={c.correctiveAction} onChange={e=>setCapaRecords(capaRecords.map(r=>r.id===c.id?{...r, correctiveAction:e.target.value}:r))} /></div>
                                                    </div>
                                                    <div className="flex flex-col md:flex-row justify-between items-center pt-3 border-t border-slate-100 gap-3">
                                                        <div className="flex gap-4">
                                                            <div className="flex flex-col"><span className="text-[8px] text-slate-400 font-black uppercase mb-0.5">Status</span><select className={`text-xs ${theme.textDark} outline-none bg-transparent cursor-pointer font-black`} value={c.status} onChange={e=>setCapaRecords(capaRecords.map(r=>r.id===c.id?{...r, status:e.target.value}:r))}><option className="bg-white text-slate-900">Planned</option><option className="bg-white text-slate-900">In Progress</option><option className="bg-white text-slate-900">Verified</option><option className="bg-white text-slate-900">Complete</option></select></div>
                                                            <div className="flex flex-col"><span className="text-[8px] text-slate-400 font-black uppercase mb-0.5">Owner</span><input className={`text-xs text-slate-900 outline-none placeholder:text-slate-300 w-32 bg-transparent border-b border-transparent focus:${theme.border} font-black`} placeholder="Lead Name..." value={c.owner} onChange={e=>setCapaRecords(capaRecords.map(r=>r.id===c.id?{...r, owner:e.target.value}:r))} /></div>
                                                        </div>
                                                        <div className="text-[8px] text-slate-400 font-black uppercase tracking-widest bg-slate-100 px-2 py-1 rounded-md border border-slate-200">ID: {c.id}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'learn' && (
                                <div className="space-y-6 animate-in fade-in duration-300">
                                    <div className={`${theme.headerBg} p-6 rounded-2xl border-l-4 ${theme.border} shadow-sm flex flex-col md:flex-row items-center justify-between gap-4`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 ${theme.bg} ${theme.isFsm ? 'text-black' : 'text-white'} rounded-lg`}><Icon name="book-open" size={20} /></div>
                                            <div><h2 className={`text-lg font-black ${theme.textMain} uppercase tracking-tight leading-none`}>{theme.prefix} Dictionary</h2><div className="text-[8px] font-bold text-slate-300 tracking-widest uppercase mt-1">Lean Engineering Parameters</div></div>
                                        </div>
                                        <select className={`bg-slate-900 border font-black border-slate-700 ${theme.textMain} rounded-lg px-4 py-2 text-xs outline-none cursor-pointer w-full md:w-64 shadow-inner`} value={activeParamKey} onChange={(e) => setActiveParamKey(e.target.value)}>
                                            {Object.entries(dynamicDictionary).map(([k, v]) => <option key={k} value={k} className="bg-slate-900 text-white">{v.name}</option>)}
                                        </select>
                                    </div>

                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex items-start gap-4 mb-6 border-b border-slate-100 pb-6">
                                            <div className={`p-3 ${theme.bg}/20 rounded-xl ${theme.textDark}`}><Icon name="info" size={24} /></div>
                                            <div><h3 className="text-xl font-black text-slate-800 uppercase tracking-tight mb-1">{dynamicDictionary[activeParamKey].name}</h3><div className="text-xs font-bold text-slate-500 leading-snug">{dynamicDictionary[activeParamKey].purpose}</div></div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col gap-2 shadow-sm">
                                                <div className="text-[9px] font-black text-slate-600 uppercase tracking-widest flex items-center gap-1.5"><Icon name="lightbulb" size={12} /> Vision Analogy</div>
                                                <div className="text-xs font-bold text-slate-900 leading-relaxed">{dynamicDictionary[activeParamKey].analogy}</div>
                                            </div>
                                            <div className={`p-4 ${theme.bg}/10 rounded-xl border ${theme.border} flex flex-col gap-2 shadow-sm`}>
                                                <div className={`text-[9px] font-black ${theme.textDark} uppercase tracking-widest flex items-center gap-1.5`}><Icon name="settings" size={12} /> {theme.prefix} Strategy</div>
                                                <div className="text-xs font-bold text-slate-900 leading-relaxed">{dynamicDictionary[activeParamKey].optimization}</div>
                                            </div>
                                        </div>
                                        <div className={`${theme.headerBg} p-6 rounded-xl border border-white/10 shadow-inner relative overflow-hidden`}>
                                            <Icon name="calculator" size={80} className="absolute -right-4 -bottom-4 text-white/5 rotate-12" />
                                            <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-slate-500"></div> Standard Formula</div>
                                            <div className="text-sm font-bold text-white font-mono leading-relaxed relative z-10 tracking-tight mb-4">{dynamicDictionary[activeParamKey].formula}</div>
                                            <div className={`text-[9px] font-black ${theme.textDark} uppercase tracking-widest mb-1 flex items-center gap-2`}><div className={`w-1.5 h-1.5 rounded-full ${theme.bg}`}></div> Values Applied</div>
                                            <div className={`text-sm font-bold ${theme.textMain} opacity-80 font-mono leading-relaxed relative z-10 tracking-tight mb-4 border-b border-white/10 pb-4`}>{dynamicDictionary[activeParamKey].applied}</div>
                                            <div className={`text-[9px] font-black ${theme.textMain} uppercase tracking-widest mb-1 flex items-center gap-2`}><div className={`w-1.5 h-1.5 rounded-full ${theme.bg} animate-pulse`}></div> Live Result</div>
                                            <div className={`text-xl ${theme.textMain} font-mono leading-relaxed relative z-10 tracking-tight font-black`}>{dynamicDictionary[activeParamKey].result}</div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* --- PDF EXECUTIVE DIAGNOSTIC REPORT --- */}
                    <div ref={reportRef} className="hidden print:block">
                        <div className="bg-white text-black font-sans pb-10 w-full mx-auto shadow-2xl">
                            <div className="bg-black text-white p-6 border-b-4 border-slate-500 flex justify-between items-center w-full" style={{borderColor: theme.hex}}>
                                <div className="flex items-center gap-3">
                                    <div className="text-black p-2 rounded-lg" style={{backgroundColor: theme.hex}}><Icon name="shield-check" size={20}/></div>
                                    <div>
                                        <h1 className="text-2xl font-black leading-none tracking-tight mb-1" style={{color: theme.hex}}>MECTS SET....GO</h1>
                                        <div className="text-[8px] text-slate-300 tracking-widest uppercase font-bold mb-0.5">managing excellence thru continuous transformative solutions</div>
                                        <div className="text-sm text-white font-black tracking-widest uppercase">{theme.prefix} State Audit - Management Review</div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-xs font-black uppercase tracking-widest" style={{color: theme.hex}}>Confidential Data</div>
                                    <div className="text-[10px] font-bold text-slate-400">{new Date().toLocaleDateString()}</div>
                                </div>
                            </div>
                            
                            <div style={{ height: '0.5in' }}></div>

                            <div className="px-10 space-y-6">
                                <div className="border border-slate-300 rounded-lg p-5 bg-slate-50 print-no-break">
                                    <h2 className="text-sm font-black uppercase text-slate-800 border-b border-slate-300 pb-2 mb-3 flex items-center gap-2"><Icon name="activity" size={16}/> {theme.prefix} State Diagnostic Overview</h2>
                                    <div className="text-xs font-bold text-slate-700 leading-relaxed space-y-3">
                                        <p>The {theme.prefix} State architecture is operating against a demand of <strong>{customerDemand || 0} units</strong> within <strong>{workingHours || 0} shift hours</strong>, requiring a Takt pulse of <strong>{metrics.displayTakt}{unitSuffix}</strong>.</p>
                                        <p><span className={isTaktMet ? "text-emerald-600" : "text-red-600"}>{isTaktMet ? `System Capability: The pacing constraint (${bottleneckStep.name} at ${metrics.convertValue(bottleneckStep.totalCT)}${unitSuffix}) safely operates beneath the Takt limit.` : `CRITICAL RISK: The pacing constraint (${bottleneckStep.name} at ${metrics.convertValue(bottleneckStep.totalCT)}${unitSuffix}) exceeds the allowable Takt pulse. Missed deliveries and systemic overburden (Muri) are actively occurring.`}</span></p>
                                        <p><span className={lbeNum >= theme.lbeOpt ? "text-emerald-600" : "text-amber-600"}>{lbeNum >= theme.lbeOpt ? `The architecture achieves adequate Line Balance Efficiency (LBE) at ${metrics.lbe}%.` : `The architecture exhibits structural imbalance (LBE: ${metrics.lbe}%). Labor and machine capacity are poorly distributed.`}</span></p>
                                        <p><span className={vaNum >= 20 ? "text-emerald-600" : "text-red-600"}>The Value-Added Ratio (VAR) stands at <strong>{metrics.varPercentage}%</strong> across a total Lead Time of <strong>{metrics.displayLead}{unitSuffix}</strong>. {vaNum < 20 ? "This indicates excessive non-value-added stagnation (Muda) is currently embedded in the flow." : "This reflects a generally efficient flow relative to industry standards."}</span></p>
                                    </div>
                                </div>

                                <div className="flex gap-4 w-full print-no-break">
                                    <div className="flex-1 border border-slate-300 rounded-lg p-4 bg-white">
                                        <h2 className="text-xs font-black uppercase text-slate-500 border-b border-slate-200 pb-1 mb-2">{theme.prefix} Context</h2>
                                        <div className="grid grid-cols-1 gap-y-2 text-[10px] font-bold text-slate-800">
                                            <div className="flex justify-between"><span className="text-slate-500">Segment:</span> <span>{INDUSTRY_TEMPLATES[selectedIndustry]?.label || 'Custom'}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-500">Demand:</span> <span>{customerDemand || 0} units</span></div>
                                            <div className="flex justify-between"><span className="text-slate-500">Supplier:</span> <span>{supplierName || 'N/A'}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-500">Customer:</span> <span>{customerName || 'N/A'}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-500">Shift Hrs:</span> <span>{workingHours || 0}</span></div>
                                        </div>
                                    </div>
                                    <div className="flex-[2.5] grid grid-cols-4 gap-2">
                                        <div className="border border-slate-300 p-2 rounded bg-white text-center flex flex-col justify-center"><div className="text-[8px] text-slate-500 font-black uppercase tracking-widest leading-tight mb-1">{theme.prefix} Takt</div><div className="text-lg font-black text-black leading-none">{metrics.displayTakt}{unitSuffix}</div></div>
                                        <div className="border border-slate-300 p-2 rounded bg-white text-center flex flex-col justify-center"><div className="text-[8px] text-slate-500 font-black uppercase tracking-widest leading-tight mb-1">{theme.prefix} Lead</div><div className="text-lg font-black text-black leading-none">{metrics.displayLead}{unitSuffix}</div></div>
                                        <div className="border border-slate-300 p-2 rounded bg-white text-center flex flex-col justify-center"><div className="text-[8px] text-slate-500 font-black uppercase tracking-widest leading-tight mb-1">Line Balance</div><div className={`text-lg font-black leading-none ${lbeHealth === 'optimal' ? 'text-emerald-600' : (lbeHealth === 'warning' ? 'text-amber-600' : 'text-red-600')}`}>{metrics.lbe}%</div></div>
                                        <div className="border border-slate-300 p-2 rounded bg-white text-center flex flex-col justify-center"><div className="text-[8px] text-slate-500 font-black uppercase tracking-widest leading-tight mb-1">Stream OEE</div><div className={`text-lg font-black leading-none ${oeeHealth === 'optimal' ? 'text-emerald-600' : (oeeHealth === 'warning' ? 'text-amber-600' : 'text-red-600')}`}>{metrics.streamOEE}%</div></div>
                                    </div>
                                </div>

                                <div className="print-no-break">
                                    <h2 className="text-[10px] font-black uppercase text-slate-500 border-b border-slate-300 pb-1 mb-2">{theme.prefix} Data Matrix</h2>
                                    <table className="w-full text-[9px] text-center border-collapse border border-slate-300">
                                        <thead className="bg-slate-100 text-slate-600 uppercase font-black">
                                            <tr><th className="border border-slate-300 p-1.5">Seq</th><th className="border border-slate-300 p-1.5 text-left">Process</th><th className="border border-slate-300 p-1.5">Inv</th><th className="border border-slate-300 p-1.5">Wait(d)</th><th className="border border-slate-300 p-1.5">Man CT</th><th className="border border-slate-300 p-1.5">Mach CT</th><th className="border border-slate-300 p-1.5">VAT</th><th className="border border-slate-300 p-1.5">OEE</th><th className="border border-slate-300 p-1.5">HC</th></tr>
                                        </thead>
                                        <tbody>
                                            {metrics.auditedSteps.map((s, i) => (
                                                <tr key={i} className="nth-child(even):bg-slate-50">
                                                    <td className="border border-slate-300 p-1.5 font-black text-slate-500">{i+1}</td>
                                                    <td className="border border-slate-300 p-1.5 text-left font-black">{s.name}</td>
                                                    <td className="border border-slate-300 p-1.5 font-black">{s.inventoryPieces}</td>
                                                    <td className={`border border-slate-300 p-1.5 font-black ${Number(s.calculatedWaitDays) > theme.waitCrit ? 'text-red-600 bg-red-50' : ''}`}>{parseFloat(Number(s.calculatedWaitDays).toFixed(2))}</td>
                                                    <td className={`border border-slate-300 p-1.5 font-bold ${s.totalCT > metrics.taktTimeSec && metrics.taktTimeSec > 0 ? 'text-red-600 bg-red-50' : ''}`}>{metrics.convertValue(s.manualCT)}</td>
                                                    <td className="border border-slate-300 p-1.5 font-bold">{metrics.convertValue(s.machineCT)}</td>
                                                    <td className="border border-slate-300 p-1.5 font-black text-slate-700 bg-slate-100">{metrics.convertValue(s.vatSec)}</td>
                                                    <td className="border border-slate-300 p-1.5 font-black">{s.stepOEE}%</td>
                                                    <td className="border border-slate-300 p-1.5 font-black">{s.operators}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="print-no-break border border-slate-300 p-4 rounded-lg bg-white">
                                    <h2 className="text-xs font-black uppercase text-slate-800 border-b border-slate-200 pb-2 mb-3">Critical Constraint Logs (3M Waste)</h2>
                                    {wastes.length === 0 ? <div className="text-xs text-emerald-600 font-bold">No critical constraints detected. Architecture complies with Lean tolerances.</div> : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {wastes.map((w, idx) => (
                                                <div key={idx} className="flex gap-3 items-start border border-slate-200 p-3 rounded bg-slate-50">
                                                    <div className="text-[10px] font-black text-white bg-slate-800 px-2 py-1 rounded shrink-0">{w.category}</div>
                                                    <div><div className="text-[10px] font-black text-slate-900 uppercase">{w.step}</div><div className="text-[10px] font-bold text-red-600 leading-tight mt-1">{w.desc}</div></div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="print-no-break border border-slate-300 p-4 rounded-lg bg-white">
                                    <h2 className="text-xs font-black uppercase text-slate-800 border-b border-slate-200 pb-2 mb-3">Kaizen & CAPA Implementation Plan</h2>
                                    {capaRecords.length === 0 ? <div className="text-xs text-slate-500 font-bold">No interventions logged in the system.</div> : (
                                        <div className="space-y-3">
                                            {capaRecords.map((c, idx) => (
                                                <div key={idx} className="flex flex-col border border-slate-200 p-3 rounded bg-slate-50">
                                                    <div className="flex justify-between items-center mb-2 border-b border-slate-200 pb-1">
                                                        <span className="text-[10px] font-black text-slate-900 uppercase">{c.step}</span>
                                                        <span className="text-[9px] font-black uppercase text-slate-500 bg-slate-200 px-2 py-0.5 rounded">{c.status}</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-4 text-[10px] font-bold leading-tight">
                                                        <div><span className="text-slate-400 block uppercase mb-0.5 text-[8px]">Lean Principle / Root Cause</span><span className="text-slate-800">{c.rootCause}</span></div>
                                                        <div><span className="text-slate-400 block uppercase mb-0.5 text-[8px]">Implementation Action</span><span className="text-slate-800">{c.correctiveAction}</span></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
