<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive VSM Workbook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ExcelJS for Native .xlsx Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        @media print {
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:border-none { border: none !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:break-after-page { page-break-after: always !important; }
            .activity-section { display: block !important; }
        }
        textarea { resize: vertical; min-height: 60px; }
        
        /* NON-NEGOTIABLE: Force all table headers to stay on one line dynamically */
        th { 
            white-space: nowrap !important; 
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 py-10 px-4 font-sans text-gray-900">

    <!-- INITIAL CAPTURE FORM -->
    <div class="max-w-6xl mx-auto bg-blue-50 p-8 rounded-xl shadow-md mb-8 border border-blue-200 print:hidden">
        <h1 class="text-2xl font-black text-blue-900 mb-2 uppercase tracking-wide">VSM PRACTICAL INSIGHTS</h1>
        <p class="text-sm text-blue-700 mb-6 font-medium">Please fill in your details below. This will automatically update the headers on all activity pages.</p>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
            <div>
                <label class="block text-sm font-bold text-blue-900 mb-1">Name</label>
                <input type="text" id="setup-name" class="w-full p-2 border border-blue-300 rounded shadow-sm outline-none focus:border-blue-500" placeholder="John Doe" oninput="updateSetupDisplays()">
            </div>
            <div>
                <label class="block text-sm font-bold text-blue-900 mb-1">Employee Code</label>
                <input type="text" id="setup-empCode" class="w-full p-2 border border-blue-300 rounded shadow-sm outline-none focus:border-blue-500" placeholder="EMP-123" oninput="updateSetupDisplays()">
            </div>
            <div>
                <label class="block text-sm font-bold text-blue-900 mb-1">Department</label>
                <input type="text" id="setup-dept" class="w-full p-2 border border-blue-300 rounded shadow-sm outline-none focus:border-blue-500" placeholder="Assembly" oninput="updateSetupDisplays()">
            </div>
            <div>
                <label class="block text-sm font-bold text-blue-900 mb-1">Date</label>
                <input type="date" id="setup-date" class="w-full p-2 border border-blue-300 rounded shadow-sm outline-none focus:border-blue-500" oninput="updateSetupDisplays()">
            </div>
            <div>
                <label class="block text-sm font-bold text-blue-900 mb-1">Workstation / Area</label>
                <input type="text" id="setup-workstation" class="w-full p-2 border border-blue-300 rounded shadow-sm outline-none focus:border-blue-500" placeholder="Station 4" oninput="updateSetupDisplays()">
            </div>
        </div>
    </div>

    <!-- ACTIVITY SELECTOR DROPDOWN -->
    <div class="max-w-6xl mx-auto mb-10 bg-white p-6 rounded-lg border border-gray-300 shadow-sm print:hidden flex flex-col sm:flex-row items-center justify-between">
        <label class="font-bold text-gray-800 text-lg mb-3 sm:mb-0">Select an Activity to Work On:</label>
        <select id="activity-selector" class="border-2 border-indigo-500 p-3 rounded-md focus:ring-4 focus:ring-indigo-100 bg-indigo-50 font-bold text-indigo-900 outline-none transition-all shadow-sm cursor-pointer w-full sm:w-2/3 text-base" onchange="toggleSections()">
            <option value="all">Show All Activities (Overview)</option>
            <optgroup label="Module 1: Value, Waste & Flow">
                <option value="valWaste">Identifying Value & Waste</option>
                <option value="timwood">The 7 Wastes (TIMWOOD)</option>
                <option value="threems">The 3Ms Analysis (Muda, Mura, Muri)</option>
                <option value="fives">5S Workplace Audit (Gemba Walk)</option>
            </optgroup>
            <optgroup label="Module 2: Process Control & Metrics">
                <option value="vsmData">VSM Process Data Box Capture</option>
                <option value="metrics">VSM Metrics (Takt & OEE Calculator)</option>
                <option value="5whys">5 Whys & Poka Yoke</option>
                <option value="shewhart">Shewhart Chart (Process Log)</option>
            </optgroup>
            <optgroup label="Module 3: Problem Solving & Action (NEW)">
                <option value="pdca">PDCA Cycle (Plan-Do-Check-Act)</option>
                <option value="eisenhower">Eisenhower Matrix (Task Prioritization)</option>
                <option value="kaizen">Kaizen Newspaper (Action Tracker)</option>
            </optgroup>
        </select>
    </div>

    <div id="app-content">
        <!-- Sections will be injected/toggled here -->
    </div>

<script>
// --- STATE MANAGEMENT ---
const state = {
    setupInfo: {
        name: '', empCode: '', dept: '', date: new Date().toISOString().split('T')[0], workstation: ''
    },
    valWasteData: Array.from({ length: 5 }, () => ({ desc: '', cares: '', change: '', right: '', classType: '', action: '' })),
    timwoodData: ['T - Transportation', 'I - Inventory', 'M - Motion', 'W - Waiting', 'O - Overproduction', 'O - Overprocessing', 'D - Defects']
        .map(waste => ({ waste, area: '', example: '', reason: '', countermeasure: '', severity: '' })),
    threeMData: [
        { category: 'Muda (Waste)', observation: '', impact: '', action: '' },
        { category: 'Mura (Unevenness)', observation: '', impact: '', action: '' },
        { category: 'Muri (Overburden)', observation: '', impact: '', action: '' }
    ],
    fiveSData: [
        { s: '1S: Sort (Seiri)', observation: '', score: '', action: '' },
        { s: '2S: Set in Order (Seiton)', observation: '', score: '', action: '' },
        { s: '3S: Shine (Seiso)', observation: '', score: '', action: '' },
        { s: '4S: Standardize (Seiketsu)', observation: '', score: '', action: '' },
        { s: '5S: Sustain (Shitsuke)', observation: '', score: '', action: '' }
    ],
    vsmDataBox: Array.from({ length: 3 }, () => ({ processStep: '', cycleTime: '', changeoverTime: '', uptime: '', operators: '', wip: '' })),
    taktData: { shift: 480, breaks: 50, demand: 70 },
    oeeData: { planned: 450, operating: 338, idealCycle: 1, count: 320, good: 304 },
    fiveWhysData: { problem: '', why1: '', why2: '', why3: '', why4: '', rootCause: '', type: '', description: '', status: '' },
    shewhartData: {
        variable: '', mean: '', ucl: '', lcl: '',
        rows: Array.from({ length: 10 }, (_, i) => ({ sample: i + 1, value: '', limits: '', notes: '' }))
    },
    pdcaData: Array.from({ length: 3 }, () => ({ planProb: '', planSol: '', doTrial: '', checkResult: '', actNext: '', status: '' })),
    eisenhowerData: Array.from({ length: 4 }, () => ({ task: '', urgent: '', important: '', quadrant: '', owner: '' })),
    kaizenData: Array.from({ length: 4 }, () => ({ dateRaised: '', problem: '', action: '', owner: '', targetDate: '', status: '' }))
};

// Calculated Metrics
let calculatedMetrics = { availableTime: 0, taktTime: 0, availability: 0, performance: 0, quality: 0, finalOEE: 0 };

// --- HELPER: DOCUMENT PAGE TEMPLATE ---
function getDocumentPageHeader() {
    return `
    <div class="max-w-6xl mx-auto bg-white shadow-xl border border-gray-200 mb-12 p-10 rounded-xl print:shadow-none print:border-none print:m-0 print:p-0 print:break-after-page">
        <div class="text-center border-b-2 border-gray-800 pb-5 mb-6">
            <h2 class="text-2xl font-black tracking-widest text-gray-800 uppercase">
                MECTS....SET....GO... | VSM OBSERVATIONS
            </h2>
        </div>
        <div class="text-left font-bold text-gray-800 text-sm mb-10 tracking-wide leading-relaxed">
            Name: <span class="disp-name">________________</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
            Emp Code: <span class="disp-emp">_________</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
            Dept: <span class="disp-dept">________________</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
            Date: <span class="disp-date">_________</span>
            <br />
            <span class="text-blue-800 mt-2 inline-block">
                Workstation / Focus Area: <span class="disp-workstation">________________________________________________</span>
            </span>
        </div>
        <div>
    `;
}
function getDocumentPageFooter() {
    return `</div></div>`;
}

// --- SETUP SYNC ---
function initSetupDate() {
    document.getElementById('setup-date').value = state.setupInfo.date;
    updateSetupDisplays();
}

function updateSetupDisplays() {
    state.setupInfo.name = document.getElementById('setup-name').value;
    state.setupInfo.empCode = document.getElementById('setup-empCode').value;
    state.setupInfo.dept = document.getElementById('setup-dept').value;
    state.setupInfo.date = document.getElementById('setup-date').value;
    state.setupInfo.workstation = document.getElementById('setup-workstation').value;

    document.querySelectorAll('.disp-name').forEach(el => el.textContent = state.setupInfo.name || '________________');
    document.querySelectorAll('.disp-emp').forEach(el => el.textContent = state.setupInfo.empCode || '_________');
    document.querySelectorAll('.disp-dept').forEach(el => el.textContent = state.setupInfo.dept || '________________');
    document.querySelectorAll('.disp-date').forEach(el => el.textContent = state.setupInfo.date || '_________');
    document.querySelectorAll('.disp-workstation').forEach(el => el.textContent = state.setupInfo.workstation || '________________________________________________');
}

// --- RENDER FUNCTIONS ---
function renderApp() {
    const container = document.getElementById('app-content');
    container.innerHTML = `
        <!-- SEC: VAL WASTE -->
        <div id="sec-valWaste" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-blue-500 pl-3">MODULE 1: IDENTIFYING VALUE & WASTE</h3>
            <p class="mb-4 text-sm text-gray-700 leading-relaxed"><strong>Instructions:</strong> Identify key activities. Classify them to auto-generate Excel Cell Colors (Green VA, Yellow NVA, Red PW).</p>
            <div class="overflow-x-auto rounded-lg border border-gray-300">
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-800">
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/3">Activity / Task Description</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center w-20">Cares?</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center w-20">Change?</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center w-28">Error-Free?</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center w-32">Classification</th>
                            <th class="border-b border-gray-300 p-3 text-left w-1/3">Action Plan</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-valWaste"></tbody>
                </table>
            </div>
            <button onclick="addRow('valWasteData')" class="mt-4 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-4 rounded-lg border border-blue-300 shadow-sm flex items-center gap-2 print:hidden transition-colors text-sm"><span class="text-lg leading-none">+</span> Add Another Activity</button>
            <button onclick="exportValWaste()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: TIMWOOD -->
        <div id="sec-timwood" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-blue-500 pl-3">MODULE 1: THE 7 WASTES (TIMWOOD)</h3>
            <div class="overflow-x-auto rounded-lg border border-gray-300 shadow-sm">
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-800">
                            <th class="border-b border-r border-gray-300 p-3 text-left w-40">Waste</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left w-36">Severity</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left">Process Area</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left">Observed Example</th>
                            <th class="border-b border-gray-300 p-3 text-left">Lean Countermeasure</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-timwood"></tbody>
                </table>
            </div>
            <button onclick="addRow('timwoodData')" class="mt-4 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-4 rounded-lg border border-blue-300 shadow-sm flex items-center gap-2 print:hidden transition-colors text-sm"><span class="text-lg leading-none">+</span> Add Another Observation</button>
            <button onclick="exportTimwood()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: 3MS -->
        <div id="sec-threems" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-orange-500 pl-3">MODULE 1: THE 3Ms ANALYSIS (MUDA, MURA, MURI)</h3>
            <p class="mb-4 text-sm text-gray-700 leading-relaxed"><strong>Instructions:</strong> True Lean goes beyond just Waste (Muda). Identify instances of Mura (Unevenness) and Muri (Overburden).</p>
            <div class="overflow-x-auto rounded-lg border border-gray-300 shadow-sm">
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-800">
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/5">Category (The 3 Ms)</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/3">Observation</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/6">Impact Level</th>
                            <th class="border-b border-gray-300 p-3 text-left w-1/3">Corrective Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-threems"></tbody>
                </table>
            </div>
            <button onclick="addRow('threeMData')" class="mt-4 bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-2 px-4 rounded-lg border border-orange-300 shadow-sm flex items-center gap-2 print:hidden transition-colors text-sm"><span class="text-lg leading-none">+</span> Add Row</button>
            <button onclick="exportThreeMs()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: 5S -->
        <div id="sec-fives" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-indigo-500 pl-3">MODULE 1: 5S WORKPLACE AUDIT (GEMBA WALK)</h3>
            <p class="mb-4 text-sm text-gray-700 leading-relaxed"><strong>Instructions:</strong> Conduct a rapid 5S Gemba assessment. Score each pillar from 1 (Poor) to 5 (Excellent).</p>
            <div class="overflow-x-auto rounded-lg border border-gray-300 shadow-sm">
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-800">
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/4">5S Pillar</th>
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/3">Current Observation</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center w-24">Score (1-5)</th>
                            <th class="border-b border-gray-300 p-3 text-left w-1/3">Action / Improvement Idea</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-fives"></tbody>
                </table>
            </div>
            <button onclick="exportFiveS()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: VSM DATA -->
        <div id="sec-vsmData" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-teal-500 pl-3">MODULE 2: VSM PROCESS DATA BOX CAPTURE</h3>
            <p class="mb-4 text-sm text-gray-700 leading-relaxed"><strong>Instructions:</strong> To build a Value Stream Map, we must capture actual metrics at each process step.</p>
            <div class="overflow-x-auto rounded-lg border border-gray-300 shadow-sm">
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-teal-700 text-white">
                            <th class="border-b border-r border-gray-300 p-3 text-left w-1/4">Process Step / Workstation</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center">Cycle Time (CT)</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center">Changeover (C/O)</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center">Uptime (%)</th>
                            <th class="border-b border-r border-gray-300 p-3 text-center">Operators</th>
                            <th class="border-b border-gray-300 p-3 text-center">WIP Inventory</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-vsmData"></tbody>
                </table>
            </div>
            <button onclick="addRow('vsmDataBox')" class="mt-4 bg-teal-100 hover:bg-teal-200 text-teal-800 font-bold py-2 px-4 rounded-lg border border-teal-300 shadow-sm flex items-center gap-2 print:hidden transition-colors text-sm"><span class="text-lg leading-none">+</span> Add Process Step</button>
            <button onclick="exportVsmDataBox()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: METRICS -->
        <div id="sec-metrics" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-blue-500 pl-3">MODULE 2: VSM METRICS (SMART CALCULATOR)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10" id="metrics-inputs">
                <div class="bg-white rounded-lg overflow-hidden border border-gray-200 shadow-sm">
                    <h4 class="font-bold text-lg p-3 bg-blue-50 text-blue-900 border-b border-blue-200 uppercase tracking-wide">PART A: TAKT TIME</h4>
                    <table class="w-full border-collapse text-sm">
                        <tbody>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700 w-1/2">Total Shift Duration (Mins)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="takt-shift" value="480" oninput="updateMetrics(event, 'taktData', 'shift')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Planned Breaks/Downtime (Mins)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="takt-breaks" value="50" oninput="updateMetrics(event, 'taktData', 'breaks')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-100 font-semibold text-gray-800">Available Production Time</td><td class="p-3 text-right bg-gray-100 font-bold text-gray-800" id="calc-avail">430 Mins</td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Customer Demand (Units)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="takt-demand" value="70" oninput="updateMetrics(event, 'taktData', 'demand')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr><td class="p-4 bg-blue-100 font-black text-blue-900 text-base uppercase">TAKT TIME</td><td class="p-4 bg-blue-100 font-black text-right text-blue-900 text-lg"><span id="calc-takt">6.14</span> <span class="text-sm font-semibold">Mins/Unit</span></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="bg-white rounded-lg overflow-hidden border border-gray-200 shadow-sm">
                    <h4 class="font-bold text-lg p-3 bg-blue-50 text-blue-900 border-b border-blue-200 uppercase tracking-wide">PART B: OEE</h4>
                    <table class="w-full border-collapse text-sm">
                        <tbody>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700 w-1/2">Planned Production Time (Mins)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="oee-planned" value="450" oninput="updateMetrics(event, 'oeeData', 'planned')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Actual Operating Time (Mins)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="oee-operating" value="338" oninput="updateMetrics(event, 'oeeData', 'operating')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Ideal Cycle Time (Mins/Unit)</td><td class="p-0 bg-yellow-50/50"><input type="number" id="oee-ideal" value="1" oninput="updateMetrics(event, 'oeeData', 'idealCycle')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Total Units Produced</td><td class="p-0 bg-yellow-50/50"><input type="number" id="oee-count" value="320" oninput="updateMetrics(event, 'oeeData', 'count')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr class="border-b border-gray-200"><td class="p-3 bg-gray-50 font-semibold text-gray-700">Good Units Produced</td><td class="p-0 bg-yellow-50/50"><input type="number" id="oee-good" value="304" oninput="updateMetrics(event, 'oeeData', 'good')" class="w-full p-3 bg-transparent outline-none text-right font-bold text-blue-700"></td></tr>
                            <tr><td class="p-4 bg-gray-100 font-black text-gray-800 text-base uppercase">FINAL OEE</td><td class="p-4 bg-gray-100 font-black text-right text-gray-800 text-xl" id="calc-oee">71.5%</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <button onclick="exportMetrics()" class="mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 print:hidden transition-colors"><span class="text-xl">📥</span> Download .xlsx File</button>
            ${getDocumentPageFooter()}
        </div>

        <!-- SEC: 5 WHYS -->
        <div id="sec-5whys" class="activity-section">
            ${getDocumentPageHeader()}
            <h3 class="text-xl font-black mb-4 text-gray-800 border-l-4 border-blue-500 pl-3">MODULE 2: 5 WHYS & POKA YOKE</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="whys-container">
                <div class="rounded-lg overflow-hidden border border-gray-300 shadow-sm">
                    <table class="w-full border-collapse text-sm">
                        <tbody>

// --- CALCULATIONS ---
function updateMetrics(event, objType, field) {
    if (event) state[objType][field] = Number(event.target.value);
    
    const availableTime = Math.max(0, state.taktData.shift - state.taktData.breaks);
    const taktTime = state.taktData.demand > 0 ? (availableTime / state.taktData.demand).toFixed(2) : 0;
    
    const availability = state.oeeData.planned > 0 ? (state.oeeData.operating / state.oeeData.planned) : 0;
    const performance = state.oeeData.operating > 0 ? ((state.oeeData.count * state.oeeData.idealCycle) / state.oeeData.operating) : 0;
    const quality = state.oeeData.count > 0 ? (state.oeeData.good / state.oeeData.count) : 0;
    const finalOEE = (availability * performance * quality * 100).toFixed(1);

    calculatedMetrics = { availableTime, taktTime, availability, performance, quality, finalOEE };

    document.getElementById('calc-avail').textContent = `${availableTime} Mins`;
    document.getElementById('calc-takt').textContent = taktTime;
    document.getElementById('calc-oee').textContent = `${finalOEE}%`;
}


// --- EXCELJS EXPORT ENGINE ---
const getARGB = (hexColor) => {
    if (!hexColor || hexColor === 'transparent') return '00000000';
    const cleanHex = hexColor.replace('#', '').toUpperCase();
    return cleanHex.length === 6 ? 'FF' + cleanHex : cleanHex;
};

async function exportToExcelFile(filename, headers, dataRows, metaRows = []) {
    try {
        if (!window.ExcelJS) { alert("Excel engine not loaded yet."); return; }
        const workbook = new window.ExcelJS.Workbook();
        const sheet = workbook.addWorksheet(filename.substring(0, 31));

        let currentRow = 1;

        // 1. Participant Setup Info
        sheet.mergeCells(currentRow, 1, currentRow, Math.max(headers.length, 5));
        const titleCell = sheet.getCell(currentRow, 1);
        titleCell.value = 'VSM PRACTICAL INSIGHTS - PARTICIPANT INFO';
        titleCell.font = { bold: true, size: 14 };
        titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0F2FE' } };
        titleCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
        currentRow++;

        const setupHeaders = ['Name', 'Emp Code', 'Dept', 'Date', 'Workstation / Area'];
        setupHeaders.forEach((h, i) => {
           const cell = sheet.getCell(currentRow, i + 1);
           cell.value = h;
           cell.font = { bold: true };
           cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } };
           cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
        });
        currentRow++;

        const setupVals = [state.setupInfo.name || 'N/A', state.setupInfo.empCode || 'N/A', state.setupInfo.dept || 'N/A', state.setupInfo.date || 'N/A', state.setupInfo.workstation || 'N/A'];
        setupVals.forEach((v, i) => {
           const cell = sheet.getCell(currentRow, i + 1);
           cell.value = v;
           cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
        });
        currentRow += 2; 

        // 2. Activity Export Title
        sheet.mergeCells(currentRow, 1, currentRow, Math.max(headers.length, 5));
        const actTitle = sheet.getCell(currentRow, 1);
        actTitle.value = `ACTIVITY EXPORT: ${filename.toUpperCase()}`;
        actTitle.font = { bold: true, size: 14 };
        actTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0F2FE' } };
        actTitle.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
        currentRow++;

        // 3. Meta Rows
        metaRows.forEach(row => {
          row.forEach((cellData, i) => {
             const c = sheet.getCell(currentRow, i + 1);
             if (cellData && typeof cellData === 'object') {
                c.value = cellData.value;
                if (cellData.bold) c.font = { bold: true, color: { argb: cellData.color ? getARGB(cellData.color) : 'FF000000' } };
                if (cellData.bgColor && cellData.bgColor !== 'transparent') {
                    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: getARGB(cellData.bgColor) } };
                }
             } else {
                c.value = cellData;
                c.font = { bold: true };
                c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } };
             }
             c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
          });
          currentRow++;
        });
        if (metaRows.length > 0) currentRow++; 

        // 4. Main Table Headers
        headers.forEach((h, i) => {
           const c = sheet.getCell(currentRow, i + 1);
           c.value = h;
           c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
           c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } }; 
           c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
        });
        currentRow++;

        // 5. Main Data Rows
        dataRows.forEach(row => {
           row.forEach((cellData, i) => {
               const c = sheet.getCell(currentRow, i + 1);
               if (cellData && typeof cellData === 'object') {
                  c.value = cellData.value;
                  if (cellData.bold) c.font = { bold: true, color: { argb: cellData.color ? getARGB(cellData.color) : 'FF000000' } };
                  if (cellData.bgColor && cellData.bgColor !== 'transparent') {
                      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: getARGB(cellData.bgColor) } };
                  }
               } else {
                  if (!isNaN(cellData) && cellData !== '') {
                      c.value = Number(cellData);
                  } else {
                      c.value = cellData;
                  }
               }
               c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
               c.alignment = { wrapText: true, vertical: 'top' };
           });
           currentRow++;
        });

        // 6. Dynamic Column Width
        sheet.columns.forEach(column => {
          let maxLength = 0;
          column.eachCell({ includeEmpty: true }, cell => {
            const columnLength = cell.value ? cell.value.toString().length : 10;
            if (columnLength > maxLength) maxLength = columnLength;
          });
          column.width = Math.min(Math.max(maxLength + 2, 12), 60); 
        });

        // 7. Generate Download
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${filename.replace(/\s+/g, '_')}_${state.setupInfo.empCode || 'export'}.xlsx`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

    } catch (error) {
        console.error("Excel Generation Error:", error);
        alert("Excel Generation Failed. Please ensure internet connectivity for ExcelJS.");
    }
}

      let limitColor = 'transparent';
      if (row.limits === 'Yes') limitColor = '#bbf7d0';
      if (row.limits === 'No') limitColor = '#fecaca';
      return [ row.sample, row.value, { value: row.limits, bgColor: limitColor, bold: true }, row.notes ];
    });
    exportToExcelFile("Shewhart_Chart", headers, rows, metaRows);
};

window.exportPDCA = () => {
    const headers = ["Plan (Problem/Goal)", "Plan (Proposed Solution)", "Do (Trial Steps)", "Check (Results/Metrics)", "Act (Standardize)", "Status"];
    const rows = state.pdcaData.map(row => {
      let statusColor = 'transparent';
      if (row.status === 'Planning') statusColor = '#fef08a';
      if (row.status === 'Trialing') statusColor = '#bfdbfe';
      if (row.status === 'Successful') statusColor = '#bbf7d0';
      if (row.status === 'Failed/Retry') statusColor = '#fecaca';
      return [ row.planProb, row.planSol, row.doTrial, row.checkResult, row.actNext, { value: row.status.replace(/[🔴🟡🟢🔵]/g, '').trim(), bgColor: statusColor, bold: true } ];
    });
    exportToExcelFile("PDCA_Cycle", headers, rows);
};

window.exportEisenhower = () => {
    const headers = ["Task / Activity", "Urgent?", "Important?", "Quadrant Classification", "Action Owner"];
    const rows = state.eisenhowerData.map(row => {
      let qColor = 'transparent';
      if (row.quadrant.includes('Q1')) qColor = '#fecaca';
      if (row.quadrant.includes('Q2')) qColor = '#bfdbfe';
      if (row.quadrant.includes('Q3')) qColor = '#fef08a';
      if (row.quadrant.includes('Q4')) qColor = '#e5e7eb';
      return [ row.task, row.urgent, row.important, { value: row.quadrant.replace(/[🔴🟡⚪🔵]/g, '').trim(), bgColor: qColor, bold: true }, row.owner ];
    });
    exportToExcelFile("Eisenhower_Matrix", headers, rows);
};

window.exportKaizen = () => {
    const headers = ["Date Raised", "Problem / Item", "Countermeasure / Action", "Owner", "Target Date", "Status"];
    const rows = state.kaizenData.map(row => {
      let statusColor = 'transparent';
      if (row.status === 'Not Started') statusColor = '#fecaca';
      if (row.status === 'In Progress') statusColor = '#fef08a';
      if (row.status === 'Done') statusColor = '#bbf7d0';
      return [ row.dateRaised, row.problem, row.action, row.owner, row.targetDate, { value: row.status.replace(/[🔴🟡🟢]/g, '').trim(), bgColor: statusColor, bold: true } ];
    });
    exportToExcelFile("Kaizen_Newspaper", headers, rows);
};

// --- INITIALIZE APPLICATION ---
window.onload = () => {
    initSetupDate();
    renderApp();
    toggleSections();
};

</script>
</body>
