<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUSUM Lean Six Sigma Platform</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel standalone to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- UTILITY SVGS ---
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
        const IconLock = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;

        const INDUSTRIES = [
          { name: "Manufacturing (Automotive)", target: 50, std: 2, unit: "mm" },
          { name: "Healthcare (Patient Vitals)", target: 120, std: 10, unit: "mmHg" },
          { name: "Pharmaceuticals (Drug Dosage)", target: 500, std: 5, unit: "mg" },
          { name: "Finance (Transaction Fraud)", target: 0, std: 0.5, unit: "Risk Score" },
          { name: "Aerospace (Component Tolerance)", target: 10, std: 0.05, unit: "mm" },
          { name: "Food & Beverage (Fill Weight)", target: 250, std: 3, unit: "ml" },
          { name: "IT & Software (Defect Rate)", target: 2, std: 0.5, unit: "Bugs/KLOC" },
          { name: "Telecomm (Signal Strength)", target: -65, std: 5, unit: "dBm" },
          { name: "Energy & Utilities (Grid Volts)", target: 230, std: 2, unit: "V" },
          { name: "Logistics (Delivery Time)", target: 24, std: 4, unit: "Hours" },
          { name: "Retail (Inventory Shrinkage)", target: 1.5, std: 0.2, unit: "%" },
          { name: "Chemicals (Reaction Temp)", target: 150, std: 2.5, unit: "°C" },
          { name: "Agriculture (Crop Yield)", target: 8000, std: 500, unit: "kg/ha" },
          { name: "Construction (Stress Test)", target: 30, std: 1.5, unit: "MPa" },
          { name: "Mining (Ore Grade)", target: 2.5, std: 0.3, unit: "% Cu" },
          { name: "Education (Assessment)", target: 75, std: 12, unit: "Score" },
          { name: "Hospitality (Satisfaction)", target: 4.5, std: 0.4, unit: "Stars" },
          { name: "Textiles (Thread Tension)", target: 15, std: 1.2, unit: "cN" },
          { name: "Electronics (Semicon Yield)", target: 98, std: 1, unit: "%" },
          { name: "Public Sector (Response Time)", target: 5, std: 1.5, unit: "Mins" }
        ];

        function App() {
          const [industryIdx, setIndustryIdx] = useState(0);
          const [targetStr, setTargetStr] = useState(INDUSTRIES[0].target.toString());
          const [stdDevStr, setStdDevStr] = useState(INDUSTRIES[0].std.toString());
          const [slackKStr, setSlackKStr] = useState("0.5"); 
          const [decisionHStr, setDecisionHStr] = useState("4.0"); 
          const [useFIR, setUseFIR] = useState(false);
          
          const [dataInput, setDataInput] = useState("");
          const [preCapaData, setPreCapaData] = useState(""); 
          const [isSettingsOpen, setIsSettingsOpen] = useState(true);
          const [capaApplied, setCapaApplied] = useState(false);
          const [hoveredPoint, setHoveredPoint] = useState(null);
          
          const [dynamicShiftIndex, setDynamicShiftIndex] = useState(20); 

          // ULTIMATE GOD MODE FIX: Strict parsing to prevent JS Falsy bugs (0 evaluating as false)
          const parsedTarget = parseFloat(targetStr);
          const target = isNaN(parsedTarget) ? 0 : parsedTarget;

          const parsedStd = parseFloat(stdDevStr);
          const stdDev = isNaN(parsedStd) || parsedStd <= 0 ? 0.01 : parsedStd; // Cannot be zero or negative

          const parsedK = parseFloat(slackKStr);
          const slackK = isNaN(parsedK) || parsedK < 0 ? 0 : parsedK; // Allows exact 0

          const parsedH = parseFloat(decisionHStr);
          const decisionH = isNaN(parsedH) || parsedH <= 0 ? 0.1 : parsedH; // Cannot be zero

          useEffect(() => {
            generateSimulatedData();
          }, [industryIdx]);

          const generateSimulatedData = () => {
            const ind = INDUSTRIES[industryIdx];
            setTargetStr(ind.target.toString());
            setStdDevStr(ind.std.toString());
            setHoveredPoint(null); 
            
            const shiftStartIdx = Math.floor(Math.random() * 20) + 10; 
            const shiftDirection = Math.random() > 0.5 ? 1 : -1; 
            const shiftMagnitude = (Math.random() * 2.0) + 1.0; 

            let arr = [];
            for (let i = 0; i < 40; i++) {
              let u = 0, v = 0;
              while(u === 0) u = Math.random();
              while(v === 0) v = Math.random();
              let num = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v ); 
              
              let shift = 0;
              if (i >= shiftStartIdx) {
                  shift = (ind.std * shiftMagnitude * shiftDirection);
              } else {
                  if (Math.random() > 0.85) {
                      shift = (ind.std * (Math.random() * 1.5) * (Math.random() > 0.5 ? 1 : -1));
                  }
              }
              
              let val = ind.target + shift + (num * ind.std);
              arr.push(val.toFixed(2));
            }
            const str = arr.join(", ");
            setDataInput(str);
            setPreCapaData(str);
            setCapaApplied(false);
          };

          const parseCleanData = (str) => {
            if (!str) return [];
            return str.split(',')
              .map(s => s.trim())
              .filter(s => s !== "" && !isNaN(parseFloat(s)))
              .map(s => parseFloat(s))
              .slice(0, 500); 
          };

          const cleanDataArray = useMemo(() => parseCleanData(dataInput), [dataInput]);

          const cusumData = useMemo(() => {
            if (cleanDataArray.length === 0) return [];

            const h_val = stdDev * decisionH;
            const k_val = stdDev * slackK;
            
            let cPlus = useFIR ? (h_val / 2) : 0;
            let cMinus = useFIR ? (h_val / 2) : 0;

            return cleanDataArray.map((val, i) => {
              cPlus = Math.max(0, val - (target + k_val) + cPlus);
              cMinus = Math.max(0, (target - k_val) - val + cMinus);
              
              let status = 'green';
              if (cPlus >= h_val || cMinus >= h_val) {
                status = 'red';
              } else if (cPlus >= h_val * 0.5 || cMinus >= h_val * 0.5) {
                status = 'yellow';
              }

              return {
                index: i + 1,
                value: val,
                cPlus: cPlus,
                cMinus: -cMinus,
                cPlusRaw: cPlus,
                cMinusRaw: cMinus,
                status,
                hLimit: h_val,
                minusHLimit: -h_val
              };
            });
          }, [cleanDataArray, target, stdDev, slackK, decisionH, useFIR]);

          const applyCAPA = () => {
            if (capaApplied) return;
            setHoveredPoint(null); 
            setPreCapaData(dataInput);
            
            const values = cleanDataArray.length > 0 ? cleanDataArray : parseCleanData(dataInput);
            
            const firstRed = cusumData.find(d => d.status === 'red');
            const shiftIdx = firstRed ? firstRed.index - 1 : Math.floor(values.length / 2);
            setDynamicShiftIndex(shiftIdx);
            
            const corrected = values.map((v, i) => {
                if (i >= shiftIdx) {
                    let error = v - target;
                    return (target + (error * 0.2)).toFixed(2);
                }
                return v.toFixed(2);
            });
            
            setDataInput(corrected.join(", "));
            setCapaApplied(true);
          };

          const revertCAPA = () => {
            setHoveredPoint(null); 
            setDataInput(preCapaData);
            setCapaApplied(false);
          };

          const getCapaAverages = () => {
            const origVals = parseCleanData(preCapaData);
            const curVals = cleanDataArray;
            const getAvg = (arr) => {
              const slice = arr.slice(dynamicShiftIndex);
              return slice.length ? (slice.reduce((a, b) => a + b, 0) / slice.length).toFixed(2) : target.toFixed(2);
            };
            return { before: getAvg(origVals), after: getAvg(curVals) };
          };

          const exportCSV = () => {
            let csvContent = `MECTS PLATFORM: CUSUM LEAN SIX SIGMA REPORT\n`;
            csvContent += `Generated On,"${new Date().toLocaleString()}"\n`;
            csvContent += `Industry Segment,"${INDUSTRIES[industryIdx].name}"\n`;
            csvContent += `Target Mean,${target}\n`;
            csvContent += `Standard Deviation,${stdDev}\n`;
            csvContent += `Slack (k),${slackK}\n`;
            csvContent += `Control Limit (h),${decisionH}\n`;
            csvContent += `FIR Enabled,${useFIR ? "Yes" : "No"}\n\n`;
            
            csvContent += "Observation,Raw_Value,C_Plus,C_Minus,Status,Target,Upper_Limit,Lower_Limit\n";
            
            const rows = cusumData.map(d => 
              `${d.index},${d.value},${d.cPlusRaw.toFixed(3)},${d.cMinusRaw.toFixed(3)},${d.status},${target},${d.hLimit.toFixed(3)},${d.minusHLimit.toFixed(3)}`
            ).join("\n");
            
            csvContent += rows;

            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `CUSUM_Audit_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const getInterpretation = () => {
            if (cusumData.length === 0) return "No data available.";
            const redPoints = cusumData.filter(d => d.status === 'red');
            const yellowPoints = cusumData.filter(d => d.status === 'yellow');
            
            if (redPoints.length > 0) {
                const firstRed = redPoints[0];
                const driftType = firstRed.cPlusRaw >= firstRed.hLimit ? "Positive" : "Negative";
                return (
                  <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm space-y-3 transition-all">
                    <h4 className="text-red-700 font-bold mb-1">CRITICAL SHIFT DETECTED</h4>
                    <p className="text-sm text-red-900 leading-relaxed">
                      The process went <strong>OUT OF CONTROL</strong> at observation #{firstRed.index}. 
                    </p>
                    <p className="text-sm text-red-900 leading-relaxed">
                      A significant <strong>{driftType} drift</strong> was detected beyond the decision interval limit ({firstRed.hLimit.toFixed(2)}). 
                      Immediate Corrective Action (CAPA) is recommended.
                    </p>
                  </div>
                );
            } else if (yellowPoints.length > 0) {
                return (
                  <div className="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-md shadow-sm transition-all">
                    <h4 className="text-yellow-700 font-bold mb-1">WARNING: PROCESS DRIFTING</h4>
                    <p className="text-sm text-yellow-900">
                      The process is showing signs of drift but has not breached the control limits. 
                      Observe carefully. Preventative maintenance or slight calibrations might be needed soon.
                    </p>
                  </div>
                );
            } else {
                return (
                  <div className="bg-green-50 border-l-4 border-green-500 p-4 rounded-md shadow-sm transition-all">
                    <h4 className="text-green-700 font-bold mb-1">PROCESS IN CONTROL</h4>
                    <p className="text-sm text-green-900">
                      All cumulative sums (C+ and C-) are well within the designated decision intervals. 
                      The process mean is stable and aligned with the target of {target}.
                    </p>
                  </div>
                );
            }
          };

          const drawChart = () => {
            // GOD MODE FIX: Prevent visual collapsing on completely empty inputs
            if (cusumData.length === 0) return (
               <div className="flex items-center justify-center h-[280px] bg-gray-50 rounded-xl border border-dashed border-gray-300">
                  <span className="text-gray-400 font-semibold tracking-wider uppercase">Awaiting Data Input...</span>
               </div>
            );
            
            const chartWidth = Math.max(800, cusumData.length * 25);
            const chartHeight = 280;
            const padding = 35; 
            
            const hLim = stdDev * decisionH;
            const maxVal = Math.max(...cusumData.map(d => Math.max(d.cPlus, hLim * 1.2)));
            const minVal = Math.min(...cusumData.map(d => Math.min(d.cMinus, -hLim * 1.2)));
            const range = maxVal - minVal || 1; 
            
            const getY = (val) => chartHeight - padding - ((val - minVal) / range) * (chartHeight - 2 * padding);
            const getX = (index) => padding + (index * ((chartWidth - 2 * padding) / (cusumData.length - 1 || 1)));
            
            return (
              <div className="relative w-full bg-gray-50 rounded-xl border border-gray-200 shadow-inner group">
                <div className="overflow-x-auto w-full rounded-xl">
                  <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full min-w-[800px]">
                    {/* Grid lines & Background zones */}
                    <rect x="0" y={getY(hLim)} width="100%" height={getY(-hLim) - getY(hLim)} fill="#f0fdf4" opacity="0.6" />
                    <line x1="0" y1={getY(hLim)} x2="100%" y2={getY(hLim)} stroke="#ef4444" strokeWidth="2" strokeDasharray="5,5" />
                    <line x1="0" y1={getY(-hLim)} x2="100%" y2={getY(-hLim)} stroke="#ef4444" strokeWidth="2" strokeDasharray="5,5" />
                    <line x1="0" y1={getY(0)} x2="100%" y2={getY(0)} stroke="#64748b" strokeWidth="1" />
                    
                    {/* GOD MODE FIX: Injected Dynamic Numerical Outputs into the Limits */}
                    <text x="5" y={getY(hLim) - 5} fill="#ef4444" fontSize="12" fontWeight="bold">+h Limit (+{hLim.toFixed(2)})</text>
                    <text x="5" y={getY(-hLim) + 15} fill="#ef4444" fontSize="12" fontWeight="bold">-h Limit (-{hLim.toFixed(2)})</text>
                    
                    <text x="5" y={getY(0) - 5} fill="#64748b" fontSize="12">Target Mean (0 Drift) {useFIR && <tspan fill="#0d9488" fontWeight="bold"> [FIR Active]</tspan>}</text>

                    {/* GOD MODE FIX: Dynamic X-Axis Milestone Tracking */}
                    {cusumData.map((d, i) => {
                        if (d.index % 10 === 0) {
                            return (
                                <g key={`tick-${i}`}>
                                    <line x1={getX(i)} y1={getY(0) - 3} x2={getX(i)} y2={getY(0) + 3} stroke="#64748b" strokeWidth="1.5" />
                                    <text x={getX(i)} y={getY(0) + 16} fill="#94a3b8" fontSize="10" textAnchor="middle" fontWeight="bold">Obs {d.index}</text>
                                </g>
                            );
                        }
                        return null;
                    })}

                    {/* C+ Line */}
                    <polyline fill="none" stroke="#3b82f6" strokeWidth="2" points={cusumData.map((d, i) => `${getX(i)},${getY(d.cPlus)}`).join(' ')} />
                    {/* C- Line */}
                    <polyline fill="none" stroke="#8b5cf6" strokeWidth="2" points={cusumData.map((d, i) => `${getX(i)},${getY(d.cMinus)}`).join(' ')} />

                    {/* Data Points */}
                    {cusumData.map((d, i) => {
                      const cx = getX(i);
                      const cyPlus = getY(d.cPlus);
                      const cyMinus = getY(d.cMinus);
                      const color = d.status === 'red' ? '#ef4444' : d.status === 'yellow' ? '#eab308' : '#22c55e';
                      
                      return (
                        <g key={i}>
                          <circle 
                            cx={cx} cy={cyPlus} r="5" fill={color} stroke="#fff" strokeWidth="1.5"
                            className="cursor-pointer transition-all duration-200 hover:r-[8px]"
                            onMouseEnter={() => setHoveredPoint({...d, type: 'C+', yVal: d.cPlusRaw})}
                            onMouseLeave={() => setHoveredPoint(null)}
                          />
                          <circle 
                            cx={cx} cy={cyMinus} r="5" fill={color} stroke="#fff" strokeWidth="1.5"
                            className="cursor-pointer transition-all duration-200 hover:r-[8px]"
                            onMouseEnter={() => setHoveredPoint({...d, type: 'C-', yVal: d.cMinusRaw})}
                            onMouseLeave={() => setHoveredPoint(null)}
                          />
                        </g>
                      )
                    })}
                  </svg>
                </div>

                {hoveredPoint && (
                  <div className="absolute top-4 right-4 bg-white/95 backdrop-blur border border-gray-200 shadow-xl p-3 rounded-lg z-[100] pointer-events-none transition-opacity duration-200">
                    <div className="text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Point #{hoveredPoint.index} | {hoveredPoint.type}</div>
                    <div className="text-lg font-black text-gray-800">{hoveredPoint.yVal.toFixed(3)}</div>
                    <div className="mt-2 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                      <span className="text-gray-500">Raw Val:</span> <span className="font-semibold text-gray-700">{hoveredPoint.value}</span>
                      <span className="text-gray-500">Status:</span> 
                      <span className={`font-bold capitalize ${hoveredPoint.status === 'red' ? 'text-red-500' : hoveredPoint.status === 'yellow' ? 'text-yellow-500' : 'text-green-500'}`}>
                        {hoveredPoint.status}
                      </span>
                    </div>
                  </div>
                )}
              </div>
            );
          };

          const capaStats = getCapaAverages();
          const isProcessInControl = !cusumData.some(d => d.status === 'red');

          return (
            <div className="relative z-10 bg-white min-h-screen font-sans text-gray-800 selection:bg-teal-200">
              
              <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-md">
                <div className="max-w-7xl mx-auto px-4 py-6 sm:py-8 flex flex-col sm:flex-row items-center justify-between gap-6">
                  <div className="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-6">
                    <div className="bg-gradient-to-r from-teal-500 to-blue-600 text-white font-black text-lg sm:text-xl px-5 py-2 rounded-lg shadow-md tracking-widest transition-transform hover:scale-105 cursor-default">
                      MECTS....SET....GO
                    </div>
                    <div className="flex flex-col text-center sm:text-left">
                      <h1 className="text-3xl sm:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-gray-800 to-gray-500 tracking-tight">
                        CUSUM
                      </h1>
                      <span className="text-sm sm:text-base font-bold text-gray-400 uppercase tracking-widest mt-1">
                        Cumulative Sum Control Chart
                      </span>
                    </div>
                  </div>
                  <div className="flex space-x-3">
                    <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className="p-3 bg-gray-50 text-gray-600 hover:bg-gray-100 rounded-full transition-colors border border-gray-200 shadow-sm hover:shadow-md w-12 h-12 flex items-center justify-center" title="Toggle Settings">
                      <IconSettings />
                    </button>
                    <button onClick={exportCSV} className="p-3 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-full transition-colors border border-teal-100 shadow-sm hover:shadow-md w-12 h-12 flex items-center justify-center" title="Download Excel/CSV">
                      <IconDownload />
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <aside className={`lg:col-span-3 space-y-4 transition-all duration-300 ${isSettingsOpen ? 'block' : 'hidden'}`}>
                  <div className={`bg-white rounded-2xl shadow-lg border border-gray-100 p-5 transition-opacity ${capaApplied ? 'opacity-60 grayscale-[50%]' : ''}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-sm font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                        <IconSettings /> Parameters
                      </h2>
                      {capaApplied && <span className="flex items-center gap-1 text-[10px] uppercase font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded border border-orange-200"><IconLock /> Locked</span>}
                    </div>
                    
                    <div className="space-y-4 text-sm">
                      <div>
                        <label className="block text-gray-600 font-semibold mb-1">Industry Segment</label>
                        <select 
                          className="w-full border border-gray-300 rounded-lg p-2 bg-gray-50 focus:ring-2 focus:ring-teal-500 outline-none transition-shadow disabled:cursor-not-allowed"
                          value={industryIdx}
                          onChange={(e) => setIndustryIdx(Number(e.target.value))}
                          disabled={capaApplied}
                        >
                          {INDUSTRIES.map((ind, i) => <option key={i} value={i}>{ind.name}</option>)}
                        </select>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-gray-600 font-semibold mb-1">Target (&mu;)</label>
                          <input type="text" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed" value={targetStr} onChange={(e) => setTargetStr(e.target.value)} disabled={capaApplied} />
                        </div>
                        <div>
                          <label className="block text-gray-600 font-semibold mb-1">Std Dev (&sigma;)</label>
                          <input type="text" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed" value={stdDevStr} onChange={(e) => setStdDevStr(e.target.value)} disabled={capaApplied} />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="group relative">
                          <label className="block text-gray-600 font-semibold mb-1 border-b border-dashed border-gray-300 inline-block cursor-help">Slack (k)</label>
                          <input type="text" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed" value={slackKStr} onChange={(e) => setSlackKStr(e.target.value)} disabled={capaApplied} />
                        </div>
                        <div className="group relative">
                          <label className="block text-gray-600 font-semibold mb-1 border-b border-dashed border-gray-300 inline-block cursor-help">Limit (h)</label>
                          <input type="text" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed" value={decisionHStr} onChange={(e) => setDecisionHStr(e.target.value)} disabled={capaApplied} />
                        </div>
                      </div>

                      <div className="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between group relative cursor-help">
                        <label className={`font-semibold ${capaApplied ? 'text-gray-400' : 'text-gray-700'}`}>Enable FIR</label>
                        <button 
                          onClick={() => setUseFIR(!useFIR)}
                          disabled={capaApplied}
                          className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none disabled:cursor-not-allowed ${useFIR ? (capaApplied ? 'bg-teal-300' : 'bg-teal-500') : 'bg-gray-300'}`}
                        >
                          <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${useFIR ? 'translate-x-6' : 'translate-x-1'}`}/>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-5">
                    <div className="flex justify-between items-center mb-3">
                      <h2 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Data Input</h2>
                      <span className="text-[10px] font-bold text-green-800 bg-green-100 px-2 py-0.5 rounded border border-green-200 shadow-sm">
                        Min: 2 | Max: 500
                      </span>
                    </div>
                    <textarea 
                      className="w-full h-32 border border-gray-300 rounded-lg p-2 text-sm font-mono focus:ring-2 focus:ring-teal-500 outline-none resize-none"
                      value={dataInput}
                      onChange={(e) => {
                        setDataInput(e.target.value);
                        if (capaApplied) setCapaApplied(false);
                      }}
                      placeholder="Comma separated values..."
                    />
                    <div className="mt-1 text-xs font-extrabold text-green-800 text-right tracking-tight">
                      {cleanDataArray.length} / 500 entered
                    </div>
                    <div className="mt-3 flex gap-2">
                      <button onClick={generateSimulatedData} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-sm border border-gray-200 active:scale-95 transition-transform">
                        <IconRefresh /> Simulate Random
                      </button>
                    </div>
                  </div>
                </aside>

                {/* RIGHT MAIN AREA */}
                <section className={`transition-all duration-300 ${isSettingsOpen ? 'lg:col-span-9' : 'lg:col-span-12'}`}>
                  
                  {/* Chart Display */}
                  <div className="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-6 mb-6">
                    <div className="flex justify-between items-end mb-4 border-b border-gray-100 pb-4">
                      <div>
                        <h2 className="text-2xl font-black text-gray-800 tracking-tight">Cumulative Sum (CUSUM) Chart</h2>
                        <p className="text-gray-500 text-sm mt-1">Monitoring deviations from target ({target} {INDUSTRIES[industryIdx].unit})</p>
                      </div>
                      <div className="flex gap-4 text-sm font-semibold">
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-blue-500"></div> C+ (Positive Drift)</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-purple-500"></div> C- (Negative Drift)</span>
                      </div>
                    </div>
                    {drawChart()}
                  </div>

                  {/* Grid for Interpretation and CAPA */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 flex flex-col">
                      <h3 className="text-lg font-extrabold text-gray-800 mb-4 tracking-tight">Dynamic Interpretation</h3>
                      <div className="flex-grow">
                        {getInterpretation()}
                      </div>
                      <div className="mt-6 border-t border-gray-100 pt-4">
                        <h4 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Process Parameters</h4>
                        <div className="grid grid-cols-2 gap-4 text-sm">
                          <div className="bg-gray-50 p-3 rounded-lg"><span className="text-gray-500 block mb-1">Target Mean</span><strong className="text-lg text-gray-800">{target}</strong></div>
                          <div className="bg-gray-50 p-3 rounded-lg"><span className="text-gray-500 block mb-1">Std Deviation</span><strong className="text-lg text-gray-800">{stdDev}</strong></div>
                          <div className="bg-gray-50 p-3 rounded-lg"><span className="text-gray-500 block mb-1">Decision Limit (h)</span><strong className="text-lg text-gray-800">&plusmn; {(decisionH * stdDev).toFixed(2)}</strong></div>
                          <div className="bg-gray-50 p-3 rounded-lg"><span className="text-gray-500 block mb-1">Slack Val (k)</span><strong className="text-lg text-gray-800">{(slackK * stdDev).toFixed(2)}</strong></div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 flex flex-col">
                      <h3 className="text-lg font-extrabold text-gray-800 mb-4 tracking-tight">CAPA</h3>
                      <p className="text-sm text-gray-500 mb-4 flex-grow">
                        Apply Corrective and Preventive Actions (CAPA) to simulate bringing an out-of-control process back to its mean.
                      </p>
                      
                      {capaApplied && (
                        <div className="mb-6 animate-pulse-once transition-all">
                          <h4 className="text-sm font-bold text-teal-700 mb-3">Simulation Mechanics: How was it corrected?</h4>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                            <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg text-center shadow-sm">
                              <span className="block text-[10px] uppercase text-blue-500 font-bold mb-1 tracking-wider">Step 1: Isolate</span>
                              <span className="text-xs font-semibold text-blue-800">Target drifted data (Obs &ge; {dynamicShiftIndex + 1})</span>
                            </div>
                            <div className="bg-purple-50 border border-purple-200 p-3 rounded-lg text-center shadow-sm">
                              <span className="block text-[10px] uppercase text-purple-500 font-bold mb-1 tracking-wider">Step 2: Measure</span>
                              <span className="text-xs font-semibold text-purple-800">Calculate Error</span>
                            </div>
                            <div className="bg-green-50 border border-green-200 p-3 rounded-lg text-center shadow-sm">
                              <span className="block text-[10px] uppercase text-green-500 font-bold mb-1 tracking-wider">Step 3: Correct</span>
                              <span className="text-xs font-semibold text-green-800">Reduce Error Margin 80%</span>
                            </div>
                          </div>
                          <p className="text-xs text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-200 shadow-inner">
                            <strong>Mathematical Intervention:</strong> The MECTS PLATFORM applies the formula <code className="bg-white px-1.5 py-0.5 rounded border border-gray-200 text-teal-600 font-mono font-bold">New Value = Target + (Error × 0.2)</code> to all points after the process drifted.
                          </p>

                          <div className="bg-white border border-gray-200 rounded-lg p-4 mt-4 shadow-sm flex items-center justify-between">
                            <div className="text-center">
                              <div className="text-[10px] text-gray-500 uppercase font-bold">Target Mean</div>
                              <div className="text-lg font-black text-gray-800">{target.toFixed(2)}</div>
                            </div>
                            <div className="text-center">
                              <div className="text-[10px] text-red-500 uppercase font-bold">Real-time Error (Before)</div>
                              <div className="text-lg font-black text-red-600 line-through">{capaStats.before}</div>
                            </div>
                            <div className="text-center">
                              <div className="text-[10px] text-teal-500 uppercase font-bold">Corrected (After)</div>
                              <div className="text-lg font-black text-teal-600">{capaStats.after}</div>
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="flex gap-3 mt-auto relative group">
                        {!capaApplied ? (
                          <>
                            <button 
                              onClick={applyCAPA}
                              disabled={isProcessInControl}
                              className={`flex-1 font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95 ${
                                isProcessInControl 
                                  ? 'bg-gray-100 text-gray-400 shadow-none cursor-not-allowed border border-gray-200' 
                                  : 'bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 text-white shadow-teal-500/30'
                              }`}
                            >
                              Simulate CAPA Correction
                            </button>
                            {/* Deming Tampering Explanation tooltip visible if CAPA is disabled */}
                            {isProcessInControl && (
                              <div className="absolute hidden group-hover:block bottom-full mb-3 w-full bg-gray-800 text-white text-xs p-3 rounded-lg shadow-xl z-50 text-center">
                                <strong className="block text-red-400 mb-1">CAPA Disabled (Process in Control)</strong>
                                Applying corrective actions to a stable process mathematically increases variance (Deming's Rule of Tampering). Wait for a detected shift.
                                <div className="absolute top-full left-1/2 -mt-1 -ml-1 border-[6px] border-transparent border-t-gray-800"></div>
                              </div>
                            )}
                          </>
                        ) : (
                          <button 
                            onClick={revertCAPA}
                            className="flex-1 bg-gradient-to-r from-orange-400 to-red-500 hover:from-orange-500 hover:to-red-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-500/30 transition-all active:scale-95"
                          >
                            Revert to Original Data
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                </section>
              </main>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
