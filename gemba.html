        function getStatusColor(type, value) {
            if (value === "" || value === undefined || value === null) return "bg-slate-50 border-slate-300 text-slate-800";
            const v = parseFloat(value);
            if (isNaN(v)) return "bg-slate-50 border-slate-300 text-slate-800";

            if (type === 'yield') {
                if (v >= 98) return "bg-emerald-50 border-emerald-200 text-emerald-700"; 
                if (v >= 90) return "bg-amber-50 border-amber-200 text-amber-700"; 
                return "bg-red-50 border-red-200 text-red-700"; 
            }
            if (type === 'uptime') {
                if (v >= 95) return "bg-indigo-50 border-indigo-200 text-indigo-700"; 
                if (v >= 85) return "bg-amber-50 border-amber-200 text-amber-700"; 
                return "bg-red-50 border-red-200 text-red-700"; 
            }
            if (type === 'rework') {
                if (v <= 1) return "bg-emerald-50 border-emerald-200 text-emerald-700"; 
                if (v <= 5) return "bg-amber-50 border-amber-200 text-amber-700"; 
                return "bg-red-50 border-red-200 text-red-700"; 
            }
            return "bg-slate-50 border-slate-300 text-slate-800"; 
        }

        function getKPITextColor(type, value) {
            const v = parseFloat(value);
            if (isNaN(v)) return "text-slate-600";
            
            if (type === 'oee') {
                if (v >= 85) return "text-emerald-500";
                if (v >= 70) return "text-amber-500";
                return "text-red-500";
            }
            if (type === 'rty') {
                if (v >= 90) return "text-yellow-400";
                if (v >= 80) return "text-amber-400";
                return "text-red-400";
            }
            return "text-blue-600"; 
        }

        const TooltipLabel = ({ label, tooltip, colorClass = "text-slate-500", isPdf = false }) => (
            <div className={`relative ${isPdf ? '' : 'group cursor-help'} flex items-center mb-1.5`}>

                </span>
                {!isPdf && (
                    <div className="absolute bottom-full left-0 mb-2 w-56 p-2.5 bg-slate-800 text-white text-[11px] rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 font-normal normal-case leading-relaxed">

        );

        function App() {
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            const [showMectopedia, setShowMectopedia] = useState(false);
            const [showCapaModal, setShowCapaModal] = useState(false);
            const [inputErrors, setInputErrors] = useState([]);
            const [dismissedAlerts, setDismissedAlerts] = useState([]);
            
            const [selectedIndustry, setSelectedIndustry] = useState("User Defined / Custom");
            const [scenario, setScenario] = useState("Baseline");
            const [activeCategory, setActiveCategory] = useState("basic_flow");
            const [activeMetricId, setActiveMetricId] = useState("takt");
            const [timeUnit, setTimeUnit] = useState("Seconds");
            
            const [printMessage, setPrintMessage] = useState("");

            const [globals, setGlobals] = useState(getPresetData("User Defined / Custom").globals);
            const [processes, setProcesses] = useState(getPresetData("User Defined / Custom").processes);
            
            const [capaItems, setCapaItems] = useState([
                { id: 1, problem: "", rootCause: "", action: "", owner: "", deadline: "", status: "Open" }
            ]);

            const unitLabel = timeUnit === "Minutes" ? "Min" : "Sec";

            useEffect(() => { 
                if (metricLibrary[activeCategory] && metricLibrary[activeCategory].metrics.length > 0) {
                    setActiveMetricId(metricLibrary[activeCategory].metrics[0].id); 
                }
            }, [activeCategory]);

            const showInputError = (msg) => {
                const id = Date.now() + Math.random();
                setInputErrors(prev => [...prev, { id, msg }]);
                setTimeout(() => {
                    setInputErrors(prev => prev.filter(e => e.id !== id));
                }, 4000);
            };

            const validateNumeric = (val, fieldName, maxVal = null) => {
                if (val === '') return true;
                if (!/^\d*\.?\d*$/.test(val)) {
                    showInputError(`Invalid character in ${fieldName}. Only positive numerical values allowed.`);
                    return false;
                }
                if (maxVal !== null && parseFloat(val) > maxVal) {
                    showInputError(`${fieldName} cannot exceed ${maxVal}.`);
                    return false;
                }
                return true;
            };

            const handleOpenCapa = () => {
                if (selectedIndustry === "User Defined / Custom" && !globals.demand) {
                    showInputError("Please update the data values.");
                    return;
                }
                setShowCapaModal(true);
            };

            const rawAlerts = useMemo(() => {
                const alerts = [];
                const d = parseFloat(globals.demand);
                const s = parseFloat(globals.shifts);
                const h = parseFloat(globals.hoursPerShift);

                if (globals.demand !== "" && (isNaN(d) || d <= 0)) alerts.push({ id: 'dem', type: 'error', msg: "Critical: Customer Demand is Zero/Invalid! Takt Time cannot be established." });
                if (globals.shifts !== "" && globals.hoursPerShift !== "" && (isNaN(s) || s <= 0 || isNaN(h) || h <= 0)) alerts.push({ id: 'time', type: 'error', msg: "Critical: Available Shift Time is Zero! Operations are halted." });

                let highWip = false, lowYield = false, highSetup = false;
                
                if (parseFloat(globals.setupMins) > 120) highSetup = true;

                processes.forEach(p => {
                    if (parseFloat(p.wip) > 1000) highWip = true;
                    if (parseFloat(p.yield) < 80 && p.yield !== "") lowYield = true;
                });

                if (highWip) alerts.push({ id: 'wip', type: 'warn', msg: "Warning: Excessive WIP bottleneck detected. Flow efficiency at risk." });
                if (lowYield) alerts.push({ id: 'yld', type: 'warn', msg: "Warning: Severe Quality Drop! Station yield has fallen below 80%." });
                if (highSetup) alerts.push({ id: 'set', type: 'warn', msg: "Warning: High Changeover Time. Recommend SMED intervention." });

                return alerts;
            }, [globals, processes]);

            useEffect(() => {
                const currentIds = rawAlerts.map(a => a.id);
                setDismissedAlerts(prev => prev.filter(id => currentIds.includes(id)));
            }, [rawAlerts]);

            const activeAlerts = rawAlerts.filter(a => !dismissedAlerts.includes(a.id));

            const dynamicRecommendations = useMemo(() => {
                let recs = [];
                let botName = "the bottleneck";
                
                let maxCT = 0;
                processes.forEach((p, idx) => {
                    const ct = parseFloat(p.ct) || 0;
                    if (ct > maxCT) {
                        maxCT = ct;
                        botName = p.name || `Step ${idx + 1}`;
                    }
                });

                if (activeAlerts.find(a => a.id === 'wip')) {
                    recs.push({ type: 'WIP Constraint', text: `Implement Kanban supermarkets upstream of ${botName} to control overproduction and cap WIP buildup.` });
                }
                if (activeAlerts.find(a => a.id === 'yld')) {
                    recs.push({ type: 'Quality Bleed', text: `Initiate immediate Root Cause Analysis (Fishbone/5-Why) on high-defect stations to arrest scrap in ${selectedIndustry}.` });
                }
                if (activeAlerts.find(a => a.id === 'set')) {
                    recs.push({ type: 'Agility Block', text: `Apply SMED (Single-Minute Exchange of Die) techniques to externalize setup tasks and reduce changeover time.` });
                }
                if (activeAlerts.find(a => a.id === 'dem') || activeAlerts.find(a => a.id === 'time')) {
                    recs.push({ type: 'System Failure', text: `Critical system parameters missing. Verify Customer Demand and Shift Availability inputs immediately.` });
                }
                if (recs.length === 0) {
                    recs.push({ type: 'Continuous Improvement', text: `System operating within optimal thresholds for ${selectedIndustry}. Focus on micro-kaizens and sustaining 5S standards.` });
                }
                return recs;
            }, [activeAlerts, selectedIndustry, processes]);

            useEffect(() => {
                const dem = parseFloat(globals.demand);
                if (dem > 0) {
                    setProcesses(prev => prev.map(p => {
                        if (p.yield !== "") {
                            return { ...p, defects: Math.max(0, dem * (100 - parseFloat(p.yield)) / 100).toFixed(0) };
                        }
                        return p;
                    }));
                }
            }, [globals.demand]);

            const handleTimeUnitChange = (e) => {
                const newUnit = e.target.value;
                if (newUnit === timeUnit) return;
                const multiplier = newUnit === 'Minutes' ? (1 / 60) : 60;
                setProcesses(processes.map(p => ({
                    ...p,
                    ct: p.ct !== "" ? (parseFloat(p.ct) * multiplier).toFixed(1).replace(/\.0$/, '') : "",
                    manualCt: p.manualCt !== "" ? (parseFloat(p.manualCt) * multiplier).toFixed(1).replace(/\.0$/, '') : "",
                    machineCt: p.machineCt !== "" ? (parseFloat(p.machineCt) * multiplier).toFixed(1).replace(/\.0$/, '') : ""
                })));
                setTimeUnit(newUnit);
            };

            const handleClearAll = () => {
                if (window.confirm("Are you sure you want to clear ALL data? This will reset the platform to a blank state.")) {
                    const blank = getPresetData("User Defined / Custom");
                    setSelectedIndustry("User Defined / Custom");
                    setScenario("Baseline");
                    setGlobals(blank.globals);
                    setProcesses(blank.processes);
                    setCapaItems([{ id: Date.now(), problem: "", rootCause: "", action: "", owner: "", deadline: "", status: "Open" }]);
                    setDismissedAlerts([]); 
                }
            };

            const sm = {
                ct: scenario === 'Best Case' ? 0.85 : scenario === 'Catastrophic' ? 1.50 : 1,
                up: scenario === 'Best Case' ? 1.10 : scenario === 'Catastrophic' ? 0.70 : 1,
                yld: scenario === 'Best Case' ? 1.05 : scenario === 'Catastrophic' ? 0.70 : 1,
                setup: scenario === 'Best Case' ? 0.75 : scenario === 'Catastrophic' ? 2.00 : 1,
                rew: scenario === 'Best Case' ? 0.50 : scenario === 'Catastrophic' ? 2.50 : 1
            };

            const safeNum = (val) => isNaN(val) || !isFinite(val) ? 0 : val;

            const results = useMemo(() => {
                const s = parseFloat(globals.shifts) || 0;
                const h = parseFloat(globals.hoursPerShift) || 0;
                const b = parseFloat(globals.breaks) || 0; 
                const dem = parseFloat(globals.demand) || 0;
                const day = parseFloat(globals.days) || 0;
                
                const availTime = s * ((h * (timeUnit==='Minutes'?60:3600)) - (b * (timeUnit==='Minutes'?1:60))); 
                const dailyDem = day > 0 ? dem / day : 0;
                const takt = dailyDem > 0 ? availTime / dailyDem : 0;

                let tVA=0, tWIP=0, tLabor=0, mCT=0, rYld=1, sYld=0, aUp=0, tOps=0, gMan=0, gMach=0, gRew=0, gBat=0;
                let bName = "None";

                processes.forEach((p, idx) => {
                    const ct = p.ct !== "" ? (parseFloat(p.ct) || 0) * sm.ct : 0;
                    const ops = parseFloat(p.ops)||0; 
                    const yld = p.yield !== "" ? Math.min(1, ((parseFloat(p.yield) || 0) / 100) * sm.yld) : 1; 
                    const up = p.up !== "" ? Math.min(1, ((parseFloat(p.up) || 0) / 100) * sm.up) : 1;
                    const rew = p.rework !== "" ? (parseFloat(p.rework) || 0) * sm.rew : 0;

                    tVA+=ct; tWIP+=parseFloat(p.wip)||0; tLabor+=(ct*ops); tOps+=ops;
                    gMan+=parseFloat(p.manualCt)||0; gMach+=parseFloat(p.machineCt)||0; gRew+=rew; gBat+=parseFloat(p.batchSize)||0;
                    rYld *= yld; sYld += yld; aUp += up;
                    if(ct>mCT){ mCT=ct; bName=p.name||`Step ${idx+1}`; }
                });

                const numP = processes.length || 1;
                let minYield = 1;
                if (processes.length > 0) {
                    minYield = Math.min(...processes.map(p => p.yield !== "" ? Math.min(1, ((parseFloat(p.yield) || 0) / 100) * sm.yld) : 1));
                }
                
                const ltDays = safeNum((dailyDem>0?tWIP/dailyDem:0) + (availTime>0?tVA/availTime:0));
                const pce = safeNum((ltDays>0&&availTime>0)?(tVA/(ltDays*availTime))*100:0);
                const oeePerf = safeNum((numP>0 && mCT>0)?(tVA/(numP*mCT)):0);
                const oee = safeNum((aUp/numP) * oeePerf * rYld * 100); 

                const fmtH = safeNum(tVA / (timeUnit==='Minutes'?60:3600));
                const waitH = safeNum(Math.max(0, (ltDays*availTime)-tVA) / (timeUnit==='Minutes'?60:3600));

                const trueSetupMins = safeNum((parseFloat(globals.setupMins) || 0) * sm.setup);

                return {
                    takt: safeNum(takt).toFixed(1) + ` ${unitLabel}`, 
                    ct: safeNum(mCT).toFixed(1) + ` ${unitLabel}`,
                    lt: safeNum(ltDays).toFixed(2) + ' Days', 
                    work_content: safeNum(tVA).toFixed(1) + ` ${unitLabel}`,
                    waiting: safeNum(Math.max(0, (ltDays*availTime)-tVA)).toFixed(1) + ` ${unitLabel}`,
                    co_time: safeNum(trueSetupMins * (timeUnit==='Minutes'?1:60)).toFixed(1) + ` ${unitLabel}`, 
                    smed_ratio: takt>0 ? safeNum(((trueSetupMins*(timeUnit==='Minutes'?1:60))/takt)*100).toFixed(1)+'%' : '0%',
                    utilization: takt>0 ? safeNum(mCT/takt*100).toFixed(1)+'%' : '0%',
                    bottleneck: bName, 
                    balancing: mCT>0 ? safeNum((tVA/(numP*mCT))*100).toFixed(1)+'%' : '0%',
                    workforce: takt>0 ? safeNum(tVA/takt).toFixed(1)+' Heads' : '0', 
                    wip: safeNum(tWIP).toFixed(0)+' Units',
                    littles_law: safeNum(dailyDem*ltDays).toFixed(0)+' Units', 
                    inv_turns: tWIP>0 ? safeNum((dem*12)/tWIP).toFixed(1)+' Turns/Yr' : '∞',
                    flow_eff: safeNum(pce).toFixed(2)+'%', 
                    fpy: safeNum(minYield*100).toFixed(1)+'%', 
                    rty: safeNum(rYld*100).toFixed(1)+'%',
                    total_defects: safeNum(dem*(1-rYld)).toFixed(0)+' Units', 
                    dpmu: safeNum((1-rYld)*1000000).toFixed(0),
                    scrap_rate: safeNum((1-rYld)*100).toFixed(1)+'%', 
                    va_cost: '₹'+safeNum(fmtH*parseFloat(globals.laborRate||0)).toFixed(2),
                    nva_cost: '₹'+safeNum(waitH*parseFloat(globals.laborRate||0)).toFixed(2), 
                    scrap_cost: '₹'+safeNum((dem*(1-rYld))*parseFloat(globals.unitCost||0)).toFixed(2),
                    blocked_cap: '₹'+safeNum(tWIP*parseFloat(globals.unitCost||0)*0.15).toFixed(0), 
                    epei: safeNum(trueSetupMins/60).toFixed(2)+' Hrs',
                    kanban: safeNum(Math.ceil((dailyDem*ltDays*1.1)/parseFloat(globals.containerSize||50))).toFixed(0)+' Bins',
                    pitch: safeNum((takt/(timeUnit==='Minutes'?1:60))*parseFloat(globals.containerSize||1)).toFixed(1)+' Mins',
                    cov: safeNum(tVA>0?parseFloat(globals.ctStdDev||0)/(tVA/numP):0).toFixed(2), 
                    service_lvl: safeNum(rYld*100*0.95).toFixed(1)+'%',
                    oee: safeNum(oee).toFixed(1)+'%', 
                    availability: safeNum(aUp/numP*100).toFixed(1)+'%', 
                    performance: safeNum(oeePerf*100).toFixed(1)+'%',
                    quality_oee: safeNum(rYld*100).toFixed(1)+'%', 
                    c2c: safeNum(ltDays+parseFloat(globals.daysAR||0)-parseFloat(globals.daysAP||0)).toFixed(1)+' Days',
                    dock2dock: safeNum(ltDays*1.05).toFixed(1)+' Days', 
                    std_time: safeNum(tVA*1.15).toFixed(1)+` ${unitLabel}`,
                    ops_util: (tOps>0&&availTime>0)?safeNum(((tLabor*dailyDem)/(tOps*availTime))*100).toFixed(1)+'%':'0%',
                    handoff: safeNum(Math.max(0, (ltDays*availTime)-tVA)/numP).toFixed(1)+` ${unitLabel}`,
                    gemba_manual: safeNum(gMan).toFixed(1)+` ${unitLabel}`, 
                    gemba_machine: safeNum(gMach).toFixed(1)+` ${unitLabel}`,
                    gemba_rework: safeNum(gRew/numP).toFixed(1)+'%', 
                    gemba_batch: safeNum(gBat/numP).toFixed(0)+' Units',
                    gemba_labor_util: (tOps>0&&availTime>0)?safeNum(((tLabor*dailyDem)/(tOps*availTime))*100).toFixed(1)+'%':'0%',
                    gemba_inv_safety: safeNum(parseFloat(globals.invSafety)||0).toString() + ' Units',
                    gemba_inv_fg: safeNum(parseFloat(globals.invFG)||0).toString() + ' Units',
                    gemba_inv_rm: safeNum(parseFloat(globals.invRM)||0).toString() + ' Units',
                    gemba_inv_total_turns: (() => {
                        const totalInv = tWIP + (parseFloat(globals.invFG) || 0) + (parseFloat(globals.invRM) || 0);
                        return totalInv > 0 ? safeNum((dem * 12) / totalInv).toFixed(1) + ' Turns' : '∞';
                    })(),
                    gemba_supp_lt: safeNum(parseFloat(globals.suppLT)||0).toString() + ' Days',
                    gemba_supp_freq: safeNum(parseFloat(globals.suppFreq)||0).toString() + ' / Wk',
                    gemba_supp_otd: safeNum(parseFloat(globals.suppOTD)||0).toString() + '%',
                    gemba_supp_defects: safeNum(parseFloat(globals.suppDefect)||0).toString() + '%',
                    gemba_cust_vol: safeNum(dem).toString() + ' Units',
                    gemba_cust_var: safeNum(parseFloat(globals.custVariation)||0).toString() + '%',
                    gemba_cust_sl: safeNum(parseFloat(globals.custSL)||0).toString() + '%',
                    
                    raw_lt: safeNum(ltDays).toFixed(2), 
                    raw_pce: safeNum(pce).toFixed(2), 
                    raw_labor: safeNum(tLabor).toFixed(1), 
                    raw_fpy: safeNum(minYield*100).toFixed(1), 
                    raw_rty: safeNum(rYld*100).toFixed(1), 
                    raw_oee: safeNum(oee).toFixed(1),
                    bottleneck: bName
                };
            }, [globals, processes, timeUnit, scenario]);

            const execSummary = useMemo(() => {
                const scrap = results.scrap_cost || "₹0.00";
                const rty = results.raw_rty || "0.0";
                const pce = results.raw_pce || "0.0";
                const oee = results.raw_oee || "0.0";
                const bot = results.bottleneck || "None";
                const defects = results.total_defects || "0 Units";
                const blockedCap = results.blocked_cap || "₹0";
                
                let text = `Diagnostic Evaluation: Based on the current Value Stream mapping, the system is operating at an Overall Equipment Effectiveness (OEE) of ${oee}%. `;
                text += `The constraint (bottleneck) has been identified at ${bot}, pacing the entire line to a Flow Efficiency of ${pce}%. `;
                if (parseFloat(rty) < 95) {
                    text += `Quality is a critical risk factor; a Rolled Throughput Yield of ${rty}% means the system is bleeding ${defects} monthly, generating a direct financial loss of ${scrap}. `;
                } else {
                    text += `Quality remains stable with an RTY of ${rty}%, generating minimal scrap liability (${scrap}). `;
                }
                text += `Working capital currently trapped in systemic inventory is calculated at ${blockedCap}. Focus improvement efforts on the CAPA items below to accelerate velocity and reduce defects.`;
                
                return text;
            }, [results]);

            const dynamicMectopedia = useMemo(() => [
                { term: "Takt Time", def: "The calculated ideal pace of production required to meet customer demand exactly on time.", analogy: "The heartbeat or metronome of a factory.", formula: "(Available Working Time) / (Demand)", live: results.takt },
                { term: "Cycle Time (CT)", def: "The actual time it takes to successfully complete one single process or step.", analogy: "The time it takes a chef to cook and plate one single burger.", formula: "Max(Observed Time per Unit)", live: results.ct },
                { term: "Manual Touch Time (Man CT)", def: "The specific amount of time a human operator is physically working on the unit.", analogy: "A surgeon actively performing an operation.", formula: "Σ Human Processing Time", live: results.gemba_manual },
                { term: "Machine Cycle Time (Mach CT)", def: "The time a machine operates autonomously to process a unit without human intervention.", analogy: "A washing machine running its cycle while you walk away.", formula: "Σ Automated Processing Time", live: results.gemba_machine },
                { term: "Lead Time (LT)", def: "The total holistic time a product takes to travel through the entire system, including all waiting and queues.", analogy: "The total time from ordering at a drive-thru until receiving your food.", formula: "Σ (Inventory / Daily Demand) + Σ (VA Time)", live: results.lt },
                { term: "WIP (Work In Process)", def: "Items that have entered the production process but are not yet finished goods.", analogy: "Cars currently stuck in traffic between intersections.", formula: "Count of units physically on the floor between processes", live: results.wip },
                { term: "Uptime % (Availability)", def: "The percentage of scheduled time that the equipment is actually available to operate.", analogy: "A bus that runs 9 hours out of its 10-hour shift without breaking down has 90% uptime.", formula: "(Operating Time - Downtime) / Scheduled Time", live: results.availability },
                { term: "First Pass Yield (FPY)", def: "The percentage of units that complete a process perfectly the very first time without rework. This engine tracks the lowest-performing station as the bottleneck.", analogy: "Passing a driving test flawlessly on the first attempt.", formula: "Min(Station Yields)", live: results.fpy },
                { term: "Rolled Throughput Yield (RTY)", def: "The true probability of a unit passing through the entire process without any defects or rework.", analogy: "Beating a 10-level video game without taking a single point of damage.", formula: "Yield 1 × Yield 2 × ... × Yield N", live: results.rty },
                { term: "Defects & Scrap", def: "Products that fail to meet quality standards and must be discarded or reworked.", analogy: "Burnt toast that has to be thrown in the trash.", formula: "Demand × (1 - RTY)", live: results.total_defects },
                { term: "Rework Rate %", def: "The percentage of items that require correction before they can move to the next step.", analogy: "Having to re-iron a shirt because it still has wrinkles.", formula: "(Reworked Units / Total Units) × 100", live: results.gemba_rework },
                { term: "Batch Size", def: "The number of units processed together before being moved to the next operation.", analogy: "Baking a tray of 12 cookies instead of 1 cookie at a time.", formula: "Units grouped per transfer", live: results.gemba_batch },
                { term: "OEE (Overall Equipment Effectiveness)", def: "The gold standard metric combining Availability, Performance, and Quality into one percentage.", analogy: "A student's final grade factoring attendance, speed, and accuracy.", formula: "Availability × Performance × Quality", live: results.oee },
                { term: "Flow Efficiency", def: "The ratio of Value-Added time (actually working) compared to the Total Lead Time (which includes waiting).", analogy: "Going to a theme park for 5 hours but only spending 25 minutes riding.", formula: "(Total Value-Added Time / Lead Time) × 100", live: results.flow_eff },
                { term: "Capacity Utilization", def: "Measures how much of the process's maximum potential output is actually being used.", analogy: "A 50-seat restaurant serving 40 customers is at 80% utilization.", formula: "(Bottleneck Cycle Time / Takt Time) × 100", live: results.utilization },
                { term: "Labor Utilization", def: "Tracks workforce efficiency against the total daily capacity.", analogy: "A worker actively stocking shelves 7 hours out of an 8 hour shift.", formula: "(Total Labor Content × Daily Demand) / (Total Operators × Available Time)", live: results.gemba_labor_util },
                { term: "SMED (Changeover Time)", def: "Single-Minute Exchange of Die. The time taken to switch a machine from making Product A to Product B.", analogy: "A Formula 1 pit stop.", formula: "Internal Setup Time + External Setup Time", live: results.co_time },
                { term: "Kanban", def: "A visual signaling system used to trigger action or production based on actual pull/demand.", analogy: "The 'Empty' line on a milk jug telling you to buy more.", formula: "((Daily Demand × Lead Time) × Safety Factor) / Container Size", live: results.kanban },
                { term: "Bottleneck", def: "The specific stage in a process that has the longest cycle time, dictating the maximum speed of the system.", analogy: "The narrow neck of an hourglass restricting sand flow.", formula: "Process with Max(Cycle Time)", live: results.bottleneck },
                { term: "Inventory Turns", def: "How many times a company's inventory is sold and replaced over a year.", analogy: "A grocery store restocking its milk aisle completely twice a week.", formula: "(Annual Demand) / (Average Total Inventory)", live: results.inv_turns },
                { term: "Blocked Capital", def: "The amount of cash tied up in physical inventory sitting on the floor.", analogy: "Leaving cash in a locked safe where it can't earn interest.", formula: "Total WIP × Unit Cost × Holding %", live: results.blocked_cap }
            ], [results]);

            const handleExportExcel = async () => {
                if (typeof window.ExcelJS === 'undefined') {
                    setPrintMessage("Excel library not loaded. Refreshing page may help.");
                    setTimeout(() => setPrintMessage(""), 4000);
                    return;
                }
                setPrintMessage("Generating Dynamic Formula-Driven Excel. Please wait...");
                try {
                    const workbook = new window.ExcelJS.Workbook();
                    
                    const parseSimpleNum = (val) => {
                        if (val === undefined || val === null || val === "") return "";
                        const num = Number(val);
                        return isNaN(num) ? val : num;
                    };

                    const headStyle = (row, bg) => {
                        row.eachCell(c => { c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}}; c.font = {bold:true, color:{argb:'FFFFFFFF'}}; c.alignment={horizontal:'center', vertical:'middle'}; });
                    };

                    const styleTableRow = (row, isHeader, bgColor) => {
                        row.eachCell(c => {
                            if(bgColor) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
                            if(isHeader) c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                            c.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
                            c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                        });
                    };

                    const addSectionHeader = (sheet, title, color, colSpan) => {
                        const row = sheet.addRow([title]);
                        sheet.mergeCells(row.number, 1, row.number, colSpan);
                        row.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: color } };
                        row.getCell(1).font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
                        row.height = 25;
                        row.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };
                    };

                    const wsSum = workbook.addWorksheet('1. Summary & KPIs');
                    wsSum.columns = [{ width: 35 }, { width: 25 }, { width: 20 }];
                    let r = wsSum.addRow(['MECTS SET...GO - VSM/VPM ENGINE']);
                    wsSum.mergeCells(r.number, 1, r.number, 3);
                    r.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF000000' } };
                    r.getCell(1).font = { bold: true, color: { argb: 'FFFACC15' }, size: 16 };
                    r.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
                    r.height = 35;

                    wsSum.addRow([]);
                    wsSum.addRow(['Industry Segment', selectedIndustry]).font = { bold: true };
                    wsSum.addRow(['Simulation Scenario', scenario]).font = { bold: true };
                    wsSum.addRow(['Base Time Unit', timeUnit]).font = { bold: true };
                    wsSum.addRow(['Export Date', new Date().toLocaleString()]).font = { bold: true };
                    wsSum.addRow([]);

                    r = wsSum.addRow(['CORE KPI RESULTS']);
                    wsSum.mergeCells(r.number, 1, r.number, 2);
                    r.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF08A' } };
                    r.getCell(1).font = { bold: true, color: { argb: 'FF854D0E' }, size: 14 };
                    r.height = 25;

                    const kpiHRow = wsSum.addRow(['Metric', 'Calculated Value']);
                    kpiHRow.eachCell(c => { 
                        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCA8A04' } }; 
                        c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; 
                    });

                    const prEnd = 100; 
                    const H_MULT = timeUnit === 'Minutes' ? 60 : 3600;
                    const B_MULT = timeUnit === 'Minutes' ? 1 : 60;

                    const F_NumProc = `MAX(1, COUNT('3. Value Process Flow'!C3:C${prEnd}))`;
                    const F_AvailTime = `('2. Global & Gemba Data'!A3*('2. Global & Gemba Data'!B3*${H_MULT}-'2. Global & Gemba Data'!C3*${B_MULT}))`;
                    const F_DailyDem = `IF('2. Global & Gemba Data'!E3>0,'2. Global & Gemba Data'!D3/'2. Global & Gemba Data'!E3,0)`;
                    const F_Takt = `IF(${F_DailyDem}>0,${F_AvailTime}/${F_DailyDem},0)`;
                    const F_TotalVA = `SUM('3. Value Process Flow'!C3:C${prEnd})`;
                    const F_TotalWIP = `SUM('3. Value Process Flow'!B3:B${prEnd})`;
                    const F_MaxCT = `MAX('3. Value Process Flow'!C3:C${prEnd})`;
                    const F_LTDays = `(IF(${F_DailyDem}>0,${F_TotalWIP}/${F_DailyDem},0)+IF(${F_AvailTime}>0,${F_TotalVA}/${F_AvailTime},0))`;
                    const F_ProdYld = `IF(COUNT('3. Value Process Flow'!E3:E${prEnd})=0, 1, PRODUCT('3. Value Process Flow'!E3:E${prEnd})/POWER(100,COUNT('3. Value Process Flow'!E3:E${prEnd})))`;
                    const F_MinYld = `IF(COUNT('3. Value Process Flow'!E3:E${prEnd})=0, 1, MIN('3. Value Process Flow'!E3:E${prEnd})/100)`;
                    const F_AvgUp = `IFERROR(AVERAGE('3. Value Process Flow'!D3:D${prEnd})/100, 1)`;
                    const F_TotalOps = `SUM('3. Value Process Flow'!G3:G${prEnd})`;
                    const F_TotalLabor = `SUMPRODUCT('3. Value Process Flow'!C3:C${prEnd}, '3. Value Process Flow'!G3:G${prEnd})`;

                    const excelFormulas = {
                        takt: `${F_Takt}`,
                        ct: `${F_MaxCT}`,
                        lt: `${F_LTDays}`,
                        work_content: `${F_TotalVA}`,
                        waiting: `MAX(0, (${F_LTDays}*${F_AvailTime})-${F_TotalVA})`,
                        co_time: `('2. Global & Gemba Data'!K3 * ${timeUnit === 'Minutes' ? 1 : 60})`,
                        smed_ratio: `IF(${F_Takt}>0, ('2. Global & Gemba Data'!K3 * ${timeUnit === 'Minutes' ? 1 : 60})/${F_Takt}, 0)`,
                        utilization: `IF(${F_Takt}>0, ${F_MaxCT}/${F_Takt}, 0)`,
                        balancing: `IF(${F_MaxCT}>0, ${F_TotalVA}/(${F_NumProc}*${F_MaxCT}), 0)`,
                        workforce: `IF(${F_Takt}>0, ${F_TotalVA}/${F_Takt}, 0)`,
                        wip: `${F_TotalWIP}`,
                        littles_law: `(${F_DailyDem}*${F_LTDays})`, 
                        inv_turns: `IF(${F_TotalWIP}>0, ('2. Global & Gemba Data'!D3*12)/${F_TotalWIP}, "∞")`,
                        flow_eff: `IF((${F_LTDays}*${F_AvailTime})>0, ${F_TotalVA}/(${F_LTDays}*${F_AvailTime}), 0)`,
                        fpy: `${F_MinYld}`,
                        rty: `${F_ProdYld}`,
                        total_defects: `'2. Global & Gemba Data'!D3 * (1 - ${F_ProdYld})`,
                        dpmu: `(1 - ${F_ProdYld}) * 1000000`,
                        scrap_rate: `1 - ${F_ProdYld}`,
                        va_cost: `(${F_TotalVA}/${H_MULT})*'2. Global & Gemba Data'!F3`,
                        nva_cost: `(MAX(0, (${F_LTDays}*${F_AvailTime})-${F_TotalVA})/${H_MULT})*'2. Global & Gemba Data'!F3`,
                        scrap_cost: `('2. Global & Gemba Data'!D3 * (1 - ${F_ProdYld})) * '2. Global & Gemba Data'!G3`,
                        blocked_cap: `(${F_TotalWIP}*'2. Global & Gemba Data'!G3*0.15)`,
                        epei: `('2. Global & Gemba Data'!K3 / 60)`,
                        kanban: `CEILING((${F_DailyDem}*${F_LTDays}*1.1)/'2. Global & Gemba Data'!H3, 1)`,
                        pitch: `(${F_Takt}/${timeUnit === 'Minutes' ? 1 : 60})*'2. Global & Gemba Data'!H3`,
                        cov: `IF(${F_TotalVA}>0, '2. Global & Gemba Data'!L3 / (${F_TotalVA}/${F_NumProc}), 0)`,
                        service_lvl: `${F_ProdYld} * 0.95`,
                        availability: `${F_AvgUp}`,
                        performance: `IF(${F_MaxCT}>0, ${F_TotalVA}/(${F_NumProc}*${F_MaxCT}), 0)`, 
                        quality_oee: `${F_ProdYld}`,
                        oee: `${F_AvgUp} * IF(${F_MaxCT}>0, ${F_TotalVA}/(${F_NumProc}*${F_MaxCT}), 0) * ${F_ProdYld}`, 
                        c2c: `${F_LTDays} + '2. Global & Gemba Data'!I3 - '2. Global & Gemba Data'!J3`,
                        dock2dock: `${F_LTDays} * 1.05`,
                        std_time: `${F_TotalVA} * 1.15`,
                        ops_util: `IF(AND(${F_TotalOps}>0, ${F_AvailTime}>0), (${F_TotalLabor}*${F_DailyDem})/(${F_TotalOps}*${F_AvailTime}), 0)`, 
                        handoff: `MAX(0, (${F_LTDays}*${F_AvailTime})-${F_TotalVA})/${F_NumProc}`,
                        gemba_manual: `SUM('3. Value Process Flow'!H3:H${prEnd})`,
                        gemba_machine: `SUM('3. Value Process Flow'!I3:I${prEnd})`,
                        gemba_rework: `IFERROR(AVERAGE('3. Value Process Flow'!K3:K${prEnd})/100, 0)`,
                        gemba_batch: `IFERROR(AVERAGE('3. Value Process Flow'!J3:J${prEnd}), 0)`,
                        gemba_labor_util: `IF(AND(${F_TotalOps}>0, ${F_AvailTime}>0), (${F_TotalLabor}*${F_DailyDem})/(${F_TotalOps}*${F_AvailTime}), 0)`,
                        gemba_inv_safety: `'2. Global & Gemba Data'!A15`,
                        gemba_inv_fg: `'2. Global & Gemba Data'!B15`,
                        gemba_inv_rm: `'2. Global & Gemba Data'!C15`,
                        gemba_inv_total_turns: `IF(SUM('2. Global & Gemba Data'!A15, '2. Global & Gemba Data'!B15, '2. Global & Gemba Data'!C15, ${F_TotalWIP})>0, ('2. Global & Gemba Data'!D3*12)/SUM('2. Global & Gemba Data'!A15, '2. Global & Gemba Data'!B15, '2. Global & Gemba Data'!C15, ${F_TotalWIP}), "∞")`,
                        gemba_supp_lt: `'2. Global & Gemba Data'!B7`,
                        gemba_supp_freq: `'2. Global & Gemba Data'!C7`,
                        gemba_supp_otd: `'2. Global & Gemba Data'!E7 / 100`,
                        gemba_supp_defects: `'2. Global & Gemba Data'!F7 / 100`,
                        gemba_cust_vol: `'2. Global & Gemba Data'!D3`,
                        gemba_cust_var: `'2. Global & Gemba Data'!B11 / 100`,
                        gemba_cust_sl: `'2. Global & Gemba Data'!D11 / 100`
                    };

                    const Fmt = {
                        takt: `#,##0.00 "${unitLabel}"`, ct: `#,##0.00 "${unitLabel}"`, lt: `#,##0.00 "Days"`,
                        work_content: `#,##0.00 "${unitLabel}"`, waiting: `#,##0.00 "${unitLabel}"`, co_time: `#,##0.00 "${unitLabel}"`,
                        smed_ratio: '0.00%', utilization: '0.00%', balancing: '0.00%', workforce: `#,##0.0 "Heads"`,
                        wip: `#,##0 "Units"`, littles_law: `#,##0 "Units"`, inv_turns: `#,##0.0 "Turns/Yr"`,
                        flow_eff: '0.00%', fpy: '0.00%', rty: '0.00%', total_defects: `#,##0 "Units"`, dpmu: `#,##0`,
                        scrap_rate: '0.00%', va_cost: `"₹"#,##0.00`, nva_cost: `"₹"#,##0.00`, scrap_cost: `"₹"#,##0.00`,
                        blocked_cap: `"₹"#,##0.00`, epei: `#,##0.00 "Hrs"`, kanban: `#,##0 "Bins"`, pitch: `#,##0.0 "Mins"`,
                        cov: `0.00`, service_lvl: '0.00%', oee: '0.00%', availability: '0.00%', performance: '0.00%',
                        quality_oee: '0.00%', c2c: `#,##0.0 "Days"`, dock2dock: `#,##0.0 "Days"`, std_time: `#,##0.00 "${unitLabel}"`,
                        ops_util: '0.00%', handoff: `#,##0.00 "${unitLabel}"`, gemba_manual: `#,##0.00 "${unitLabel}"`,
                        gemba_machine: `#,##0.00 "${unitLabel}"`, gemba_rework: '0.00%', gemba_batch: `#,##0 "Units"`,
                        gemba_labor_util: '0.00%', gemba_inv_safety: `#,##0 "Units"`, gemba_inv_fg: `#,##0 "Units"`,
                        gemba_inv_rm: `#,##0 "Units"`, gemba_inv_total_turns: `#,##0.0 "Turns"`, gemba_supp_lt: `#,##0 "Days"`,
                        gemba_supp_freq: `#,##0 " / Wk"`, gemba_supp_otd: '0.00%', gemba_supp_defects: '0.00%',
                        gemba_cust_vol: `#,##0 "Units"`, gemba_cust_var: '0.00%', gemba_cust_sl: '0.00%'
                    };

                    const kpiRows = [
                        { name: "Total Lead Time", id: 'lt', res: results.raw_lt },
                        { name: "Process Cycle Efficiency", id: 'flow_eff', res: results.raw_pce/100 },
                        { name: "Total Labor Content", id: 'work_content', res: results.raw_labor }, 
                        { name: "Rolled Throughput Yield", id: 'rty', res: results.raw_rty/100 },
                        { name: "System Efficiency (OEE)", id: 'oee', res: results.raw_oee/100 }
                    ];
                    
                    kpiRows.forEach(item => {
                        const row = wsSum.addRow(['', '']);
                        row.getCell(1).value = item.name;
                        row.getCell(2).value = { formula: excelFormulas[item.id] || F_TotalLabor, result: item.res };
                        if (item.id === 'work_content') row.getCell(2).numFmt = `#,##0.00 "${unitLabel}s"`;
                        else if (Fmt[item.id]) row.getCell(2).numFmt = Fmt[item.id];

                        row.getCell(1).font = { bold: true, color: { argb: 'FF92400E' } };
                        row.getCell(2).font = { bold: true, size: 12, color: { argb: 'FFB45309' } };
                        row.getCell(2).alignment = { horizontal: 'center' };
                        row.eachCell(c => {
                            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFBEB' } };
                            c.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
                        });
                    });

                    const wsData = workbook.addWorksheet('2. Global & Gemba Data');
                    wsData.columns = [{ width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }];
                    
                    addSectionHeader(wsData, 'GLOBAL INPUT PARAMETERS (Flow & Financials)', 'FF1E3A8A', 12);
                    let hr = wsData.addRow(['Shifts', 'Hours/Shift', 'Breaks (m)', 'Demand/Mo', 'Days/Mo', 'Labor Rate/Hr', 'Unit Cost', 'Bin Size', 'Days A/R', 'Days A/P', 'Setup Mins', 'CT Std Dev']);
                    styleTableRow(hr, true, 'FF3B82F6');
                    
                    let dr = wsData.addRow([
                        parseSimpleNum(globals.shifts), parseSimpleNum(globals.hoursPerShift), parseSimpleNum(globals.breaks), 
                        parseSimpleNum(globals.demand), parseSimpleNum(globals.days), parseSimpleNum(globals.laborRate), 
                        parseSimpleNum(globals.unitCost), parseSimpleNum(globals.containerSize), parseSimpleNum(globals.daysAR), 
                        parseSimpleNum(globals.daysAP), 
                        parseSimpleNum(globals.setupMins !== "" ? parseFloat(globals.setupMins) * sm.setup : ""), 
                        parseSimpleNum(globals.ctStdDev)
                    ]);
                    styleTableRow(dr, false, 'FFEFF6FF');
                    wsData.addRow([]);

                    addSectionHeader(wsData, 'GEMBA SUPPLIER DATA', 'FF064E3B', 6);
                    hr = wsData.addRow(['Supplier Name', 'Supp Lead Time', 'Supp Freq', 'Supp Lot Size', 'OTD %', 'Defect Rate %']);
                    styleTableRow(hr, true, 'FF10B981');
                    dr = wsData.addRow([globals.suppName, parseSimpleNum(globals.suppLT), parseSimpleNum(globals.suppFreq), parseSimpleNum(globals.suppLot), parseSimpleNum(globals.suppOTD), parseSimpleNum(globals.suppDefect)]);
                    styleTableRow(dr, false, 'FFF0FDF4');
                    wsData.addRow([]);

                    addSectionHeader(wsData, 'GEMBA CUSTOMER DATA', 'FF064E3B', 4);
                    hr = wsData.addRow(['Customer Name', 'Cust Variation %', 'Cust Order Freq', 'Service Level %']);
                    styleTableRow(hr, true, 'FF10B981');
                    dr = wsData.addRow([globals.custName, parseSimpleNum(globals.custVariation), parseSimpleNum(globals.custFreq), parseSimpleNum(globals.custSL)]);
                    styleTableRow(dr, false, 'FFF0FDF4');
                    wsData.addRow([]);

                    addSectionHeader(wsData, 'FACILITY INVENTORY', 'FF064E3B', 3);
                    hr = wsData.addRow(['Safety Stock', 'FG Inventory', 'RM Inventory']);
                    styleTableRow(hr, true, 'FF10B981');
                    dr = wsData.addRow([parseSimpleNum(globals.invSafety), parseSimpleNum(globals.invFG), parseSimpleNum(globals.invRM)]);
                    styleTableRow(dr, false, 'FFF0FDF4');
                    wsData.addRow([]);

                    const wsFlow = workbook.addWorksheet('3. Value Process Flow');
                    wsFlow.columns = [
                        { width: 25 }, { width: 12 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, 
                        { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }
                    ];
                    addSectionHeader(wsFlow, 'VALUE PROCESS FLOW', 'FF0F172A', 11);
                    hr = wsFlow.addRow(["Step Name", "WIP", `C/T (${unitLabel})`, "Uptime %", "Yield %", "Defects", "Operators", `Manual Time`, `Machine Time`, "Batch Size", "Rework %"]);
                    styleTableRow(hr, true, 'FF334155');

                    processes.forEach(p => {
                        const ct = p.ct !== "" ? parseFloat(p.ct) * sm.ct : "";
                        const up = p.up !== "" ? Math.min(100, parseFloat(p.up) * sm.up) : "";
                        const yld = p.yield !== "" ? Math.min(100, parseFloat(p.yield) * sm.yld) : "";
                        const rew = p.rework !== "" ? parseFloat(p.rework) * sm.rew : "";
                        const def = (yld !== "" && globals.demand !== "") ? Math.max(0, globals.demand * (100 - yld) / 100) : "";

                        const row = wsFlow.addRow([p.name, parseSimpleNum(p.wip), parseSimpleNum(ct), parseSimpleNum(up), parseSimpleNum(yld), parseSimpleNum(def), parseSimpleNum(p.ops), parseSimpleNum(p.manualCt), parseSimpleNum(p.machineCt), parseSimpleNum(p.batchSize), parseSimpleNum(rew)]);
                        styleTableRow(row, false, 'FFF8FAFC');
                        row.getCell(1).font = { bold: true };
                        row.getCell(1).alignment = { horizontal: 'left' };
                    });

                    const wsMet = workbook.addWorksheet('4. Calculated Metrics');
                    wsMet.columns = [{ width: 25 }, { width: 45 }, { width: 90 }, { width: 25 }];
                    
                    addSectionHeader(wsMet, 'ALL CALCULATED METRICS & FORMULAS', 'FF475569', 4);
                    hr = wsMet.addRow(['Metric Name', 'Math Formula Used', 'Description', 'Calculated Result']);
                    styleTableRow(hr, true, 'FF0F172A');
                    
                    Object.values(metricLibrary).forEach(category => {
                        const catRow = wsMet.addRow([category.title.toUpperCase()]);
                        wsMet.mergeCells(catRow.number, 1, catRow.number, 4);
                        catRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2E8F0' } };
                        catRow.getCell(1).font = { bold: true, color: { argb: 'FF0F172A' }, size: 12 };
                        catRow.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                        
                        category.metrics.forEach(m => {
                            const mRow = wsMet.addRow(['', '', '', '']);
                            mRow.getCell(1).value = m.name;
                            mRow.getCell(3).value = m.description;
                            
                            const fStr = excelFormulas[m.id];
                            if (fStr) {
                                mRow.getCell(2).value = '=' + fStr; 
                                let rValue = parseFloat(String(results[m.id] || '').replace(/[^0-9.-]/g, ''));
                                if (Fmt[m.id] && Fmt[m.id].includes('%')) rValue = rValue / 100;
                                mRow.getCell(4).value = { formula: fStr, result: isNaN(rValue) ? 0 : rValue };
                            } else {
                                mRow.getCell(2).value = "Static Output Value";
                                const rawRes = String(results[m.id] || '');
                                const numExtract = rawRes.replace(/[^0-9.-]/g, '');
                                let num = parseFloat(numExtract);
                                mRow.getCell(4).value = isNaN(num) ? rawRes : num;
                            }
                            
                            if (Fmt[m.id]) mRow.getCell(4).numFmt = Fmt[m.id];

                            mRow.getCell(1).font = { bold: true, color: { argb: 'FF1E293B' }, size: 11 };
                            mRow.getCell(2).font = { color: { argb: 'FF0284C7' }, italic: true, size: 11 };
                            mRow.getCell(3).font = { color: { argb: 'FF475569' }, size: 10 };
                            mRow.getCell(4).font = { bold: true, color: { argb: 'FF0F172A' }, size: 12 };
                            
                            mRow.getCell(1).alignment = { vertical: 'middle', horizontal: 'right', wrapText: true };
                            mRow.getCell(2).alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                            mRow.getCell(3).alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                            mRow.getCell(4).alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                            
                            mRow.getCell(4).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
                            mRow.eachCell(c => { c.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } } });

                            const maxLen = Math.max(m.description.length / 60, (fStr || "").length / 35);
                            mRow.height = Math.max(35, Math.ceil(maxLen) * 18);
                        });
                    });

                    const wsCapa = workbook.addWorksheet('5. CAPA Tracker');
                    wsCapa.columns = [{width: 40}, {width: 40}, {width: 40}, {width: 20}, {width: 20}, {width: 15}];
                    addSectionHeader(wsCapa, 'CORRECTIVE & PREVENTIVE ACTION (CAPA) LOG', 'FF991B1B', 6);
                    hr = wsCapa.addRow(['Problem / Defect', 'Root Cause', 'Action Plan', 'Owner', 'Deadline', 'Status']);
                    styleTableRow(hr, true, 'FFDC2626');
                    capaItems.forEach(c => {
                        const row = wsCapa.addRow([c.problem, c.rootCause, c.action, c.owner, c.deadline, c.status]);
                        styleTableRow(row, false, 'FFFEF2F2');
                        row.getCell(6).font = { bold: true, color: { argb: c.status === 'Closed' ? 'FF059669' : c.status === 'WIP' ? 'FFD97706' : 'FFDC2626' } };
                        row.alignment = { wrapText: true, vertical: 'middle', horizontal: 'left' };
                    });

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `MECTS_Training_Report_${new Date().getTime()}.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setPrintMessage("Multi-Tab Formula Excel Report Exported Successfully!");
                    setTimeout(() => setPrintMessage(""), 4000);
                } catch (error) {
                    console.error(error);
                    setPrintMessage("Error generating Excel. Check console.");
                    setTimeout(() => setPrintMessage(""), 4000);
                }
            };

            const handleExportPDF = async () => {
                if (!window.jspdf || !window.html2canvas) {
                    setPrintMessage("PDF libraries loading. Please wait.");
                    setTimeout(() => setPrintMessage(""), 4000);
                    return;
                }
                
                setIsGeneratingPDF(true);
                setPrintMessage("Structuring Master Class PDF...");
                
                try {
                    await new Promise(resolve => setTimeout(resolve, 800));
                    
                    const element = document.getElementById('pdf-content');
                    
                    const captureWidth = 1400;
                    element.style.width = `${captureWidth}px`;
                    element.style.maxWidth = `${captureWidth}px`;
                    element.style.margin = '0 auto';
                    
                    const canvas = await window.html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        windowWidth: captureWidth + 40,
                        backgroundColor: '#ffffff'
                    });
                    
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const margin = 10;
                    const contentWidth = pdfWidth - (margin * 2);
                    
                    const imgHeightInMm = (canvas.height * contentWidth) / canvas.width;
                    
                    let heightLeft = imgHeightInMm;
                    let position = margin;

                    pdf.addImage(imgData, 'JPEG', margin, position, contentWidth, imgHeightInMm);
                    heightLeft -= (pdfHeight - margin);

                    while (heightLeft > 0) {
                        position = position - pdfHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', margin, position, contentWidth, imgHeightInMm);
                        heightLeft -= pdfHeight;
                    }

                    pdf.save(`MECTS_System_Audit_${Date.now()}.pdf`);
                    
                    element.style.width = '';
                    element.style.maxWidth = '';
                    element.style.margin = '';
                    
                    setIsGeneratingPDF(false);
                    setPrintMessage("PDF Downloaded Successfully!");
                    setTimeout(() => setPrintMessage(""), 3000);
                    
                } catch (error) {
                    console.error(error);
                    setIsGeneratingPDF(false);
                    setPrintMessage("PDF Generation Failed.");
                    setTimeout(() => setPrintMessage(""), 3000);
                }
            };

            const activeMetric = metricLibrary[activeCategory]?.metrics.find(m => m.id === activeMetricId) || metricLibrary['basic_flow'].metrics[0];

            useEffect(() => {
                if (showCapaModal || showMectopedia) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; };
            }, [showCapaModal, showMectopedia]);

            return (
                <div className={`min-h-screen relative overflow-hidden ${isGeneratingPDF ? 'bg-white' : 'bg-slate-50'}`}>
                    
                    {/* INPUT ERROR TOASTS */}
                    <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[150] space-y-2 pointer-events-none no-print flex flex-col items-center">
                        {inputErrors.map(e => (
                            <div key={e.id} className="fade-in bg-red-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold tracking-wide text-sm pointer-events-auto shadow-red-900/30 flex items-center gap-2">
                                <AlertTriangle size={18} /> {e.msg}
                            </div>
                        ))}
                    </div>

                    {/* MECTOPEDIA MODAL OVERLAY */}
                    {showMectopedia && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex justify-end no-print" onClick={() => setShowMectopedia(false)}>
                            <div className="slide-in bg-white w-full md:w-[450px] h-full shadow-2xl flex flex-col border-l border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className="p-6 bg-slate-900 text-white flex justify-between items-center shrink-0">
                                    <div className="flex items-center gap-3">
                                        <BookOpen size={24} className="text-emerald-400" />
                                        <h2 className="text-lg font-black tracking-widest uppercase">Mectopedia</h2>
                                    </div>
                                    <button onClick={() => setShowMectopedia(false)} className="text-slate-400 hover:text-white transition-colors"><X size={24}/></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-8 pb-24 bg-slate-50 flex-1">
                                    <p className="text-sm font-medium text-slate-500 italic border-l-4 border-emerald-400 pl-3">Your ultimate glossary for Industrial Execution & Lean Six Sigma Terminology.</p>
                                    {dynamicMectopedia.map((item, idx) => (
                                        <div key={idx} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="font-black text-indigo-700 text-base mb-2 uppercase tracking-wide">{item.term}</h3>
                                            <p className="text-sm text-slate-700 mb-4 font-medium leading-relaxed">{item.def}</p>
                                            <div className="mb-4 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">
                                                <span className="font-black text-emerald-400 text-[10px] uppercase tracking-widest block mb-1 flex items-center gap-1"><Calculator size={12}/> Formula</span>
                                                <span className="text-blue-300 font-mono font-bold tracking-tight mb-2 block">{item.formula}</span>
                                                <div className="border-t border-slate-700 pt-2 mt-2 flex justify-between items-center">
                                                    <span className="text-slate-400 text-[10px] uppercase">Live Result:</span>
                                                    <span className="text-white font-black text-lg">{item.live}</span>
                                                </div>
                                            </div>
                                            <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-3 text-sm">
                                                <span className="font-black text-indigo-800 text-[10px] uppercase tracking-widest block mb-1">Analogy</span>
                                                <span className="text-indigo-900 italic font-medium">{item.analogy}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CAPA MODAL OVERLAY */}
                    {(showCapaModal || isGeneratingPDF) && (
                        <div className={isGeneratingPDF ? "pt-8 page-break-avoid w-full" : "fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm overflow-y-auto no-print"} onClick={() => !isGeneratingPDF && setShowCapaModal(false)}>
                            <div className={isGeneratingPDF ? "" : "min-h-screen px-4 text-center"}>
                                {/* This element is to trick the browser into centering the modal contents. */}
                                {!isGeneratingPDF && <span className="inline-block h-screen align-middle" aria-hidden="true">&#8203;</span>}
                                
                                <div className={`inline-block w-full max-w-[1400px] text-left align-middle bg-slate-50 transition-all ${isGeneratingPDF ? '' : 'my-8 rounded-2xl shadow-2xl overflow-hidden'}`} onClick={e => e.stopPropagation()}>
                                    <div className={`p-6 text-white flex justify-between items-center shrink-0 ${isGeneratingPDF ? 'bg-slate-800 rounded-t-xl' : 'bg-slate-900'}`}>
                                        <div className="flex items-center gap-3">
                                            <CheckSquare size={24} className="text-emerald-400" />
                                            <h2 className="text-xl font-black tracking-widest uppercase">System Diagnostics & CAPA Log</h2>
                                        </div>
                                        {!isGeneratingPDF && <button onClick={() => setShowCapaModal(false)} className="text-slate-400 hover:text-white transition-colors"><X size={24}/></button>}
                                    </div>
                                    <div className={`p-6 md:p-8 ${isGeneratingPDF ? 'border-l border-r border-b border-slate-200 rounded-b-xl' : ''}`}>
                                        
                                        {/* AI Dynamic Recommendations */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2 mb-4 border-b-2 border-slate-200 pb-2">
                                                <Activity size={18} className="text-indigo-600"/> Executive Action Plan
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {dynamicRecommendations.map((rec, i) => (
                                                    <div key={i} className="bg-white border-l-4 border-indigo-500 p-4 rounded-r-xl shadow-sm">
                                                        <span className="text-[10px] font-black text-indigo-500 uppercase tracking-widest block mb-1">{rec.type}</span>
                                                        <p className="text-sm font-medium text-slate-700 leading-relaxed">{rec.text}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* CAPA Table */}
                                        <div>
                                            <div className="flex justify-between items-center border-b-2 border-slate-200 pb-2 mb-4">
                                                <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2">
                                                    <AlertTriangle size={18} className="text-amber-600"/> Corrective Action Log
                                                </h3>
                                                {!isGeneratingPDF && (
                                                    <button onClick={() => setCapaItems([...capaItems, { id: Date.now(), problem: "", rootCause: "", action: "", owner: "", deadline: "", status: "Open" }])}
                                                            className="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors flex items-center gap-1">
                                                        <PlusCircle size={14}/> ADD ACTION
                                                    </button>
                                                )}
                                            </div>

                                            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                                <table className="w-full text-left text-sm text-slate-600">
                                                    <thead className="bg-slate-100 border-b border-slate-200 text-xs uppercase font-black text-slate-500">
                                                        <tr>
                                                            <th className="p-4">Problem / Defect</th>
                                                            <th className="p-4">Root Cause</th>
                                                            <th className="p-4">Action Plan</th>
                                                            <th className="p-4 w-32">Owner</th>
                                                            <th className="p-4 w-32">Deadline</th>
                                                            <th className="p-4 w-24">Status</th>
                                                            {!isGeneratingPDF && <th className="p-4 w-12"></th>}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {capaItems.map((c, i) => (
                                                            <tr key={c.id} className="hover:bg-slate-50/50 transition-colors">
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? <div className="font-medium text-slate-800">{c.problem}</div> : 
                                                                    <textarea className="w-full bg-transparent outline-none resize-none font-medium text-slate-800 focus:bg-white focus:ring-1 ring-slate-200 rounded p-1" rows="2" value={c.problem} onChange={(e)=>{const n=[...capaItems]; n[i].problem=e.target.value; setCapaItems(n)}} placeholder="Describe issue..."/>}
                                                                </td>
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? <div>{c.rootCause}</div> : 
                                                                    <textarea className="w-full bg-transparent outline-none resize-none focus:bg-white focus:ring-1 ring-slate-200 rounded p-1" rows="2" value={c.rootCause} onChange={(e)=>{const n=[...capaItems]; n[i].rootCause=e.target.value; setCapaItems(n)}} placeholder="Why did it happen?"/>}
                                                                </td>
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? <div>{c.action}</div> : 
                                                                    <textarea className="w-full bg-transparent outline-none resize-none focus:bg-white focus:ring-1 ring-slate-200 rounded p-1" rows="2" value={c.action} onChange={(e)=>{const n=[...capaItems]; n[i].action=e.target.value; setCapaItems(n)}} placeholder="Steps to resolve..."/>}
                                                                </td>
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? <div className="font-semibold text-slate-800">{c.owner}</div> : 
                                                                    <input type="text" className="w-full bg-transparent outline-none font-semibold text-slate-800 focus:bg-white focus:ring-1 ring-slate-200 rounded p-1" value={c.owner} onChange={(e)=>{const n=[...capaItems]; n[i].owner=e.target.value; setCapaItems(n)}} placeholder="Name"/>}
                                                                </td>
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? <div className="font-mono text-xs">{c.deadline}</div> : 
                                                                    <input type="date" className="w-full bg-transparent outline-none text-sm focus:bg-white focus:ring-1 ring-slate-200 rounded p-1" value={c.deadline} onChange={(e)=>{const n=[...capaItems]; n[i].deadline=e.target.value; setCapaItems(n)}}/>}
                                                                </td>
                                                                <td className="p-3">
                                                                    {isGeneratingPDF ? (
                                                                        <span className={`px-2 py-1 rounded text-xs font-bold ${c.status==='Closed'?'bg-emerald-100 text-emerald-800':c.status==='WIP'?'bg-amber-100 text-amber-800':'bg-red-100 text-red-800'}`}>{c.status}</span>
                                                                    ) : (
                                                                        <select className={`w-full bg-transparent outline-none font-bold text-xs p-1 rounded ${c.status==='Closed'?'text-emerald-600':c.status==='WIP'?'text-amber-600':'text-red-600'}`} value={c.status} onChange={(e)=>{const n=[...capaItems]; n[i].status=e.target.value; setCapaItems(n)}}>
                                                                            <option value="Open">Open</option>
                                                                            <option value="WIP">WIP</option>
                                                                            <option value="Closed">Closed</option>
                                                                        </select>
                                                                    )}
                                                                </td>
                                                                {!isGeneratingPDF && (
                                                                    <td className="p-3 text-right">
                                                                        <button onClick={() => setCapaItems(capaItems.filter(item => item.id !== c.id))} className="text-slate-400 hover:text-red-500"><Trash2 size={16}/></button>
                                                                    </td>
                                                                )}
                                                            </tr>
                                                        ))}
                                                        {capaItems.length === 0 && (
                                                            <tr><td colSpan="7" className="p-6 text-center text-slate-400 font-bold">No CAPA items registered.</td></tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* COMMAND HEADER */}
                    <header className={`bg-slate-900 text-white border-b-4 border-emerald-500 sticky top-0 z-50 ${isGeneratingPDF ? 'no-print' : 'shadow-xl'}`}>
                        <div className="max-w-[1450px] mx-auto px-6 py-4 flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-black italic tracking-tighter text-emerald-400">MECTS SET...GO</h1>
                                <p className="text-xs font-bold tracking-widest text-slate-300 uppercase mt-1">GEMBA Execution & Analytics Framework</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={handleClearAll} className="bg-red-600 text-white px-5 py-2.5 rounded-lg text-xs font-black flex items-center gap-2 hover:bg-red-500 transition-colors shadow-lg shadow-red-900/50">
                                    <RefreshCw size={16}/> CLEAR ALL
                                </button>
                                <button onClick={handleOpenCapa} className="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-xs font-black flex items-center gap-2 hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-900/50">
                                    <CheckSquare size={16}/> CAPA REPORT
                                </button>
                                <button onClick={() => setShowMectopedia(true)} className="bg-slate-700 text-white px-5 py-2.5 rounded-lg text-xs font-black flex items-center gap-2 hover:bg-slate-600 transition-colors border border-slate-600 hidden md:flex">
                                    <BookOpen size={16}/> MECTOPEDIA
                                </button>
                                <button onClick={handleExportPDF} className="bg-emerald-600 text-white px-5 py-2.5 rounded-lg text-xs font-black flex items-center gap-2 hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-900/50 hidden md:flex">
                                    <Printer size={16}/> PDF
                                </button>
                                <button onClick={handleExportExcel} className="bg-slate-700 text-white px-5 py-2.5 rounded-lg text-xs font-black flex items-center gap-2 hover:bg-slate-600 transition-colors border border-slate-600 hidden md:flex">
                                    <Download size={16}/> EXCEL
                                </button>
                            </div>
                        </div>
                    </header>

                    {printMessage && !isGeneratingPDF && (
                        <div className="bg-emerald-100 border-b border-emerald-300 text-emerald-900 px-6 py-2 text-center text-xs font-bold flex justify-center items-center gap-2">
                            <Info size={14} /> {printMessage}
                            <button onClick={() => setPrintMessage("")} className="ml-4 text-emerald-600 hover:text-emerald-900"><X size={14}/></button>
                        </div>
                    )}

                    {/* MAIN WRAPPER FOR PDF CAPTURE */}
                    <div id="pdf-content" className={`max-w-[1450px] mx-auto p-6 space-y-8 ${isGeneratingPDF ? 'pdf-mode' : ''}`}>
                        
                        {/* PDF PRINT HEADER */}
                        {isGeneratingPDF && (
                            <div className="pb-6 border-b-4 border-slate-900 mb-8 page-break-avoid">
                                <h1 className="text-4xl font-black tracking-tighter text-slate-900">MECTS SET...GO</h1>
                                <p className="text-sm font-bold tracking-widest text-slate-500 uppercase mt-1">Industrial Execution & GEMBA Diagnostics Report</p>
                                <div className="mt-4 flex gap-6 text-sm font-bold text-slate-800 bg-slate-100 p-3 rounded-lg border border-slate-200">
                                    <div>Segment: <span className="text-emerald-600">{selectedIndustry}</span></div>
                                    <div>Scenario: <span className="text-emerald-600">{scenario}</span></div>
                                    <div>Time Unit: <span className="text-emerald-600">{timeUnit}</span></div>
                                    <div>Generated: <span className="text-emerald-600">{new Date().toLocaleDateString()}</span></div>
                                </div>
                            </div>
                        )}

                        {/* SECTION 1: CONFIGURATION */}
                        <section className="space-y-4 page-break-avoid">
                            <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2 border-b-2 border-slate-200 pb-2">
                                <Calculator size={18} className="text-emerald-600"/> 1. Global Parameters & Settings
                            </h2>
                            
                            {!isGeneratingPDF && (
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                                        <Globe size={20} className="text-slate-400"/>
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Industry Segment</label>
                                            <select className="w-full font-bold outline-none text-sm" value={selectedIndustry} onChange={(e) => {
                                                const val = e.target.value;
                                                setSelectedIndustry(val);
                                                setGlobals(getPresetData(val).globals);
                                                const m = timeUnit==='Minutes'?1/60:1;
                                                setProcesses(getPresetData(val).processes.map(p=>({...p, ct:p.ct?p.ct*m:"", manualCt:p.manualCt?p.manualCt*m:"", machineCt:p.machineCt?p.machineCt*m:""})));
                                            }}>
                                                {Object.keys(industryPresets).map(k => <option key={k} value={k}>{k}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                                        <Sliders size={20} className={scenario === 'Catastrophic' ? 'text-red-500' : scenario === 'Best Case' ? 'text-emerald-500' : 'text-slate-400'}/>
                                        <div className="flex-1">
