                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Simulation Scenario</label>
                                            <select 
                                                className={`w-full font-bold outline-none text-sm ${scenario === 'Catastrophic' ? 'text-red-600' : scenario === 'Best Case' ? 'text-emerald-600' : 'text-indigo-700'}`} 
                                                value={scenario} 
                                                onChange={(e) => {
                                                    setScenario(e.target.value);
                                                }}
                                            >
                                                <option value="Baseline">Baseline (As-Is)</option>
                                                <option value="Best Case">Best Case (Optimized)</option>
                                                <option value="Catastrophic">Catastrophic (Worst Case)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                                        <Layers size={20} className="text-slate-400"/>
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Metric Category Group</label>
                                            <select className="w-full font-bold outline-none text-sm" value={activeCategory} onChange={(e) => setActiveCategory(e.target.value)}>
                                                {Object.entries(metricLibrary).map(([key, cat]) => (
                                                    <option key={key} value={key}>{cat.title}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                                        <Clock size={20} className="text-slate-400"/>
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Base Time Unit</label>
                                            <select className="w-full font-bold outline-none text-sm" value={timeUnit} onChange={handleTimeUnitChange}>
                                                <option value="Seconds">Seconds (Sec)</option>
                                                <option value="Minutes">Minutes (Min)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* INTERACTIVE METRIC EXPLORER (BLACK BOX) */}
                            <div className="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-sm page-break-avoid mb-6 relative">
                                {scenario !== 'Baseline' && (
                                    <div className={`absolute top-0 left-1/2 -translate-x-1/2 text-white text-[10px] font-black px-4 py-1 rounded-b-lg tracking-widest z-20 ${scenario === 'Catastrophic' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                                        {scenario.toUpperCase()} SIMULATION ACTIVE
                                    </div>
                                )}
                                <div className="bg-slate-100 px-6 py-4 flex justify-between items-center border-b border-slate-200">
                                    <div className="flex items-center gap-4 flex-1">
                                        <div className="bg-slate-900 text-emerald-400 p-2 rounded-lg"><Calculator size={20}/></div>
                                        <div className="relative w-full max-w-sm">
                                            {!isGeneratingPDF ? (
                                                <Fragment>
                                                    <select 
                                                        value={activeMetricId}
                                                        onChange={(e) => setActiveMetricId(e.target.value)}
                                                        className="w-full bg-transparent text-xl font-black focus:outline-none cursor-pointer border-b-2 border-dashed border-slate-300 hover:border-slate-800 transition-colors appearance-none pr-8 relative z-10 text-slate-800"
                                                    >
                                                        {metricLibrary[activeCategory]?.metrics.map(m => (
                                                            <option key={m.id} value={m.id}>{m.name}</option>
                                                        ))}
                                                    </select>
                                                    <ChevronDown className="absolute right-0 top-1/2 -translate-y-1/2 text-slate-800 pointer-events-none z-0" size={20} />
                                                </Fragment>
                                            ) : (
                                                <div className="text-xl font-black text-slate-800">{activeMetric?.name}</div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="text-right shrink-0 ml-4">
                                        <div className="text-[10px] font-black text-slate-500 uppercase">TARGET</div>
                                        <div className="text-sm font-bold text-slate-800">{activeMetric?.target}</div>
                                    </div>
                                </div>
                                <div className="p-6 md:p-10 bg-slate-900 text-white flex flex-col lg:flex-row justify-between items-start gap-8 border-b-8 border-emerald-500">
                                    <div className="space-y-6 flex-1 w-full text-left">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl text-left flex flex-col justify-center">
                                                <span className="text-xs font-black text-emerald-400 uppercase tracking-widest block mb-2 flex items-center gap-2">
                                                    <Calculator size={14}/> Industrial Formula
                                                </span>
                                                <div className="text-lg md:text-xl font-mono font-bold break-words text-blue-300 tracking-tight leading-relaxed">{activeMetric?.formula}</div>
                                            </div>
                                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl flex items-start gap-4 text-left">
                                                <Info size={24} className="text-indigo-400 shrink-0 mt-1" />
                                                <div>
                                                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">Metric Description</span>
                                                    <div className="text-sm font-medium text-slate-300 leading-relaxed space-y-2">
                                                        {activeMetric?.description.split('. ').map((sentence, i) => (
                                                            sentence ? <p key={i}>{sentence.trim() + (sentence.endsWith('.') ? '' : '.')}</p> : null
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="shrink-0 bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full lg:w-auto text-left lg:text-right self-stretch flex flex-col justify-center">
                                        <span className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-3">Calculated Result</span>
                                        <div className="text-5xl font-black text-emerald-400">
                                            {results[activeMetricId] || '0'}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className={`bg-white rounded-xl border border-slate-200 p-5 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 ${isGeneratingPDF ? '' : 'shadow-sm'}`}>
                                {[
                                    { label: "Shifts", key: "shifts", tip: "Shifts scheduled per day." },
                                    { label: "Hrs/Shift", key: "hoursPerShift", tip: "Duration of a single shift." },
                                    { label: "Breaks (m)", key: "breaks", tip: "Break/meal time per shift." },
                                    { label: "Demand/Mo", key: "demand", tip: "Order quantity required per month." },
                                    { label: "Days/Mo", key: "days", tip: "Active working days in a month." },
                                    { label: "Labor Rate", key: "laborRate", tip: "Hourly cost per operator." },
                                    { label: "Unit Cost", key: "unitCost", tip: "Manufactured cost per unit." },
                                    { label: "Kanban Bin", key: "containerSize", tip: "Standard quantity per bin." },
                                    { label: "Days A/R", key: "daysAR", tip: "Average Days Accounts Receivable." },
                                    { label: "Days A/P", key: "daysAP", tip: "Average Days Accounts Payable." },
                                    { label: "Setup Mins", key: "setupMins", tip: "Total changeover and line setup time." },
                                    { label: "CT Std Dev", key: "ctStdDev", tip: "Cycle Time Standard Deviation." }
                                ].map(f => (
                                    <div key={f.key}>
                                        <TooltipLabel label={f.label} tooltip={f.tip} isPdf={isGeneratingPDF} />
                                        {isGeneratingPDF ? <div className="font-black text-slate-800 pt-1">{globals[f.key]||'-'}</div> :
                                        <input type="text" inputMode="decimal" className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 font-bold text-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm" value={globals[f.key]} onChange={(e) => { if(validateNumeric(e.target.value, f.label)) setGlobals({...globals, [f.key]: e.target.value}); }} />}
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* SECTION 2: GEMBA MATRIX */}
                        <section className="space-y-4">
                            <div className="flex justify-between items-center border-b-2 border-slate-200 pb-2 page-break-avoid">
                                <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2">
                                    <Target size={18} className="text-emerald-600"/> 2. Value Process Flow Matrix
                                </h2>
                                {!isGeneratingPDF && (
                                    <button onClick={() => setProcesses([...processes, { name: "Step "+(processes.length+1), wip: "", ct: "", up: "", yield: "", defects: "", ops: "", manualCt:"", machineCt:"", batchSize:"", rework:"" }])}
                                            className="text-xs font-bold bg-slate-900 text-white px-3 py-1.5 rounded hover:bg-emerald-600 transition-colors">
                                        + ADD PROCESS
                                    </button>
                                )}
                            </div>

                            <div className={isGeneratingPDF ? 'grid grid-cols-3 gap-6 pb-4' : 'flex gap-4 overflow-x-auto scrollbar-hide pb-4'}>
                                {processes.map((p, i) => (
                                    <div key={i} className={`bg-white rounded-xl border border-slate-200 overflow-hidden page-break-avoid ${isGeneratingPDF ? 'shadow-sm' : 'flex-shrink-0 w-80 shadow-sm hover:shadow-md transition-shadow'}`}>
                                        <div className="bg-slate-800 p-3 flex justify-between items-center border-b-4 border-emerald-500">
                                            {isGeneratingPDF ? <div className="font-black text-white uppercase text-sm truncate">{p.name||'Step'}</div> :
                                            <input type="text" className="bg-transparent text-white font-black uppercase text-sm w-full outline-none" value={p.name} onChange={(e) => { const n = [...processes]; n[i] = {...n[i], name: e.target.value}; setProcesses(n); }} placeholder="PROCESS NAME" />}
                                            {!isGeneratingPDF && <button onClick={() => setProcesses(processes.filter((_, idx) => idx !== i))} className="text-slate-400 hover:text-red-400"><Trash2 size={14}/></button>}
                                        </div>
                                        <div className="p-4 grid grid-cols-2 gap-x-4 gap-y-3 bg-slate-50 text-sm">
                                            <div><TooltipLabel label="WIP Qty" tooltip="Work in Process" isPdf={isGeneratingPDF}/> {isGeneratingPDF ? <div className="font-bold text-slate-800">{p.wip||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.wip} onChange={(e)=>{if(validateNumeric(e.target.value, "WIP")) {const n=[...processes]; n[i] = {...n[i], wip: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Operators" tooltip="Staff assigned" isPdf={isGeneratingPDF}/> {isGeneratingPDF ? <div className="font-bold text-slate-800">{p.ops||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.ops} onChange={(e)=>{if(validateNumeric(e.target.value, "Operators")) {const n=[...processes]; n[i] = {...n[i], ops: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label={`C/T (${unitLabel})`} tooltip="Cycle Time" isPdf={isGeneratingPDF}/> {isGeneratingPDF ? <div className="font-bold text-slate-800">{p.ct||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.ct} onChange={(e)=>{if(validateNumeric(e.target.value, "Cycle Time")) {const n=[...processes]; n[i] = {...n[i], ct: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Uptime %" tooltip="Machine Uptime" isPdf={isGeneratingPDF} colorClass="text-indigo-600"/> {isGeneratingPDF ? <div className="font-bold text-indigo-700">{p.up||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-indigo-200 bg-transparent font-bold text-indigo-700 px-1" value={p.up} onChange={(e)=>{if(validateNumeric(e.target.value, "Uptime", 100)) {const n=[...processes]; n[i] = {...n[i], up: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Yield %" tooltip="First Pass Yield" isPdf={isGeneratingPDF} colorClass="text-emerald-600"/> {isGeneratingPDF ? <div className="font-bold text-emerald-700">{p.yield||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-emerald-200 bg-transparent font-bold text-emerald-700 px-1" value={p.yield} onChange={(e)=>{if(validateNumeric(e.target.value, "Yield", 100)) {const n=[...processes]; n[i] = {...n[i], yield: e.target.value}; if(e.target.value!==""&&globals.demand>0) n[i].defects=Math.max(0, globals.demand*(100-parseFloat(e.target.value))/100).toFixed(0); setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Defects" tooltip="Scrap Units" isPdf={isGeneratingPDF} colorClass="text-red-500"/> {isGeneratingPDF ? <div className="font-bold text-red-600">{p.defects||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-red-200 bg-transparent font-bold text-red-600 px-1" value={p.defects} onChange={(e)=>{if(validateNumeric(e.target.value, "Defects", globals.demand ? parseFloat(globals.demand) : null)) {const n=[...processes]; n[i] = {...n[i], defects: e.target.value}; if(e.target.value!==""&&globals.demand>0) n[i].yield=Math.max(0, ((globals.demand-parseFloat(e.target.value))/globals.demand)*100).toFixed(1); setProcesses(n);}}}/>}</div>
                                            
                                            {/* GEMBA Ext */}
                                            <div className="col-span-2 border-t border-slate-200 my-1 pt-2"></div>
                                            <div><TooltipLabel label={`Man CT (${unitLabel})`} tooltip="Manual Touch Time" isPdf={isGeneratingPDF} colorClass="text-slate-500"/> {isGeneratingPDF ? <div className="font-bold text-slate-700">{p.manualCt||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.manualCt} onChange={(e)=>{if(validateNumeric(e.target.value, "Manual CT")) {const n=[...processes]; n[i] = {...n[i], manualCt: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label={`Mach CT (${unitLabel})`} tooltip="Machine Run Time" isPdf={isGeneratingPDF} colorClass="text-slate-500"/> {isGeneratingPDF ? <div className="font-bold text-slate-700">{p.machineCt||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.machineCt} onChange={(e)=>{if(validateNumeric(e.target.value, "Machine CT")) {const n=[...processes]; n[i] = {...n[i], machineCt: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Batch Size" tooltip="Processing Lot" isPdf={isGeneratingPDF} colorClass="text-slate-500"/> {isGeneratingPDF ? <div className="font-bold text-slate-700">{p.batchSize||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-slate-300 bg-transparent font-bold px-1" value={p.batchSize} onChange={(e)=>{if(validateNumeric(e.target.value, "Batch Size")) {const n=[...processes]; n[i] = {...n[i], batchSize: e.target.value}; setProcesses(n);}}}/>}</div>
                                            <div><TooltipLabel label="Rework %" tooltip="Correction loops" isPdf={isGeneratingPDF} colorClass="text-amber-600"/> {isGeneratingPDF ? <div className="font-bold text-amber-700">{p.rework||'-'}</div> : <input type="text" inputMode="decimal" className="w-full border-b border-amber-200 bg-transparent font-bold text-amber-700 px-1" value={p.rework} onChange={(e)=>{if(validateNumeric(e.target.value, "Rework", 100)) {const n=[...processes]; n[i] = {...n[i], rework: e.target.value}; setProcesses(n);}}}/>}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* SECTION 3: METRICS ENGINE & SUMMARY */}
                        <section className="page-break-avoid space-y-6">
                            <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2 border-b-2 border-slate-200 pb-2">
                                <BarChart3 size={18} className="text-emerald-600"/> 3. Performance Analytics & Insights
                            </h2>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* KPI Cards */}
                                <div className="lg:col-span-1 space-y-4">
                                    <div className="bg-slate-900 text-white p-5 rounded-xl border border-slate-800 shadow-lg">
                                        <TooltipLabel label="System Lead Time" tooltip="Total time through facility" colorClass="text-slate-400" isPdf={isGeneratingPDF}/>
                                        <div className="text-3xl font-black text-emerald-400">{results.raw_lt} <span className="text-sm text-emerald-200/50 uppercase">Days</span></div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-5 rounded-xl border border-slate-800 shadow-lg">
                                        <TooltipLabel label="Flow Efficiency" tooltip="Value Added Ratio" colorClass="text-slate-400" isPdf={isGeneratingPDF}/>
                                        <div className="text-3xl font-black text-blue-400">{results.raw_pce}%</div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-5 rounded-xl border border-slate-800 shadow-lg">
                                        <TooltipLabel label="Rolled Throughput Yield" tooltip="Total Defect-Free Probability" colorClass="text-slate-400" isPdf={isGeneratingPDF}/>
                                        <div className="text-3xl font-black text-yellow-400">{results.raw_rty}%</div>
                                    </div>
                                </div>

                                {/* Executive Summary */}
                                <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 p-6 md:p-8 flex flex-col justify-center shadow-sm">
                                    <div className="flex items-center gap-2 mb-4">
                                        <FileText size={20} className="text-indigo-600"/>
                                        <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest">Executive Summarization</h3>
                                    </div>
                                    <p className="text-slate-600 leading-relaxed font-medium text-lg italic">
                                        "{execSummary}"
                                    </p>
                                    <div className="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs font-bold text-slate-400">
                                        <span>MECTS SET...GO ENGINE LOGIC</span>
                                        <span className="bg-slate-100 px-2 py-1 rounded text-slate-600">AUTO-GENERATED</span>
                                    </div>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
