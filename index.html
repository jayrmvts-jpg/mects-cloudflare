<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECTS - Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; min-height: 100vh; margin: 0; }
        /* Professional hover state for your secret key area */
        .shield-tip {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            cursor: default;
            z-index: 999;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-50 flex flex-col">

    <div class="flex-grow flex flex-col md:flex-row items-stretch min-h-screen">
        
        <div class="md:w-3/5 bg-white flex flex-col items-center justify-center p-8 md:p-12 relative">
            <div class="flex flex-col items-center text-center space-y-6">
                
                <div class="relative inline-block">
                    <img src="MECTS 1000 SHIELD TRANSPARENT.png" alt="MECTS Shield" 
                         class="w-72 h-auto md:w-[450px] lg:w-[520px] drop-shadow-2xl">
                    
                    <button onclick="openAdminLogs()" class="shield-tip" title="Executive System Access"></button>
                </div>
                
                <div class="max-w-2xl">
                    <h1 class="text-6xl md:text-7xl font-black text-slate-900 tracking-tighter uppercase leading-none">MECTS</h1>
                    <p class="text-slate-900 mt-2 text-xl md:text-2xl font-bold leading-tight">
                        Operational Excellence for MSME's & Corporate Digital Deployment
                    </p>
                    <div class="mt-4 border-t-2 border-slate-900 pt-4">
                        <p class="text-slate-900 text-sm md:text-base tracking-[0.15em] uppercase font-black">
                            Training • Mentoring • Consultancy • Assessment Platforms
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:w-2/5 bg-blue-900 flex flex-col items-center justify-center p-10 md:p-12 text-white border-l border-blue-800">
            <div class="w-full max-w-sm space-y-6 bg-blue-950 p-8 rounded-3xl shadow-2xl border border-blue-800">
                
                <header class="text-center">
                    <h2 class="text-2xl font-bold tracking-tight text-white uppercase italic">Executive Access</h2>
                    <p class="mt-1 text-[10px] text-blue-300 font-bold tracking-widest uppercase text-center">Strict Session Control Active</p>
                </header>

                <div class="space-y-4">
                    <input id="email" type="email" placeholder="Corporate Email" 
                           class="w-full px-4 py-3 bg-blue-900/50 text-white rounded-xl border border-blue-700 focus:ring-2 focus:ring-cyan-500 focus:outline-none placeholder:text-blue-700 font-semibold">
                    <input id="password" type="password" placeholder="Access Key" 
                           class="w-full px-4 py-3 bg-blue-900/50 text-white rounded-xl border border-blue-700 focus:ring-2 focus:ring-cyan-500 focus:outline-none placeholder:text-blue-700 font-semibold">

                    <button onclick="loginWithEmail()" type="button" 
                            class="w-full bg-cyan-500 text-blue-950 font-black py-4 rounded-xl hover:bg-cyan-400 transition-all shadow-lg active:scale-95 uppercase tracking-widest">
                        Login to Suite
                    </button>
                </div>

                <div class="relative py-1 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-blue-800"></div></div>
                    <span class="relative bg-blue-950 px-4 font-bold text-blue-500 text-[10px] uppercase tracking-widest">Verify Identity</span>
                </div>

                <button onclick="loginWithGoogle()" 
                    class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition-all shadow-md active:scale-95">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" class="w-5 h-5">
                    <span>Continue with Google</span>
                </button>

                <footer class="mt-6 text-center">
                    <p id="errorField" class="text-red-400 font-bold text-[10px] uppercase mb-4"></p>
                    <p class="text-blue-600 font-black tracking-[0.3em] uppercase text-[10px]">MECTS SET GO</p>
                </footer>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmm9CtegBIxFIuovOKk76ifmLueACHQWs",
            authDomain: "mects-login-lss-msme.firebaseapp.com",
            projectId: "mects-login-lss-msme",
            appId: "1:338870341775:web:f5a5e783ae59a538b725c8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ADMIN HOTSPOT FUNCTION
        window.openAdminLogs = () => {
            const key = prompt("ENTER MECTS EXECUTIVE KEY:");
            if (key === "1968") {
                window.location.href = "https://console.firebase.google.com/project/mects-login-lss-msme/firestore/data/~2FAuditTrail";
            } else if (key !== null) {
                alert("ACCESS DENIED");
            }
        };

        // AUDIT LOGGING
        async function logActivity(user) {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const geo = await res.json();
                
                await setDoc(doc(db, "AuditTrail", user.uid), {
                    email: user.email,
                    loginTime: serverTimestamp(),
                    ip: geo.ip || "Unknown",
                    location: `${geo.city || 'Unknown'}, ${geo.region || 'India'}`,
                    status: "Active Session"
                }, { merge: true });
                return true;
            } catch(e) { 
                return false;
            }
        }

        // AUTH STATE
        onAuthStateChanged(auth, async (user) => { 
            if (user) {
                await logActivity(user);
                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 1000); 
            } 
        });

        window.loginWithGoogle = () => signInWithPopup(auth, provider);
        window.loginWithEmail = () => {
            const e = document.getElementById("email").value;
            const p = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, e, p).catch(() => {
                document.getElementById("errorField").innerText = "UNAUTHORIZED ACCESS";
            });
        };
    </script>
</body>
</html>
