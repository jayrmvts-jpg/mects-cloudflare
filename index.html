<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECTS - Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <div class="flex-grow flex flex-col md:flex-row items-stretch">
        
        <div class="md:w-3/5 bg-white flex flex-col items-center justify-center p-6 md:p-12">
            <div class="flex flex-col items-center text-center space-y-4">
                <img src="MECTS 1000 SHIELD TRANSPARENT.png" alt="MECTS Shield" 
                     class="w-64 h-auto md:w-[400px] lg:w-[480px] drop-shadow-xl">
                
                <div class="max-w-2xl">
                    <h1 class="text-5xl md:text-6xl font-black text-slate-900 tracking-tighter uppercase leading-none">MECTS</h1>
                    <p class="text-slate-900 mt-2 text-lg md:text-xl font-bold leading-tight">
                        Operational Excellence for MSME's & Corporate Digital Deployment
                    </p>
                    <div class="mt-4 border-t-2 border-slate-900 pt-4">
                        <p class="text-slate-900 text-xs md:text-sm tracking-[0.15em] uppercase font-black">
                            Training • Mentoring • Consultancy • Assessment Platforms
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:w-2/5 bg-blue-900 flex flex-col items-center justify-center p-10 md:p-12 text-white">
            <div class="w-full max-w-sm space-y-8 bg-blue-950 p-8 rounded-3xl shadow-2xl border border-blue-800">
                
                <header class="text-center">
                    <h2 class="text-2xl font-bold tracking-tight text-white uppercase italic">Executive Suite Access</h2>
                    <p class="mt-1 text-sm text-blue-300 font-medium">Authentication Required for Every Session</p>
                </header>

                <form class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-blue-200 uppercase tracking-widest mb-1 ml-1">Corporate Email</label>
                        <input id="email" type="email" required placeholder="ceo@company.com" 
                               class="w-full px-4 py-3 bg-blue-900/50 text-white rounded-xl border border-blue-700 focus:ring-2 focus:ring-cyan-500 focus:outline-none transition-all placeholder:text-blue-800">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-blue-200 uppercase tracking-widest mb-1 ml-1">Access Key</label>
                        <input id="password" type="password" required placeholder="••••••••" 
                               class="w-full px-4 py-3 bg-blue-900/50 text-white rounded-xl border border-blue-700 focus:ring-2 focus:ring-cyan-500 focus:outline-none transition-all placeholder:text-blue-800">
                    </div>

                    <button onclick="loginWithEmail()" type="button" 
                            class="w-full bg-cyan-500 text-blue-950 font-black py-4 rounded-xl hover:bg-cyan-400 transition-all shadow-lg">
                        ACCESS DASHBOARD
                    </button>
                </form>

                <div class="relative py-1 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-blue-800"></div></div>
                    <span class="relative bg-blue-950 px-4 font-bold text-blue-500 text-[10px] uppercase tracking-widest">Verify via Google SSO</span>
                </div>

                <button onclick="loginWithGoogle()" 
                    class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition-all shadow-md">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" class="w-5 h-5">
                    <span>Continue with Google</span>
                </button>

                <footer class="mt-6 space-y-4 text-center">
                    <p id="errorField" class="text-red-400 font-bold text-[10px] uppercase"></p>
                    <p id="successField" class="text-cyan-400 font-bold text-[10px] uppercase"></p>
                    <p class="text-blue-400 text-xs font-medium">
                        Need Access? <button onclick="signUpWithEmail()" class="text-white underline font-bold ml-1">Request New Account</button>
                    </p>
                    <div class="pt-4 border-t border-blue-900">
                        <p class="text-blue-600 font-black tracking-[0.3em] uppercase text-xs">MECTS SET GO</p>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmm9CtegBIxFIuovOKk76ifmLueACHQWs",
            authDomain: "mects-login-lss-msme.firebaseapp.com",
            projectId: "mects-login-lss-msme",
            appId: "1:338870341775:web:f5a5e783ae59a538b725c8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // FORCED CONTROL: Tell Google to always show the "Choose an account" screen
        provider.setCustomParameters({ prompt: 'select_account' });

        onAuthStateChanged(auth, (user) => { 
            if (user) {
                window.location.replace("dashboard.html"); 
            }
        });

        window.loginWithGoogle = () => {
            // Re-ensure the prompt is set before every click
            provider.setCustomParameters({ prompt: 'select_account' });
            signInWithPopup(auth, provider).catch(e => { 
                document.getElementById("errorField").innerText = "Authentication Interrupted"; 
            });
        };

        window.signUpWithEmail = () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            if(!email || pass.length < 6) { document.getElementById("errorField").innerText="Email & 6-char password required."; return; }
            createUserWithEmailAndPassword(auth, email, pass)
                .then(() => { document.getElementById("successField").innerText = "Success! Log in now."; })
                .catch(e => { document.getElementById("errorField").innerText = "Error: " + e.code; });
        };

        window.loginWithEmail = () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => { document.getElementById("errorField").innerText = "Invalid Credentials."; });
        };
    </script>
</body>
</html>
